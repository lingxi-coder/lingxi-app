name: Android full client diagnostic
on:
  push:
    branches: [codex/media-android-app-full-9b8e]
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"
jobs:
  mobile-linux-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install source policy scan dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate mobile Linux authorization, rootfs, and store policy
        run: bash scripts/mobile-linux/smoke.sh

      - name: Test mobile Linux rootfs tooling
        run: bash scripts/tests/test-rootfs-tooling.sh

      - name: Test Android rootfs CI wiring
        run: python3 apps/android/native/scripts/test-ci-rootfs-evidence.py

  # ---------------------------------------------------------------------------
  # 1. node-clients — shared TS SDK + Electron typecheck (ubuntu).
  #    The Electron app depends on the shared SDK via `file:../../packages/bridge-client`, so the
  #    shared package MUST be built (tsc emit) before electron's typecheck can
  #    resolve `@lingxi/bridge-client`. Both steps therefore live in one job and
  #    run sequentially: shared first, electron second.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    needs: mobile-linux-policy
    env:
      LINGXI_MOBILE_LINUX_ENABLED: ${{ vars.LINGXI_MOBILE_LINUX_ENABLED || '0' }}
      LINGXI_MOBILE_LINUX_AUTHORIZATION_SHA256: ${{ vars.LINGXI_MOBILE_LINUX_AUTHORIZATION_SHA256 || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Rust toolchain pinned to the workspace MSRV, with the two Android ABIs
      # the AAR cdylib is cross-compiled for (arm64-v8a + x86_64).
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # cargo-ndk drives the per-ABI cross-compile inside build-jni.sh.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test Android CI build wiring
        run: |
          python3 apps/android/native/scripts/test-ci-build.py
          python3 apps/android/native/scripts/test-ci-emulator.py

      - name: Create temporary Android debug signing key
        run: bash apps/android/native/scripts/prepare-ci-debug-keystore.sh

      # Installs the Android SDK + command-line tools and exports
      # ANDROID_HOME / ANDROID_SDK_ROOT for later steps.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Install a concrete NDK (>= the one the project expects) and export
      # ANDROID_NDK_HOME so build-jni.sh uses it directly instead of guessing
      # the newest installed NDK.
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install the pinned GStreamer Android SDK
        run: python3 scripts/ci/gstreamer_sdk.py android --root "$RUNNER_TEMP/gstreamer-sdk/android"

      # Gradle build cache + dependency cache (also provisions Gradle itself).
      - uses: gradle/actions/setup-gradle@v4

      # Build the gitignored integration artifacts (libandroid_aar.so per ABI +
      # Kotlin UniFFI bindings) that the Gradle project links against.
      - name: Verify pinned MobileLinux sources and release metadata
        run: |
          bash apps/android/native/scripts/verify-mobile-linux-pins.sh
          bash scripts/tests/test-rootfs-tooling.sh
          sdk_root="$(python3 scripts/lib/mobile_linux_source.py --root)"
          rootfs_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["rootfs_version"])' "$sdk_root/docs/toolchains/runtime-pins.json")"
          evidence="$sdk_root/docs/mobile-linux/releases/$rootfs_version/arm64-v8a"
          bash "$sdk_root/scripts/rootfs/check-rootfs-manifest.sh" "$evidence/rootfs-manifest.json"
          python3 "$sdk_root/scripts/rootfs/verify-evidence.py" --evidence-dir "$evidence"

      - name: Build Store and Full native runtimes from source
        run: |
          bash apps/android/native/scripts/build-mobile-linux-native.sh --variant play
          bash apps/android/native/scripts/build-mobile-linux-native.sh --variant direct

      - name: Fetch verified SDK release rootfs assets
        run: |
          python3 scripts/mobile-linux/fetch-sdk-rootfs.py --output "$RUNNER_TEMP/sdk-rootfs"

      # Unit tests + debug APK + androidTest APK. The androidTest APK is what
      # the emulator job (job 3) installs and runs. Gradle stages the fetched
      # evidence itself, retaining the locked SDK and native artifact checks.
      - name: Gradle — Store/Full tests and APKs
        working-directory: apps/android/native
        run: |
          # The generated UniFFI bindings are large. Avoid concurrent flavor
          # compiles and give the separate Kotlin daemon a bounded 4 GiB heap.
          ./gradlew --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g \
            "-PlingxiRootfsEvidenceDir=$RUNNER_TEMP/sdk-rootfs" \
            :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest \
            :app:assemblePlayDebug :app:assembleDirectDebug \
            :app:assemblePlayDebugAndroidTest :app:assembleDirectDebugAndroidTest

  # ---------------------------------------------------------------------------
  # 3. android-emulator — Play/Direct connected suites and staged acceptance.
  #    Runs EngineRoundtripTest.kt on a booted AVD via the emulator-runner
  #    action. emulator-runner jobs are FRESH (no artifacts from job 2), so this
  #    job repeats the full rust + cargo-ndk + java + ndk setup AND re-runs
  #    build-jni.sh so jniLibs exist before connectedDebugAndroidTest builds the
  #    real on-device engine. KEYLESS: the round-trip asserts a terminal
  #    Error/TurnEnded, the expected no-API-key outcome.
  # ---------------------------------------------------------------------------
  android-emulator:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # KVM hardware acceleration for the x86_64 emulator — the standard
      # ubuntu-runner permissions step (the runner user is not in `kvm`).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same engine-build prerequisites as job 2 (fresh job → set up again).
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create temporary Android debug signing key
        run: bash apps/android/native/scripts/prepare-ci-debug-keystore.sh

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install the pinned GStreamer Android SDK
        run: python3 scripts/ci/gstreamer_sdk.py android --root "$RUNNER_TEMP/gstreamer-sdk/android"

      - uses: gradle/actions/setup-gradle@v4

      # This fresh job needs both flavor-specific runtimes for the two suites.
      - name: Build Store and Full native runtimes from source
        run: |
          bash apps/android/native/scripts/build-mobile-linux-native.sh --variant play
          bash apps/android/native/scripts/build-mobile-linux-native.sh --variant direct

      - name: Fetch verified SDK release rootfs assets
        run: |
          python3 scripts/mobile-linux/fetch-sdk-rootfs.py --output "$RUNNER_TEMP/sdk-rootfs"

      # Compile before launching the emulator so the large Kotlin compiler
      # heap and emulator do not compete for the runner's memory.
      - name: Assemble emulator APKs
        working-directory: apps/android/native
        run: |
          ./gradlew --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g \
            "-PlingxiRootfsEvidenceDir=$RUNNER_TEMP/sdk-rootfs" \
            :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest \
            :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest
          ./gradlew --stop

      # api-level 30 (>= minSdk 26), x86_64 + google_apis for KVM-accelerated
      # boot. force-avd-creation + the headless/no-window emulator options are
      # the recommended CI flags for a deterministic cold boot.
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # Both installed flavors stage a real rootfs in the emulator's data partition.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 8192
          disable-animations: true
          working-directory: apps/android/native
          script: bash scripts/run-ci-emulator-tests.sh "$RUNNER_TEMP/sdk-rootfs"

  # ---------------------------------------------------------------------------
  # 4. ios — XCFramework build + Xcode simulator engine round-trip (macOS).
  #    build-xcframework.sh cross-compiles the 3 iOS rust slices + UniFFI Swift
  #    bindings; xcodegen materializes the .xcodeproj; xcodebuild runs the
  #    EngineRoundtripTests on a simulator. KEYLESS, same terminal-error
  #    assertion as the Android round-trip. Needs a macOS runner (Xcode + iOS
  #    simulators only exist there).
  # ---------------------------------------------------------------------------
