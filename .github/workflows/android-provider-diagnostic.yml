name: Android provider isolation diagnostic
on:
  push:
    branches: [codex/media-android-provider-v3-9b8e]
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build minimal provider test APKs
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/provider-probe"
          cp -R .github/diagnostics/android-provider-probe "$probe"
          cp apps/android/native/gradlew "$probe/gradlew"
          mkdir -p "$probe/gradle" "$probe/app/src/androidTest/java/com/lingxi/code/project"
          cp -R apps/android/native/gradle/wrapper "$probe/gradle/wrapper"
          cp apps/android/native/app/src/androidTest/AndroidManifest.xml "$probe/app/src/androidTest/AndroidManifest.xml"
          cp apps/android/native/app/src/androidTest/java/com/lingxi/code/project/WorkspaceTestDocuments{Provider,Activity}.java "$probe/app/src/androidTest/java/com/lingxi/code/project/"
          cd "$probe"
          ./gradlew --no-daemon --max-workers=1 :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest
      - name: Verify concurrent installation and grants
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$RUNNER_TEMP/provider-probe/run-emulator.sh"
