name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Zero-OS-deps check
        working-directory: lingxi-core
        run: |
          cargo check -p lingxi-protocol --no-default-features
          cargo check -p lingxi-core --no-default-features
          cargo check -p lingxi-traits

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: cargo test
        working-directory: lingxi-core
        run: cargo test --workspace --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        working-directory: lingxi-core
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: lingxi-core
        run: cargo clippy --workspace --all-targets -- -D warnings

  cross-compile-desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-compile core crates
        working-directory: lingxi-core
        run: |
          cross check --target ${{ matrix.target }} -p lingxi-protocol
          cross check --target ${{ matrix.target }} -p lingxi-core
          cross check --target ${{ matrix.target }} -p lingxi-traits
          cross check --target ${{ matrix.target }} -p lingxi-api-client

  cross-compile-mobile:
    runs-on: ubuntu-latest
    continue-on-error: true   # M3 scope — informational only for v0.3.0
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-compile core crates (informational)
        working-directory: lingxi-core
        run: |
          cross check --target ${{ matrix.target }} -p lingxi-protocol
          cross check --target ${{ matrix.target }} -p lingxi-core
          cross check --target ${{ matrix.target }} -p lingxi-traits
          cross check --target ${{ matrix.target }} -p lingxi-api-client
