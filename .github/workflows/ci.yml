name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  script-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install source policy scan dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Test pinned-source rejection cases
        run: |
          python3 scripts/tests/test_runtime_source.py
          python3 scripts/tests/test_product_namespace.py
          python3 scripts/tests/test_mobile_linux_source.py
          python3 scripts/tests/test_fetch_sdk_rootfs.py
          python3 scripts/tests/test_workspace_layout.py
          python3 scripts/tests/test_gstreamer_sdk.py
          python3 scripts/tests/test_mobile_gstreamer_cargo.py
          python3 scripts/tests/test_store_compliance.py
      - name: Validate both pinned runtime sources
        run: python3 scripts/checks/check-runtime-dependency.py
      - name: Test translation gate rejection cases
        run: python3 scripts/checks/test_check_i18n_pairing.py
      - name: Run every checked-in product gate
        working-directory: .
        run: ./scripts/check-all.sh
      - name: Test brand gate rejection cases
        working-directory: .
        run: python3 scripts/checks/check_brand_leaks.py --selftest
      - name: Verify every gate and the trigger chain
        working-directory: .
        run: python3 scripts/tests/test_gate_triggers.py

  unit-tests:
    # All features include statically registered GStreamer plugins. The pinned
    # source SDK supplies their archives and .pc files as well as 1.28 APIs.
    runs-on: ubuntu-22.04
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Resolve locked workspace dependencies
        run: cargo metadata --locked --format-version=1 > /dev/null
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore pinned Linux GStreamer static SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gstreamer-sdk/linux-static
          key: gstreamer-linux-static-jammy-${{ hashFiles('scripts/ci/gstreamer-sdk-lock.json', 'scripts/ci/build_gstreamer_linux.py', 'scripts/ci/gstreamer_sdk.py', 'scripts/ci/gstreamer-linux-meson-requirements.txt') }}
      - name: Install GStreamer source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex libglib2.0-dev libopus-dev libvpx-dev ninja-build pkg-config
      - name: Install pinned Meson
        run: python3 -m pip install --no-deps --require-hashes -r scripts/ci/gstreamer-linux-meson-requirements.txt
      - name: Build and validate the pinned GStreamer static SDK
        run: python3 scripts/ci/build_gstreamer_linux.py --root "$RUNNER_TEMP/gstreamer-sdk/linux-static" --static-plugins
      - name: Test all retained product packages
        working-directory: .
        run: cargo test --locked --workspace --all-features --no-fail-fast

  lint:
    # Match the GStreamer API baseline used by unit-tests and bridge-server.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Install GStreamer development libraries and required plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: cargo fmt
        working-directory: .
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: .
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  supply-chain:
    # v3 §32.4 Layers 1-3: cargo-deny + cargo-audit + cargo-vet.
    # Hard gate (per the brief: "supply-chain layer"). Per-PR run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the workspace toolchain for both builds and dependency metadata.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-deny
        # >= 0.19 required so the bundled `rustsec` parser understands the
        # CVSS-4.0 advisory entries now present in the live RUSTSEC DB.
        run: cargo install cargo-deny --locked --version '^0.19'
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version '^0.10'
      - name: cargo deny check
        working-directory: .
        # Uses deny.toml for license/advisory/duplicate-version
        # policy. Runs under the workspace toolchain so the metadata
        # pass can parse the edition2024 WASI manifest. The architectural
        # dependency-graph rules (design §8.1) are a separate step below.
        run: cargo deny check
      - name: cargo audit
        working-directory: .
        run: cargo audit --deny warnings
      - name: cargo vet
        working-directory: .
        # Source review is a separate hard gate; vulnerability scans do not replace it.
        run: cargo vet check --locked
