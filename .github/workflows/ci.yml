name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  script-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Test pinned-source rejection cases
        run: |
          python3 scripts/tests/test_runtime_source.py
          python3 scripts/tests/test_mobile_linux_source.py
          python3 scripts/tests/test_workspace_layout.py
      - name: Validate both pinned runtime sources
        run: python3 scripts/checks/check-runtime-dependency.py
      - name: Run every checked-in product gate
        working-directory: .
        run: ./scripts/check-all.sh
      - name: Test brand gate rejection cases
        working-directory: .
        run: python3 scripts/checks/check_brand_leaks.py --selftest
      - name: Verify every gate and the trigger chain
        working-directory: .
        run: python3 scripts/tests/test_gate_triggers.py
      - name: Native Host and pinned runtime template integration
        working-directory: .
        run: node --test scripts/tests/test-local-app-r4-libs.mjs

  unit-tests:
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Test all retained product packages
        working-directory: .
        run: cargo test --locked --workspace --all-features --no-fail-fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        working-directory: .
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: .
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  supply-chain:
    # v3 §32.4 Layers 1-3: cargo-deny + cargo-audit + cargo-vet.
    # Hard gate (per the brief: "supply-chain layer"). Per-PR run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the workspace toolchain for both builds and dependency metadata.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-deny
        # >= 0.19 required so the bundled `rustsec` parser understands the
        # CVSS-4.0 advisory entries now present in the live RUSTSEC DB.
        run: cargo install cargo-deny --locked --version '^0.19'
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version '^0.10'
      - name: cargo deny check
        working-directory: .
        # Uses deny.toml for license/advisory/duplicate-version
        # policy. Runs under the workspace toolchain so the metadata
        # pass can parse the edition2024 WASI manifest. The architectural
        # dependency-graph rules (design §8.1) are a separate step below.
        run: cargo deny check
      - name: cargo audit
        working-directory: .
        run: cargo audit --deny warnings
      - name: cargo vet
        working-directory: .
        # Source review is a separate hard gate; vulnerability scans do not replace it.
        run: cargo vet check --locked
