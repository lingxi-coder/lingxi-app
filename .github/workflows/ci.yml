name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Zero-OS-deps check
        working-directory: lingxi-code
        run: |
          cargo check -p lingxi-protocol --no-default-features
          cargo check -p lingxi-core --no-default-features
          cargo check -p lingxi-traits

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: cargo test
        working-directory: lingxi-code
        run: cargo test --workspace --all-features

  pty-runtime-linux:
    name: PTY runtime (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Exercise real Linux PTY and process groups
        working-directory: lingxi-code
        env:
          RUST_BACKTRACE: "1"
        run: cargo test -p platform-pty -- --nocapture --test-threads=1

  pty-runtime-windows:
    name: PTY runtime (Windows ConPTY)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Exercise real ConPTY and kill-on-close Job Object
        working-directory: lingxi-code
        env:
          RUST_BACKTRACE: "1"
        run: cargo test -p platform-pty -- --nocapture --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        working-directory: lingxi-code
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: lingxi-code
        run: cargo clippy --workspace --all-targets -- -D warnings

  cross-compile-desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-compile core crates
        working-directory: lingxi-code
        run: |
          cross check --target ${{ matrix.target }} -p lingxi-protocol
          cross check --target ${{ matrix.target }} -p lingxi-core
          cross check --target ${{ matrix.target }} -p lingxi-traits
          cross check --target ${{ matrix.target }} -p lingxi-api-client

  cross-compile-mobile:
    runs-on: ubuntu-latest
    continue-on-error: true   # M3 scope — informational only for v0.3.0
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-compile core crates (informational)
        working-directory: lingxi-code
        run: |
          cross check --target ${{ matrix.target }} -p lingxi-protocol
          cross check --target ${{ matrix.target }} -p lingxi-core
          cross check --target ${{ matrix.target }} -p lingxi-traits
          cross check --target ${{ matrix.target }} -p lingxi-api-client

  cross-compile-musl:
    # v3 §32.4 Layer 5: confirm the engine still type-checks against musl.
    # Hard gate (not continue-on-error) — musl is an inherited M3 target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo check (musl)
        working-directory: lingxi-code
        run: |
          # Per spec line 608: musl is a check-only gate (NOT build/test) —
          # confirms the engine type-checks against musl, no runtime needed.
          cargo check --target x86_64-unknown-linux-musl \
                      -p lingxi-protocol \
                      -p lingxi-core \
                      -p lingxi-traits \
                      -p lingxi-api-client

  supply-chain:
    # v3 §32.4 Layers 1-3: cargo-deny + cargo-audit + cargo-vet.
    # Hard gate (per the brief: "supply-chain layer"). Per-PR run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny's metadata pass must PARSE every manifest in the lock,
      # including the WASI-only `wit-bindgen 0.57.x` whose manifest declares
      # `edition = "2024"` — unparseable by the workspace MSRV (1.82). Pin a
      # newer toolchain for THIS job only (the workspace still BUILDS on 1.82
      # because that WASI branch never compiles for the host target). See the
      # TOOLCHAIN NOTE header in lingxi-code/deny.toml (M10 F3-00).
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-deny
        # >= 0.19 required so the bundled `rustsec` parser understands the
        # CVSS-4.0 advisory entries now present in the live RUSTSEC DB.
        run: cargo install cargo-deny --locked --version '^0.19'
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version '^0.21'
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version '^0.10'
      - name: cargo deny check
        working-directory: lingxi-code
        # Uses lingxi-code/deny.toml for license/advisory/duplicate-version
        # policy. Runs under the 1.85.0 toolchain pinned above so the metadata
        # pass can parse the edition2024 WASI manifest. The architectural
        # dependency-graph rules (design §8.1) are a separate step below.
        run: cargo deny check
      - name: scripts/check-deps.sh (M8 dependency-graph gate)
        working-directory: lingxi-code
        # Enforces the composition-root edges (tool independence, platform
        # isolation, apps-are-leaves, API-crate purity). Pure cargo-metadata +
        # python3 — no extra toolchain. See scripts/check_deps.py.
        run: ./scripts/check-deps.sh
      - name: cargo audit
        working-directory: lingxi-code
        run: cargo audit --deny warnings
      - name: cargo vet
        working-directory: lingxi-code
        # vet requires supply-chain/ directory with audits. If absent,
        # `cargo vet check --locked` prints a setup hint without failing
        # (the directory lives outside this plan's scope; M4 deliverable).
        run: cargo vet check --locked || echo "::warning::cargo vet supply-chain/ not yet configured; v0.4.0 ships the workflow, M4 adds the audit data"

  parity-fixtures:
    # Per the brief: "add parity-fixture gating (every parity_*.rs driver
    # from M3-01..M3-06 in per-PR test matrix)". This job runs ALL parity
    # drivers — both the 7 M2 drivers (inherited from v0.3.0) and the 9
    # M3 drivers (8 from M3-01..M3-06 + the v0.4.0 smoke fixture from
    # Phase D).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: cargo test parity_* drivers
        working-directory: lingxi-code
        run: |
          # The 'parity_*' glob picks up every test driver matching the
          # convention. As of v0.4.0:
          # M2 (7): parity_keychain_service_name, parity_lsp_plugin_only,
          #        parity_mcp_initialize, parity_mcp_transports,
          #        parity_sandbox_config, parity_tmux_windows,
          #        parity_worktree_naming.
          # M3 (9): parity_settings_merge, parity_memory_loading,
          #        parity_memory_relevance, parity_messages_create,
          #        parity_betas, parity_oauth_pkce_refresh,
          #        parity_cost_events, parity_tengu_events,
          #        parity_full_v0_4_0_smoke.
          cargo test -p lingxi-test-harness --test 'parity_*'
