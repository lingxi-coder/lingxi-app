name: codec-worker-diagnostic

on:
  push:
    branches: [codex/codec-worker-diagnostic-20261028]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  RUST_MIN_STACK: '16777216'
  # Use the same pinned compiler as rust-toolchain.toml without asking rustup
  # to mutate preinstalled rustfmt/clippy components during these test jobs.
  RUSTUP_TOOLCHAIN: '1.94.0'

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify the pinned Rust compiler
        run: |
          grep -Fx 'channel = "1.94.0"' rust-toolchain.toml
          rustc --version | grep -E '^rustc 1\.94\.0 '
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the pinned official GStreamer SDK
        run: python3 scripts/ci/gstreamer_sdk.py macos --root "$RUNNER_TEMP/gstreamer-sdk/macos"
      - name: Select the installed plugin directory
        shell: bash
        run: |
          plugin_dir="$("$PKG_CONFIG" --variable=pluginsdir gstreamer-1.0)"
          test -d "$plugin_dir"
          printf 'LINGXI_GSTREAMER_PLUGIN_DIR=%s\n' "$plugin_dir" >> "$GITHUB_ENV"
          # Match the existing desktop workflow for unpackaged Rust binaries.
          # The child clears loader variables, so the SDK rpath must be linked in.
          sdk_lib="${LINGXI_GSTREAMER_SDK_MACOS:?SDK was not configured}/lib"
          test -f "$sdk_lib/libgstvideo-1.0.0.dylib"
          printf 'RUSTFLAGS=-C link-arg=-Wl,-rpath,%s\n' "$sdk_lib" >> "$GITHUB_ENV"
          "$PKG_CONFIG" --modversion gstreamer-1.0
      - name: Verify the exact locked Harness source
        shell: bash
        run: |
          python3 scripts/lib/runtime_source.py --json > "$RUNNER_TEMP/harness-source.json"
          python3 - "$RUNNER_TEMP/harness-source.json" <<'PY'
          import json, sys
          source = json.load(open(sys.argv[1], encoding='utf8'))
          expected = '41ead2ca341e4ef259faf8b101da4e552f9cf40e'
          assert source['revision'] == expected, source
          assert source['development'] is False, source
          print('Verified canonical locked Harness revision', source['revision'])
          PY
      - name: Test worker audio, crash and startup cancellation
        run: cargo test --locked -p remote-control-client --features native-media --test codec_worker -- --test-threads=1 --color never
      - name: Test codec clock origin when startup precedes the requested margin
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p remote-control-client --features native-media --lib isolated_codec::clock_origin::tests:: -- --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/clock-origin-test.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/clock-origin-test.log"
      - name: Test codec connection authentication and lane isolation
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p remote-control-client --features native-media --lib isolated_codec::tests::codec_auth_rejects_wrong_token_and_lane_before_accepting_valid_peer -- --exact --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/codec-auth-test.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/codec-auth-test.log"
      - name: Test real local and isolated RemoteMediaConnector loopbacks
        run: cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback production_ -- --test-threads=1 --color never
      - name: Test the actual Bridge binary codec entry
        run: cargo test --locked -p bridge-server --test desktop_codec_worker -- --test-threads=1 --color never
      - name: Run isolated loopbacks with the actual Bridge worker binary
        shell: bash
        run: |
          set -o pipefail
          export LINGXI_TEST_CODEC_WORKER_BINARY="$GITHUB_WORKSPACE/target/debug/bridge-server"
          test -x "$LINGXI_TEST_CODEC_WORKER_BINARY"
          shasum -a 256 "$LINGXI_TEST_CODEC_WORKER_BINARY"
          test_log="$RUNNER_TEMP/bridge-worker-loopback.log"
          cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback _isolated -- --test-threads=1 --nocapture --color never 2>&1 | tee "$test_log"
          grep -F "Using actual Bridge codec worker: $LINGXI_TEST_CODEC_WORKER_BINARY" "$test_log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$test_log"
      - name: Exercise official SDK GIO and installer paths under the real worker launch
        run: python3 scripts/ci/probe_codec_worker_gio.py --bridge "$GITHUB_WORKSPACE/target/debug/bridge-server" --expect blocked
      - name: Negative control rejects a missing Bridge worker binary
        shell: bash
        run: |
          export LINGXI_TEST_CODEC_WORKER_BINARY="$RUNNER_TEMP/missing-bridge-worker"
          test_log="$RUNNER_TEMP/bridge-worker-missing-negative.log"
          if cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback production_camera_peer_is_observed_and_persisted_as_png_on_the_host_isolated -- --exact --test-threads=1 --nocapture --color never > "$test_log" 2>&1; then
            cat "$test_log"
            echo 'missing worker was incorrectly accepted' >&2
            exit 1
          fi
          cat "$test_log"
          grep -F 'assertion failed: executable.is_absolute() && executable.is_file()' "$test_log"
      - name: Verify timestamp and environment tests reject controlled regressions
        run: python3 scripts/ci/probe_codec_negative_controls.py "$GITHUB_WORKSPACE/target/debug/bridge-server"
      - name: Verify HOME and temporary-directory isolation with a real subprocess
        run: python3 scripts/ci/probe_codec_environment_negative.py
      - name: Observe idle Bridge media loads and selected API calls
        run: python3 scripts/ci/probe_bridge_media_environment.py --bridge "$GITHUB_WORKSPACE/target/debug/bridge-server"

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Enable Windows long paths and Git symlinks
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Ensure Windows crypto assembler is available
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Verify the pinned Rust compiler
        shell: bash
        run: |
          grep -Fx 'channel = "1.94.0"' rust-toolchain.toml
          rustc --version | grep -E '^rustc 1\.94\.0 '
      - name: Install the pinned official GStreamer SDK
        shell: bash
        run: python3 scripts/ci/gstreamer_sdk.py windows --root "$RUNNER_TEMP/gstreamer-sdk/windows"
      - name: Select the installed plugin directory
        shell: bash
        run: |
          plugin_dir="$("$PKG_CONFIG" --variable=pluginsdir gstreamer-1.0)"
          test -d "$plugin_dir"
          printf 'LINGXI_GSTREAMER_PLUGIN_DIR=%s\n' "$plugin_dir" >> "$GITHUB_ENV"
          "$PKG_CONFIG" --modversion gstreamer-1.0
      - name: Verify the exact locked Harness source
        shell: bash
        run: |
          python3 scripts/lib/runtime_source.py --json > "$RUNNER_TEMP/harness-source.json"
          python3 - "$RUNNER_TEMP/harness-source.json" <<'PY'
          import json, sys
          source = json.load(open(sys.argv[1], encoding='utf8'))
          expected = '41ead2ca341e4ef259faf8b101da4e552f9cf40e'
          assert source['revision'] == expected, source
          assert source['development'] is False, source
          print('Verified canonical locked Harness revision', source['revision'])
          PY
      - name: Test real Windows worker and hostile parent environment
        run: cargo test --locked -p remote-control-client --features native-media --test codec_worker -- --test-threads=1 --nocapture --color never
      - name: Verify HOME, temporary-directory and Windows system-root negative controls
        run: python scripts/ci/probe_codec_environment_negative.py

  linux-static:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify the pinned Rust compiler
        run: |
          grep -Fx 'channel = "1.94.0"' rust-toolchain.toml
          rustc --version | grep -E '^rustc 1\.94\.0 '
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned Linux GStreamer static SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-sdk/linux-static
          key: gstreamer-linux-static-jammy-${{ hashFiles('scripts/ci/gstreamer-sdk-lock.json', 'scripts/ci/build_gstreamer_linux.py', 'scripts/ci/gstreamer_sdk.py', 'scripts/ci/gstreamer-linux-meson-requirements.txt') }}
      - name: Install GStreamer source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libglib2.0-dev libopus-dev libvpx-dev ninja-build pkg-config
      - name: Install pinned Meson
        run: python3 -m pip install --no-deps --require-hashes -r scripts/ci/gstreamer-linux-meson-requirements.txt
      - name: Build and validate the pinned GStreamer static SDK
        run: python3 scripts/ci/build_gstreamer_linux.py --root "$RUNNER_TEMP/gstreamer-sdk/linux-static" --static-plugins
      - name: Test static worker without a configured dynamic plugin directory
        shell: bash
        run: |
          unset LINGXI_GSTREAMER_PLUGIN_DIR
          set -o pipefail
          cargo test --locked -p remote-control-client --features static-media --test codec_worker static_plugins_start_without_a_dynamic_plugin_directory -- --exact --test-threads=1 --nocapture --color never 2>&1 | tee "$RUNNER_TEMP/static-worker-test.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/static-worker-test.log"
