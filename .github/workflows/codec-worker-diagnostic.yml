name: codec-worker-diagnostic

on:
  push:
    branches: [codex/codec-worker-diagnostic-20261028]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  RUST_MIN_STACK: '16777216'

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the pinned official GStreamer SDK
        run: python3 scripts/ci/gstreamer_sdk.py macos --root "$RUNNER_TEMP/gstreamer-sdk/macos"
      - name: Select the installed plugin directory
        shell: bash
        run: |
          plugin_dir="$("$PKG_CONFIG" --variable=pluginsdir gstreamer-1.0)"
          test -d "$plugin_dir"
          printf 'LINGXI_GSTREAMER_PLUGIN_DIR=%s\n' "$plugin_dir" >> "$GITHUB_ENV"
          # Match the existing desktop workflow for unpackaged Rust binaries.
          # The child clears loader variables, so the SDK rpath must be linked in.
          sdk_lib="${LINGXI_GSTREAMER_SDK_MACOS:?SDK was not configured}/lib"
          test -f "$sdk_lib/libgstvideo-1.0.0.dylib"
          printf 'RUSTFLAGS=-C link-arg=-Wl,-rpath,%s\n' "$sdk_lib" >> "$GITHUB_ENV"
          "$PKG_CONFIG" --modversion gstreamer-1.0
      - name: Verify the exact locked Harness source
        shell: bash
        run: |
          python3 scripts/lib/runtime_source.py --json > "$RUNNER_TEMP/harness-source.json"
          python3 - "$RUNNER_TEMP/harness-source.json" <<'PY'
          import json, sys
          source = json.load(open(sys.argv[1], encoding='utf8'))
          expected = 'e4ca39042782efdddc01b0f93589b1b8063f7b81'
          assert source['revision'] == expected, source
          assert source['development'] is False, source
          print('Verified canonical locked Harness revision', source['revision'])
          PY
      - name: Test worker audio, crash and startup cancellation
        run: cargo test --locked -p remote-control-client --features native-media --test codec_worker -- --test-threads=1 --color never
      - name: Test real local and isolated RemoteMediaConnector loopbacks
        run: cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback production_ -- --test-threads=1 --color never
      - name: Test the actual Bridge binary codec entry
        run: cargo test --locked -p bridge-server --test desktop_codec_worker -- --test-threads=1 --color never
      - name: Run isolated loopbacks with the actual Bridge worker binary
        shell: bash
        run: |
          set -o pipefail
          export LINGXI_TEST_CODEC_WORKER_BINARY="$GITHUB_WORKSPACE/target/debug/bridge-server"
          test -x "$LINGXI_TEST_CODEC_WORKER_BINARY"
          shasum -a 256 "$LINGXI_TEST_CODEC_WORKER_BINARY"
          test_log="$RUNNER_TEMP/bridge-worker-loopback.log"
          cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback _isolated -- --test-threads=1 --nocapture --color never 2>&1 | tee "$test_log"
          grep -F "Using actual Bridge codec worker: $LINGXI_TEST_CODEC_WORKER_BINARY" "$test_log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$test_log"
      - name: Negative control rejects a missing Bridge worker binary
        shell: bash
        run: |
          export LINGXI_TEST_CODEC_WORKER_BINARY="$RUNNER_TEMP/missing-bridge-worker"
          test_log="$RUNNER_TEMP/bridge-worker-missing-negative.log"
          if cargo test --locked -p remote-control-client --features native-media --test remote_media_loopback production_camera_peer_is_observed_and_persisted_as_png_on_the_host_isolated -- --exact --test-threads=1 --nocapture --color never > "$test_log" 2>&1; then
            cat "$test_log"
            echo 'missing worker was incorrectly accepted' >&2
            exit 1
          fi
          cat "$test_log"
          grep -F 'assertion failed: executable.is_absolute() && executable.is_file()' "$test_log"
