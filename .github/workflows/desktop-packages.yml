name: desktop-packages

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'apps/**'
      - 'packages/**'
      - 'resources/**'
      - 'tools/**'
      - 'build-support/**'
      - 'infra/firebase/database.rules.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'packaging/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'apps/**'
      - 'packages/**'
      - 'resources/**'
      - 'tools/**'
      - 'build-support/**'
      - 'infra/firebase/database.rules.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'packaging/**'
  workflow_dispatch:

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    # The Windows release Rust build alone took over 50 minutes on the hosted
    # runner; leave room for native process regressions and package smoke tests.
    timeout-minutes: ${{ matrix.platform == 'win32' && 120 || 90 }}
    steps:
      - name: Enable Windows long paths and Git symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.symlinks true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          # Match rust-toolchain.toml during setup, before native build steps
          # invoke rustup proxies and try to add components on demand.
          components: rustfmt, clippy

      - name: Ensure Windows crypto assembler is available
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify Windows crypto assembler
        if: matrix.platform == 'win32'
        run: nasm -v

      - name: Verify the Windows Askama Git checkout
        if: matrix.platform == 'win32'
        run: python scripts/checks/audit_askama_upstream.py --checkout-only

      - name: Restore the pinned Linux GStreamer runtime SDK cache
        if: matrix.platform == 'linux'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gstreamer-sdk/linux-source
          key: gstreamer-linux-jammy-${{ hashFiles('scripts/ci/gstreamer-sdk-lock.json', 'scripts/ci/build_gstreamer_linux.py', 'scripts/ci/gstreamer_sdk.py', 'scripts/ci/gstreamer-linux-meson-requirements.txt') }}

      - name: Install Linux GStreamer source-build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libglib2.0-dev \
            libopus-dev \
            libvpx-dev \
            ninja-build \
            pkg-config

      - name: Install pinned Meson for the GStreamer 1.28.8 source build
        if: matrix.platform == 'linux'
        run: python3 -m pip install --no-deps --require-hashes -r scripts/ci/gstreamer-linux-meson-requirements.txt

      - name: Build the pinned upstream Linux GStreamer SDK
        if: matrix.platform == 'linux'
        run: python3 scripts/ci/build_gstreamer_linux.py --root "$RUNNER_TEMP/gstreamer-sdk/linux-source"

      - name: Stage the Linux GStreamer package SDK
        if: matrix.platform == 'linux'
        run: python3 scripts/ci/gstreamer_sdk.py linux --root "$RUNNER_TEMP/gstreamer-sdk/linux"

      - name: Install the pinned macOS GStreamer SDK
        if: matrix.platform == 'darwin'
        run: python3 scripts/ci/gstreamer_sdk.py macos --root "$RUNNER_TEMP/gstreamer-sdk/macos"

      - name: Install the pinned Windows GStreamer SDK
        if: matrix.platform == 'win32'
        shell: bash
        run: python3 scripts/ci/gstreamer_sdk.py windows --root "$RUNNER_TEMP/gstreamer-sdk/windows"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/bridge-client/package-lock.json
            apps/electron/package-lock.json

      - name: Install Mod source compiler
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Remap build-machine paths
        shell: bash
        run: |
          rust_flags="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace --remap-path-prefix=${CARGO_HOME}=/cargo"
          if [[ '${{ matrix.platform }}' == 'darwin' ]]; then
            sdk_lib="${LINGXI_GSTREAMER_SDK_MACOS:?macOS GStreamer SDK was not configured}/lib"
            case '${{ matrix.arch }}' in
              arm64) sdk_arch=arm64 ;;
              x64) sdk_arch=x86_64 ;;
              *) echo 'Unsupported macOS GStreamer architecture' >&2; exit 1 ;;
            esac
            for dylib in libgstreamer-1.0.0.dylib libgstbase-1.0.0.dylib \
              libgstapp-1.0.0.dylib libgstaudio-1.0.0.dylib libgstvideo-1.0.0.dylib; do
              test -f "$sdk_lib/$dylib"
              /usr/bin/lipo -verify_arch "$sdk_arch" "$sdk_lib/$dylib"
            done
            # The unpackaged Rust executables need the SDK to resolve @rpath.
            # Packaging removes this absolute rpath and installs a bundle-relative one.
            rust_flags+=" -C link-arg=-Wl,-rpath,$sdk_lib"
          fi
          printf 'RUSTFLAGS=%s\n' "$rust_flags" >> "$GITHUB_ENV"

      - name: Install shared SDK
        working-directory: packages/bridge-client
        run: npm ci

      - name: Install Desktop dependencies
        working-directory: apps/electron
        run: npm ci

      - name: Check and test native Rust host
        shell: bash
        working-directory: .
        run: |
          cargo check --locked -p bridge-server
          runtime_root="$(python3 scripts/lib/runtime_source.py --root)"
          cargo test --locked --manifest-path "${runtime_root}/Cargo.toml" -p client
          cargo build --locked --release -p bridge-server --bin bridge-server

      - name: Test the Local Apps service probe
        working-directory: .
        run: python scripts/tests/test_probe_local_app_service.py

      - name: Verify the native Local Apps service
        working-directory: .
        run: python scripts/ci/probe_local_app_service.py

      - name: Test POSIX secure storage
        if: matrix.platform != 'win32'
        working-directory: .
        run: |
          runtime_root="$(python3 scripts/lib/runtime_source.py --root)"
          cargo test --locked --manifest-path "${runtime_root}/Cargo.toml" -p platform-posix secure_storage --lib

      - name: Test Windows Credential Manager storage
        if: matrix.platform == 'win32'
        working-directory: .
        shell: bash
        run: |
          runtime_root="$(python3 scripts/lib/runtime_source.py --root)"
          cargo test --locked --manifest-path "${runtime_root}/Cargo.toml" -p platform-windows --lib

      - name: Test Windows Local App process ownership
        if: matrix.platform == 'win32'
        working-directory: .
        shell: bash
        run: |
          cargo test --locked -p bridge-server --bin bridge-server local_app_process::tests -- --test-threads=1
          cargo test --locked -p bridge-server --test local_app_process_windows

      - name: Test Windows MCP cancellation and transport cleanup
        if: matrix.platform == 'win32'
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/windows-mcp-serve-tests.log"
          cargo test --locked --all-features -p cli --test mcp_serve windows_ -- --test-threads=1 --color never | tee "$test_log"
          tr -d '\r' < "$test_log" > "$test_log.normalized"
          for test_name in \
            windows_duplicate_call_cancellation_reaps_the_started_process_tree \
            windows_full_stdout_does_not_block_cancellation_or_eof_cleanup \
            windows_broken_stdout_cancels_open_stdin_and_reaps_the_running_shell; do
            if ! grep -Fxq "test ${test_name} ... ok" "$test_log.normalized"; then
              printf 'Required Windows MCP test did not pass: %s\n' "$test_name" >&2
              exit 1
            fi
          done
          if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$test_log.normalized"; then
            printf 'Windows MCP test summary did not report a clean run\n' >&2
            exit 1
          fi

      - name: Test public Windows file handle operations
        if: matrix.platform == 'win32'
        working-directory: .
        shell: bash
        run: |
          sdk_root="$(python3 scripts/lib/mobile_linux_source.py --root)"
          cargo test --locked --manifest-path "${sdk_root}/Cargo.toml" -p platform-pty --test windows_file_exports

      - name: Build and test shared SDK
        if: matrix.platform != 'linux'
        working-directory: packages/bridge-client
        run: |
          npm run build
          npm test

      - name: Build shared SDK for Linux emulator tests
        if: matrix.platform == 'linux'
        working-directory: packages/bridge-client
        run: npm run build

      - name: Install macOS test search tool
        if: matrix.platform == 'darwin'
        run: brew install ripgrep

      - name: Install Windows test search tool
        if: matrix.platform == 'win32'
        run: choco install ripgrep --no-progress -y

      - name: Install Linux test search tool and GUI display
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb ripgrep vim

      - name: Install Java for the Linux RTDB emulator
        if: matrix.platform == 'linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and check the Linux RTDB test harness
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python3 -B scripts/tests/test_verify_desktop_test_log.py
          npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-save --no-audit --no-fund firebase-tools@15.34.0

      - name: Typecheck, test, and build Desktop
        shell: bash
        working-directory: apps/electron
        run: |
          npm run typecheck
          if [[ '${{ matrix.platform }}' == 'linux' ]]; then
            bash ../../scripts/ci/test_desktop_with_rtdb.sh
          else
            npm test
          fi
          npm run build

      - name: Save Linux Desktop test evidence
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-integration-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/lingxi-desktop-test-evidence

      - name: Package native Desktop target
        shell: bash
        working-directory: apps/electron
        run: node scripts/package-desktop.mjs --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
        env:
          # Explicitly test package layout without pretending an ad-hoc build
          # can access Data Protection Keychain. Release packaging uses the
          # profile-gated package-mac path.
          LINGXI_CREDENTIAL_BROKER_TEST_MOCK: ${{ matrix.platform == 'darwin' && '1' || '' }}

      - name: Static audit and packaged runtime smoke
        shell: bash
        working-directory: apps/electron
        run: node scripts/verify-desktop-package.mjs --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'

      - name: Keyless packaged sidecar and cleanup smoke
        shell: bash
        working-directory: apps/electron
        run: |
          if [[ '${{ matrix.platform }}' == 'darwin' ]]; then
            for name in "${!DYLD_@}"; do unset "$name"; done
          fi
          node scripts/packaged-sidecar-smoke.mjs --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: lingxi-code-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/electron/dist/${{ matrix.platform }}-${{ matrix.arch }}.*
            apps/electron/dist/${{ matrix.platform }}-${{ matrix.arch }}.build-metadata.json

  signed-credential-broker:
    name: signed-development-credential-broker
    runs-on: macos-15
    timeout-minutes: 20
    env:
      LINGXI_DEV_IDENTITY: ${{ secrets.LINGXI_MAC_DEVELOPMENT_IDENTITY }}
      LINGXI_DEV_TEAM_ID: ${{ secrets.LINGXI_MAC_TEAM_ID }}
      LINGXI_DEV_P12_BASE64: ${{ secrets.LINGXI_MAC_DEVELOPMENT_P12_BASE64 }}
      LINGXI_DEV_P12_PASSWORD: ${{ secrets.LINGXI_MAC_DEVELOPMENT_P12_PASSWORD }}
      LINGXI_DEV_BROKER_PROFILE_BASE64: ${{ secrets.LINGXI_MAC_DEVELOPMENT_BROKER_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run signed development Keychain integration
        shell: bash
        run: |
          if [ -z "$LINGXI_DEV_IDENTITY" ] || [ -z "$LINGXI_DEV_TEAM_ID" ] \
            || [ -z "$LINGXI_DEV_P12_BASE64" ] || [ -z "$LINGXI_DEV_P12_PASSWORD" ] \
            || [ -z "$LINGXI_DEV_BROKER_PROFILE_BASE64" ]; then
            echo "Signed development broker secrets are not configured; unsigned mock coverage ran in the package matrix."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/lingxi-development.p12"
          broker_profile_path="$RUNNER_TEMP/lingxi-development-broker.provisionprofile"
          signing_keychain="$RUNNER_TEMP/lingxi-development.keychain-db"
          signing_keychain_password="$(/usr/bin/openssl rand -hex 32)"
          printf '%s' "$LINGXI_DEV_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$LINGXI_DEV_BROKER_PROFILE_BASE64" | /usr/bin/base64 -D > "$broker_profile_path"
          /usr/bin/security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$signing_keychain"
          /usr/bin/security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security import "$certificate_path" -k "$signing_keychain" \
            -P "$LINGXI_DEV_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security list-keychains -d user -s "$signing_keychain"
          export BROKER_OUTPUT="$RUNNER_TEMP/credential-broker"
          export BROKER_PROFILE="$broker_profile_path"
          node --input-type=module <<'EOF'
          import { join } from 'node:path';
          import {
            brokerIdentifiers,
            buildCredentialBrokerResources,
            signAppBundle,
            signBinary,
            validateProvisioningProfile,
            verifyIdentifier,
            verifySignedEntitlements,
            writeEntitlements,
          } from './apps/electron/scripts/credential-broker.mjs';
          const ids = brokerIdentifiers('development');
          const root = process.env.BROKER_OUTPUT;
          const profile = process.env.BROKER_PROFILE;
          const identity = process.env.LINGXI_DEV_IDENTITY;
          const team = process.env.LINGXI_DEV_TEAM_ID;
          buildCredentialBrokerResources(root, {
            channel: 'development', profilePath: profile, version: '0.0.0',
            targetTriple: 'aarch64-apple-darwin',
          });
          validateProvisioningProfile(profile, team, ids.brokerBundleId);
          const entitlements = join(root, 'broker.entitlements.plist');
          writeEntitlements(entitlements, { teamId: team, bundleId: ids.brokerBundleId });
          signBinary(join(root, 'bin', 'lingxi-credential-client'), identity, ids.clientIdentifier);
          signAppBundle(join(root, 'LingXiCredentialBroker.app'), identity, entitlements);
          verifyIdentifier(join(root, 'bin', 'lingxi-credential-client'), ids.clientIdentifier, team);
          verifyIdentifier(join(root, 'LingXiCredentialBroker.app'), ids.brokerBundleId, team);
          verifySignedEntitlements(join(root, 'LingXiCredentialBroker.app'), team, ids.brokerBundleId);
          EOF
          harness="$RUNNER_TEMP/lingxi-development-broker-integration"
          xcrun swiftc -O -parse-as-library -target arm64-apple-macos13.0 \
            apps/electron/native/credential-broker/CredentialBrokerIntegrationMain.swift \
            -o "$harness"
          /usr/bin/codesign --force --sign "$LINGXI_DEV_IDENTITY" --options runtime \
            --timestamp -i com.lingxi.code.cli.development "$harness"
          "$harness" "$BROKER_OUTPUT/bin/lingxi-credential-client" development
          /usr/bin/codesign --force --sign "$LINGXI_DEV_IDENTITY" --options runtime \
            --timestamp -i com.lingxi.code.unknown.development "$harness"
          "$harness" "$BROKER_OUTPUT/bin/lingxi-credential-client" development --expect-rejected
