name: documentation
on:
  pull_request:
    paths:
      - 'apps/web/**'
      # The web build compiles the Remote Control core and the Electron reducer chain from source.
      - 'packages/bridge-client/src/**'
      - 'packages/bridge-client/package*.json'
      - 'packages/deep-links/**'
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'apps/ios/native/project.yml'
      - 'firebase.json'
      - 'docs/technical/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      # The web build compiles the Remote Control core and the Electron reducer chain from source.
      - 'packages/bridge-client/src/**'
      - 'packages/bridge-client/package*.json'
      - 'packages/deep-links/**'
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'apps/ios/native/project.yml'
      - 'firebase.json'
      - 'docs/technical/**'
      - '.github/workflows/documentation.yml'
jobs:
  handbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/bridge-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared bridge dependencies
        run: npm ci --prefix ../../packages/bridge-client
      - run: npm ci
      - name: Check saved bilingual content and generated consumers
        run: npm run docs:check:content
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
