name: documentation
on:
  pull_request:
    paths:
      - 'apps/web/**'
      # The web build compiles the Remote Control core and the Electron reducer chain from source.
      - 'packages/bridge-client/src/**'
      - 'packages/bridge-client/package*.json'
      # The Teams web tests import the Firebase backend modules directly.
      - 'apps/firebase/src/**'
      - 'apps/firebase/package*.json'
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'apps/electron/package*.json'
      - 'apps/electron/vendor/local-app-agui/**'
      - 'docs/technical/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      # The web build compiles the Remote Control core and the Electron reducer chain from source.
      - 'packages/bridge-client/src/**'
      - 'packages/bridge-client/package*.json'
      - 'apps/firebase/src/**'
      - 'apps/firebase/package*.json'
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'apps/electron/package*.json'
      - 'apps/electron/vendor/local-app-agui/**'
      - 'docs/technical/**'
      - '.github/workflows/documentation.yml'
jobs:
  handbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/bridge-client/package-lock.json
            apps/firebase/package-lock.json
            apps/electron/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Shared source imports resolve dependencies from their own package directory.
      - name: Install shared Bridge client dependencies
        working-directory: packages/bridge-client
        run: npm ci
      - name: Install Firebase backend dependencies for Teams tests
        working-directory: apps/firebase
        run: npm ci
      # Web typechecking follows shared Electron types into the pinned AG-UI adapter.
      - name: Install Electron production dependencies for shared types
        working-directory: apps/electron
        run: npm ci --omit=dev --ignore-scripts
      - name: Check saved bilingual content and generated consumers
        run: npm run docs:check:content
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
