name: lingxi-release
# Cross-builds lingxi-cli for 6 targets, stages npm + PyPI packages, and
# publishes them. Publish steps are gated on secrets (NPM_TOKEN / PYPI_TOKEN),
# so the build+stage path runs safely on any tag even without tokens.
#
# `ring` (a transitive dep) compiles C, so every non-host target needs a C
# toolchain: musl targets use `cross` (containerized musl toolchain); windows
# targets use the windows-latest runner's VS Build Tools (incl. arm64 cross).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: lingxi-release
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      LINGXI_CODESIGN_IDENTITY: ${{ secrets.LINGXI_CODESIGN_IDENTITY }}
      LINGXI_MAC_TEAM_ID: ${{ secrets.LINGXI_MAC_TEAM_ID }}
      LINGXI_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.LINGXI_MAC_CERTIFICATE_P12_BASE64 }}
      LINGXI_MAC_CERTIFICATE_PASSWORD: ${{ secrets.LINGXI_MAC_CERTIFICATE_PASSWORD }}
      LINGXI_MAC_BROKER_PROFILE_BASE64: ${{ secrets.LINGXI_MAC_BROKER_PROVISIONING_PROFILE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-15,       cross: false }
          - { target: x86_64-apple-darwin,        os: macos-15-intel, cross: false }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  cross: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, cross: false }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS code signing
        if: ${{ startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin') }}
        shell: bash
        run: |
          test -n "$LINGXI_CODESIGN_IDENTITY" || { echo "LINGXI_CODESIGN_IDENTITY is required"; exit 1; }
          test -n "$LINGXI_MAC_TEAM_ID" || { echo "LINGXI_MAC_TEAM_ID is required"; exit 1; }
          test -n "$LINGXI_MAC_CERTIFICATE_P12_BASE64" || { echo "LINGXI_MAC_CERTIFICATE_P12_BASE64 is required"; exit 1; }
          test -n "$LINGXI_MAC_CERTIFICATE_PASSWORD" || { echo "LINGXI_MAC_CERTIFICATE_PASSWORD is required"; exit 1; }
          test -n "$LINGXI_MAC_BROKER_PROFILE_BASE64" || { echo "LINGXI_MAC_BROKER_PROVISIONING_PROFILE is required"; exit 1; }
          certificate_path="$RUNNER_TEMP/lingxi-signing.p12"
          broker_profile_path="$RUNNER_TEMP/lingxi-broker.provisionprofile"
          signing_keychain="$RUNNER_TEMP/lingxi-signing.keychain-db"
          signing_keychain_password="$(/usr/bin/openssl rand -hex 32)"
          printf '%s' "$LINGXI_MAC_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$LINGXI_MAC_BROKER_PROFILE_BASE64" | /usr/bin/base64 -D > "$broker_profile_path"
          /usr/bin/security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$signing_keychain"
          /usr/bin/security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security import "$certificate_path" -k "$signing_keychain" \
            -P "$LINGXI_MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$signing_keychain_password" "$signing_keychain"
          /usr/bin/security list-keychains -d user -s "$signing_keychain"
          echo "LINGXI_MAC_BROKER_PROVISIONING_PROFILE=$broker_profile_path" >> "$GITHUB_ENV"
      - name: Install Rust 1.94 + target
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustup target add ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Build (cross)
        if: ${{ matrix.cross }}
        working-directory: .
        run: cross build --locked --release -p cli --target ${{ matrix.target }}
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        working-directory: .
        shell: bash
        run: cargo build --locked --release -p cli --target ${{ matrix.target }}
      - name: Build macOS credential broker resources
        if: ${{ startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin') }}
        shell: bash
        run: |
          test -n "${LINGXI_CODESIGN_IDENTITY}" || { echo "LINGXI_CODESIGN_IDENTITY is required for macOS releases"; exit 1; }
          test -n "${LINGXI_MAC_TEAM_ID}" || { echo "LINGXI_MAC_TEAM_ID is required for macOS releases"; exit 1; }
          test -n "${LINGXI_MAC_BROKER_PROVISIONING_PROFILE}" || { echo "LINGXI_MAC_BROKER_PROVISIONING_PROFILE is required for macOS releases"; exit 1; }
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          node --input-type=module <<'EOF'
          import { join, resolve } from 'node:path';
          import { buildCredentialBrokerResources, signAppBundle, signBinary, validateProvisioningProfile, verifyIdentifier, verifySignedEntitlements, writeEntitlements, BROKER_BUNDLE_ID, BROKER_CLIENT_IDENTIFIER } from './clients/electron/scripts/credential-broker.mjs';

          const target = process.env['TARGET_TRIPLE'];
          const identity = process.env['LINGXI_CODESIGN_IDENTITY'];
          const teamId = process.env['LINGXI_MAC_TEAM_ID'];
          const profilePath = resolve(process.env['LINGXI_MAC_BROKER_PROVISIONING_PROFILE']);
          const outputRoot = resolve('target', target, 'credential-broker');
          buildCredentialBrokerResources(outputRoot, {
            teamId,
            profilePath,
            version: process.env['RELEASE_VERSION'] || '0.0.0-dev',
            targetTriple: target,
          });
          validateProvisioningProfile(profilePath, teamId, BROKER_BUNDLE_ID);
          const entitlementsPath = join(outputRoot, 'LingXiCredentialBroker.entitlements.plist');
          writeEntitlements(entitlementsPath, { teamId, bundleId: BROKER_BUNDLE_ID });
          signBinary(join(outputRoot, 'bin', 'lingxi-credential-client'), identity, BROKER_CLIENT_IDENTIFIER);
          signAppBundle(join(outputRoot, 'LingXiCredentialBroker.app'), identity, entitlementsPath);
          verifyIdentifier(join(outputRoot, 'bin', 'lingxi-credential-client'), BROKER_CLIENT_IDENTIFIER, teamId);
          verifyIdentifier(join(outputRoot, 'LingXiCredentialBroker.app'), BROKER_BUNDLE_ID, teamId);
          verifySignedEntitlements(join(outputRoot, 'LingXiCredentialBroker.app'), teamId, BROKER_BUNDLE_ID);
          EOF
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Sign macOS CLI binary
        if: ${{ startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin') }}
        working-directory: .
        shell: bash
        run: |
          test -n "${LINGXI_CODESIGN_IDENTITY}" || { echo "LINGXI_CODESIGN_IDENTITY is required for macOS releases"; exit 1; }
          test -n "${LINGXI_MAC_TEAM_ID}" || { echo "LINGXI_MAC_TEAM_ID is required for macOS releases"; exit 1; }
          bin="target/${{ matrix.target }}/release/lingxi-cli"
          /usr/bin/codesign --force --sign "${LINGXI_CODESIGN_IDENTITY}" --options runtime --timestamp -i com.lingxi.code.cli "$bin"
          /usr/bin/codesign --verify --strict "$bin"
          /usr/bin/codesign --display --verbose=4 "$bin" 2>&1 | grep "Identifier=com.lingxi.code.cli" >/dev/null
          /usr/bin/codesign --display --verbose=4 "$bin" 2>&1 | grep "TeamIdentifier=${LINGXI_MAC_TEAM_ID}" >/dev/null
      - name: Test signed Data Protection Keychain broker
        if: ${{ startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin') }}
        working-directory: .
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) swift_target="arm64-apple-macos13.0" ;;
            x86_64-apple-darwin) swift_target="x86_64-apple-macos13.0" ;;
            *) exit 1 ;;
          esac
          harness="$RUNNER_TEMP/lingxi-credential-broker-integration"
          xcrun swiftc -O -parse-as-library -target "$swift_target" \
            clients/electron/native/credential-broker/CredentialBrokerIntegrationMain.swift \
            -o "$harness"
          /usr/bin/codesign --force --sign "${LINGXI_CODESIGN_IDENTITY}" \
            --options runtime --timestamp -i com.lingxi.code.cli "$harness"
          "$harness" "target/${{ matrix.target }}/credential-broker/bin/lingxi-credential-client"
          /usr/bin/codesign --force --sign "${LINGXI_CODESIGN_IDENTITY}" \
            --options runtime --timestamp -i com.lingxi.code.unknown "$harness"
          "$harness" "target/${{ matrix.target }}/credential-broker/bin/lingxi-credential-client" production --expect-rejected
      - name: Collect binary
        working-directory: .
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.target }}/release"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/lingxi-cli$ext" "out/${{ matrix.target }}/release/lingxi-cli$ext"
          if [ -d "target/${{ matrix.target }}/credential-broker" ]; then
            cp -R "target/${{ matrix.target }}/credential-broker" "out/${{ matrix.target }}/credential-broker"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/${{ matrix.target }}/

  package-and-publish:
    needs: build
    runs-on: ubuntu-latest
    # Map secrets to env at the job level: the `secrets` context is NOT available
    # in step-level `if:`, but `env` is — so the publish steps gate on these.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Reassemble target/<triple>/release layout
        shell: bash
        run: |
          cd .
          for d in ../artifacts/bin-*; do
            t="$(basename "$d" | sed 's/^bin-//')"
            mkdir -p "target/$t"
            cp -R "$d/." "target/$t/"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: astral-sh/setup-uv@v5
      - name: Resolve version
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stage npm packages
        working-directory: .
        run: |
          for p in lingxi lingxi-linux-x64 lingxi-linux-arm64 lingxi-darwin-x64 lingxi-darwin-arm64 lingxi-win32-x64 lingxi-win32-arm64; do
            python3 npm/scripts/build_npm_package.py --package "$p" --release-version "${{ steps.ver.outputs.v }}" --staging-dir "/tmp/npm/$p" --vendor-src target
          done
      - name: Build wheels (one per target/tag)
        working-directory: packaging/pypi
        shell: bash
        run: |
          # Inject the release version (pyproject ships a static 0.0.0-dev
          # placeholder; without this the wheel publishes as 0.0.0.dev0 and the
          # next tag collides on PyPI).
          sed -i "s/^version = \"0.0.0-dev\"/version = \"${{ steps.ver.outputs.v }}\"/" pyproject.toml
          # Platform tags per target. The Linux binary is static-musl, portable
          # onto glibc, so we ship BOTH manylinux (glibc distros — the common
          # case) and musllinux (Alpine) wheels so `pip`/`uv` install everywhere.
          declare -A TAGS=(
            [x86_64-apple-darwin]="macosx_11_0_x86_64"
            [aarch64-apple-darwin]="macosx_11_0_arm64"
            [x86_64-unknown-linux-musl]="manylinux_2_17_x86_64 musllinux_1_2_x86_64"
            [aarch64-unknown-linux-musl]="manylinux_2_17_aarch64 musllinux_1_2_aarch64"
            [x86_64-pc-windows-msvc]="win_amd64"
            [aarch64-pc-windows-msvc]="win_arm64"
          )
          for t in "${!TAGS[@]}"; do
            ext=""; [[ "$t" == *windows* ]] && ext=".exe"
            rm -rf src/lingxi_cli_bin/bin && mkdir -p src/lingxi_cli_bin/bin
            rm -rf src/lingxi_cli_bin/credential-broker
            cp "../target/$t/release/lingxi-cli$ext" "src/lingxi_cli_bin/bin/lingxi$ext"
            if [ -d "../target/$t/credential-broker" ]; then
              cp -R "../target/$t/credential-broker" "src/lingxi_cli_bin/credential-broker"
            fi
            printf '{"target":"%s"}' "$t" > src/lingxi_cli_bin/lingxi-package.json
            for tag in ${TAGS[$t]}; do
              LINGXI_CLI_BIN_PLATFORM_TAG="$tag" uv build --wheel --out-dir dist
            done
          done
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in lingxi-linux-x64 lingxi-linux-arm64 lingxi-darwin-x64 lingxi-darwin-arm64 lingxi-win32-x64 lingxi-win32-arm64 lingxi; do
            (cd "/tmp/npm/$p" && npm publish --access public)
          done
      - name: Publish to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish packaging/pypi/dist/*.whl
