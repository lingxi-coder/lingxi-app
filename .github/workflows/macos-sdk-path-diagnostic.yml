name: macOS SDK embedded path classification
on:
  push:
    branches: [codex/media-macos-sdk-path-classify-20261028]
jobs:
  classify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official GStreamer SDK
        run: python3 scripts/ci/gstreamer_sdk.py macos --root "$RUNNER_TEMP/gstreamer-sdk/macos"
      - name: Classify paths in staged SDK image sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, os, pathlib, re, shutil, struct, subprocess
          sdk=pathlib.Path(os.environ['LINGXI_GSTREAMER_SDK_MACOS'])
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'sdk-path-classify'
          work.mkdir()
          arch=subprocess.check_output(['/usr/bin/uname','-m'],text=True).strip()
          libraries='libffi.7.dylib libgio-2.0.0.dylib libglib-2.0.0.dylib libgmodule-2.0.0.dylib libgobject-2.0.0.dylib libgstapp-1.0.0.dylib libgstaudio-1.0.0.dylib libgstbase-1.0.0.dylib libgstnet-1.0.0.dylib libgstpbutils-1.0.0.dylib libgstreamer-1.0.0.dylib libgstrtp-1.0.0.dylib libgsttag-1.0.0.dylib libgstvideo-1.0.0.dylib libintl.8.dylib libopus.0.dylib liborc-0.4.0.dylib libpcre2-8.0.dylib libvpx.9.dylib libz.1.dylib'.split()
          plugins='libgstapp.dylib libgstaudioconvert.dylib libgstaudioresample.dylib libgstcoreelements.dylib libgstopus.dylib libgstrtp.dylib libgstrtpmanager.dylib libgstvideoconvertscale.dylib libgstvpx.dylib'.split()
          def classify(path):
              data=path.read_bytes()
              magic,_,_,_,count,_,_,_=struct.unpack_from('<IiiIIIII',data,0)
              if magic!=0xfeedfacf: raise RuntimeError('expected 64-bit little-endian Mach-O')
              regions=[];pos=32
              for _ in range(count):
                  command,size=struct.unpack_from('<II',data,pos)
                  if size<8 or pos+size>len(data):raise RuntimeError('invalid load command')
                  if command==0x19:
                      for i in range(struct.unpack_from('<I',data,pos+64)[0]):
                          section=pos+72+i*80
                          if section+80>pos+size:raise RuntimeError('invalid section')
                          sect,seg,_,length,offset=struct.unpack_from('<16s16sQQI',data,section)
                          name=(seg.split(b'\0')[0]+b','+sect.split(b'\0')[0]).decode(errors='replace')
                          regions.append((offset,offset+length,name))
                  elif command==2:
                      _,_,offset,length=struct.unpack_from('<IIII',data,pos+8)
                      regions.append((offset,offset+length,'symbol-string-table'))
                  pos+=size
              pattern=rb'/Users/[A-Za-z0-9._-]+/[A-Za-z0-9_./+-]+'
              matches=list(re.finditer(pattern,data))
              counts=collections.Counter(next((n for start,end,n in regions if start<=m.start()<end),'other') for m in matches)
              examples=[]
              for m in matches[:8]:
                  path=re.sub(rb'^/Users/[^/]+/',b'/Users/<redacted>/',m.group())
                  examples.append(path[:240].decode(errors='replace'))
              return len(matches),dict(counts),examples,hashlib.sha256(data).hexdigest()
          for directory,names in [(sdk/'lib',libraries),(sdk/'lib/gstreamer-1.0',plugins)]:
              for name in names:
                  source=(directory/name).resolve(strict=True);target=work/name
                  archs=subprocess.check_output(['/usr/bin/lipo','-archs',str(source)],text=True).split()
                  if arch not in archs:raise RuntimeError(f'{name} missing {arch}')
                  if len(archs)>1:subprocess.run(['/usr/bin/lipo',str(source),'-thin',arch,'-output',str(target)],check=True)
                  else:shutil.copy2(source,target)
                  os.chmod(target,0o755)
                  before=classify(target)
                  subprocess.run(['/usr/bin/strip','-S','-x',str(target)],check=True)
                  after=classify(target)
                  if before[0] or after[0]:print(name,'before',before[:2],'after',after[:2],'after_sha256',after[3],'examples',after[2],flush=True)
                  target.unlink()
          PY
