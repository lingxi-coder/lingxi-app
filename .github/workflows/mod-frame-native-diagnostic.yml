name: Mod frame native receipt diagnostic
on:
  push:
    branches: [codex/media-mod-frame-native-20261028-a]
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "16777216"
jobs:
  bridge:
    name: App Rust callback and bridge contract
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lingxi-coder/harness-runtime
          ref: 6a3746fca2ec74f291be2ced2d22b1f0e01d53e1
          path: .diagnostic/harness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Create runner-only Harness override
        run: python3 .github/scripts/prepare-frame-receipt-diagnostic.py
      - name: Install GStreamer development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Compile platform listener adapters and their tests
        run: cargo check --locked -p android-aar -p ios-framework --tests
      - name: Test desktop queue receipt
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p bridge-server --lib client_frame_receipt_tracks_the_current_outbound_queue -- --nocapture | tee "$RUNNER_TEMP/bridge-receipt.log"
          grep -F 'client_frame_receipt_tracks_the_current_outbound_queue ... ok' "$RUNNER_TEMP/bridge-receipt.log"
  android:
    name: Android generated bindings and targeted unit test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lingxi-coder/harness-runtime
          ref: 6a3746fca2ec74f291be2ced2d22b1f0e01d53e1
          path: .diagnostic/harness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Create runner-only Harness override
        run: python3 .github/scripts/prepare-frame-receipt-diagnostic.py
      - name: Install Android NDK and pinned GStreamer SDK
        run: |
          sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 scripts/ci/gstreamer_sdk.py android --root "$RUNNER_TEMP/gstreamer-sdk/android"
      - name: Build native binaries and matching Kotlin bindings
        env:
          LINGXI_FFI_PROFILE: debug
        run: |
          bash apps/android/native/scripts/prepare-ci-debug-keystore.sh
          bash apps/android/native/scripts/build-mobile-linux-native.sh --variant direct
          python3 scripts/mobile-linux/fetch-sdk-rootfs.py --output "$RUNNER_TEMP/sdk-rootfs"
          rg -n 'onModUiClientFrame' apps/android/native/app/src/main/java/com/lingxi/code/bindings
      - name: Run frame ingress unit regression
        working-directory: apps/android/native
        run: |
          ./gradlew --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g \
            "-PlingxiRootfsEvidenceDir=$RUNNER_TEMP/sdk-rootfs" \
            :app:testDirectDebugUnitTest \
            --tests 'com.lingxi.code.conversation.ConversationSourceRecoveryTest.uiFrameAdmissionIsFifoAndRejectsRetiredIngress'
  ios:
    name: iOS generated bindings and simulator regression
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lingxi-coder/harness-runtime
          ref: 6a3746fca2ec74f291be2ced2d22b1f0e01d53e1
          path: .diagnostic/harness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-ios-sim
      - name: Create runner-only Harness override
        run: python3 .github/scripts/prepare-frame-receipt-diagnostic.py
      - name: Install iOS build tools and pinned GStreamer SDKs
        run: |
          brew install xcodegen meson ninja llvm lld libarchive
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          python3 scripts/ci/gstreamer_sdk.py ios --root "$RUNNER_TEMP/gstreamer-sdk/ios"
          python3 scripts/ci/gstreamer_sdk.py macos --root "$RUNNER_TEMP/gstreamer-sdk/macos"
          bash apps/ios/native/scripts/install-sherpa-runtime.sh
      - name: Build simulator framework and Swift bindings
        env:
          LINGXI_SIM_ARM64_ONLY: '1'
          LINGXI_FFI_PROFILE: debug
        run: |
          bash apps/ios/native/scripts/build-xcframework.sh
          rg -n 'onModUiClientFrame' apps/ios/native/Generated
      - name: Generate project and run focused simulator regression
        working-directory: apps/ios/native
        run: |
          xcodegen generate
          sim="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[(k,v) for k,vs in d["devices"].items() if "iOS" in k for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")]; print(a[-1][1]["udid"] if a else "")')"
          test -n "$sim"
          xcodebuild test -scheme LingxiCode -destination "platform=iOS Simulator,id=$sim" -only-testing:LingxiCodeTests/ConversationTurnCompletionTests/testFrameAdmissionUsesListenerQueueAndRejectsReleasedSource
