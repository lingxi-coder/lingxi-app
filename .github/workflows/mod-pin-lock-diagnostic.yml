name: Mod exact git pin and locked diagnostic
on:
  push:
    branches: [codex/media-mod-pin-lock-20261028-a]
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  exact-git-pin:
    name: Exact git pin and cargo locked metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Update runner-only pin and verify locked resolution
        run: python3 .github/scripts/check-mod-locked-pin.py
      - name: Install GStreamer development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Compile bridge and its tests with the exact git pin
        run: cargo check --locked -p bridge-server --tests
      - name: Save runner-only locked resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-exact-git-pin-lock
          path: |
            ${{ runner.temp }}/pin-lock-Cargo.lock
            ${{ runner.temp }}/pin-lock.diff
            ${{ runner.temp }}/pin-lock-metadata.json
          if-no-files-found: warn
