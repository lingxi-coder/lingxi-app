name: Windows terminal and process diagnostics
on:
  push:
    branches: [codex/media-windows-terminal-v2-9b8e]
jobs:
  terminal:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install shared bridge client
        working-directory: packages/bridge-client
        run: |
          npm ci
          npm run build
      - name: Install Electron dependencies
        working-directory: apps/electron
        run: npm ci
      - name: Exercise real broker and terminal EOF tests
        run: python scripts/ci/probe_terminal_eof.py --with-rust-tests --with-node --with-windows-backpressure
      - name: Verify terminal delivery and host state
        working-directory: apps/electron
        run: node --import ../../packages/bridge-client/node_modules/tsx/dist/loader.mjs --test --test-concurrency=1 test/terminal-manager.test.ts test/terminal-delivery.test.ts test/terminal-host.test.ts
