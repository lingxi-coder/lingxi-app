    case 'pause': return <svg {...p}><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>;
    default: return null;
  }
};

const HoverItem = ({ active, children, onClick, style = {} }) => {
  const t = useT();
  const [hover, setHover] = useState(false);

    <div onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        cursor: 'pointer', transition: 'background 0.12s ease, color 0.12s ease',
        background: active ? t.surfaceActive : (hover ? t.surfaceHover : 'transparent'),
        color: active ? t.text : t.text2,
        ...style,
      }}>{children}</div>
  );
};

const Pill = ({ children, color, style = {} }) => {

    <span style={{

    { id: 1, label: '理解需求', state: 'done' },
    { id: 2, label: '检索 HIG + Claude UI', state: 'done' },
    { id: 3, label: '生成组件结构', state: 'done' },
    { id: 4, label: '应用 workflow bar', state: 'running' },
    { id: 5, label: '右侧抽屉联动', state: 'todo' },
    { id: 6, label: '导出 + 总结', state: 'todo' },
  ];
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 6, padding: '10px 24px',
      background: t.windowBg, borderBottom: `0.5px solid ${t.border}`,
      overflowX: 'auto',
    }}>
      <div style={{ fontSize: 11, color: t.text4, fontWeight: 600, letterSpacing: 0.8, textTransform: 'uppercase', marginRight: 8, flexShrink: 0 }}>WORKFLOW</div>
      {steps.map((s, i) => (
        <React.Fragment key={s.id}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            padding: '4px 10px', borderRadius: 99,
            background: s.state === 'done' ? `color-mix(in oklab, ${t.ok} 14%, transparent)` :
                        s.state === 'running' ? t.accentBg : 'transparent',
            color: s.state === 'done' ? t.ok :
                   s.state === 'running' ? t.accent : t.text4,
            border: `0.5px solid ${s.state === 'done' ? `color-mix(in oklab, ${t.ok} 28%, transparent)` : s.state === 'running' ? t.accentBorder : `color-mix(in oklab, ${t.text4} 30%, transparent)`}`,
            borderStyle: s.state === 'todo' ? 'dashed' : 'solid',
            fontSize: 11.5, fontWeight: 500,
            whiteSpace: 'nowrap',
            cursor: 'pointer', transition: 'all 0.15s',
            position: 'relative',
          }}>
            {s.state === 'done' && <Icon name="check" size={11} stroke={2.5} />}
            {s.state === 'running' && (
              <span style={{ width: 6, height: 6, borderRadius: 99, background: t.accent, animation: 'shimmer 1.4s infinite' }} />
            )}
            {s.state === 'todo' && <span style={{ width: 6, height: 6, borderRadius: 99, border: `1px solid ${t.text4}` }} />}
            <span>{i + 1}. {s.label}</span>
          </div>
          {i < steps.length - 1 && <div style={{ width: 8, height: 1, background: t.border }} />}
        </React.Fragment>
      ))}
    </div>
  );
}

// ─── MESSAGE BUBBLE ──────────────────────────────────────────
function Message({ m, ws }) {
  const t = useT();
  if (m.role === 'user') {
    return (
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 32, animation: 'fade-in 0.3s ease' }}>
        <div style={{
          maxWidth: '72%', padding: '12px 18px', borderRadius: 18, borderTopRightRadius: 6,
          background: t.surface, border: `0.5px solid ${t.border}`,
          fontSize: 15, lineHeight: 1.6, color: t.text, fontWeight: 400,
          whiteSpace: 'pre-wrap',
        }}>{m.text}</div>
      </div>
    );
  }
  return (

// ─── COMPOSER ─────────────────────────────────────────────────
function Composer({ model, setModel, onSend }) {
  const t = useT();
  const [text, setText] = useState('');
  const [modelOpen, setModelOpen] = useState(false);
  const taRef = useRef(null);
  const send = () => { if (text.trim()) { onSend(text); setText(''); if (taRef.current) taRef.current.style.height = 'auto'; } };
  return (
    <div style={{ padding: '0 24px 22px', position: 'relative' }}>
      <div style={{
        background: t.composerBg, border: `0.5px solid ${t.borderStrong}`,
        borderRadius: 16, padding: '12px 14px 10px',
        boxShadow: '0 10px 30px rgba(0,0,0,0.06)',
      }}>
        <textarea ref={taRef} value={text} onChange={e => { setText(e.target.value); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
          onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } }}
          placeholder="向灵犀提问，或拖入文件、图片、网页链接…"
          rows={1}
          style={{
            width: '100%', border: 'none', outline: 'none', resize: 'none',
            background: 'transparent', color: t.text, fontSize: 15,
            lineHeight: 1.55, fontFamily: 'inherit', fontWeight: 400,
            minHeight: 24, maxHeight: 200,
          }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6, position: 'relative' }}>
          {[
            { icon: 'paperclip', tip: '附件' },
            { icon: 'image', tip: '图片' },
            { icon: 'mic', tip: '语音' },
          ].map(b => (
            <button key={b.icon} title={b.tip} style={{ background: 'transparent', border: 'none', padding: 6, borderRadius: 7, cursor: 'pointer', color: t.text3, display: 'flex', alignItems: 'center' }}
                    onMouseEnter={e => { e.currentTarget.style.background = t.surfaceHover; e.currentTarget.style.color = t.text; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = t.text3; }}>
              <Icon name={b.icon} size={15} stroke={1.7} />
            </button>
          ))}
          <div style={{ width: 1, height: 16, background: t.border, margin: '0 4px' }} />

          {/* Model picker */}
          <button onClick={() => setModelOpen(!modelOpen)} style={{
            display: 'flex', alignItems: 'center', gap: 6,
            padding: '4px 9px', borderRadius: 7,
            background: modelOpen ? t.surfaceHover : 'transparent',
            border: 'none', cursor: 'pointer', color: t.text2,
            fontSize: 12, fontFamily: 'inherit',
          }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
             onMouseLeave={e => e.currentTarget.style.background = modelOpen ? t.surfaceHover : 'transparent'}>
            <span style={{ width: 6, height: 6, borderRadius: 99, background: model.color }} />
            <span style={{ fontWeight: 500 }}>{model.name}</span>
            <Icon name="chevron" size={12} stroke={2} color={t.text4} />
          </button>
          {modelOpen && (
            <div style={{
              position: 'absolute', bottom: '100%', left: 80, marginBottom: 6, zIndex: 50,
              background: t.surface, border: `0.5px solid ${t.borderStrong}`,
              borderRadius: 10, padding: 4, minWidth: 220,
              boxShadow: '0 12px 32px rgba(0,0,0,0.25)',
              animation: 'fade-in 0.15s ease',
            }}>
              {MODELS.map(m => (
                <div key={m.id} onClick={() => { setModel(m); setModelOpen(false); }} style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '7px 9px', borderRadius: 7, cursor: 'pointer',
                  background: m.id === model.id ? t.accentBg : 'transparent',
                }} onMouseEnter={e => { if (m.id !== model.id) e.currentTarget.style.background = t.surfaceHover; }}
                   onMouseLeave={e => { if (m.id !== model.id) e.currentTarget.style.background = 'transparent'; }}>
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: m.color }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, color: t.text, fontWeight: 500 }}>{m.name}</div>
                    <div style={{ fontSize: 11, color: t.text3 }}>{m.desc}</div>
                  </div>
                  {m.tag && <Pill color={m.color}>{m.tag}</Pill>}
                </div>
              ))}
              <div style={{ height: 1, background: t.border, margin: '4px 4px' }} />
              <div style={{ padding: '7px 9px', display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 12.5, color: t.text3, borderRadius: 7 }}
                   onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
                   onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <Icon name="cog" size={13} /> 模型设置
              </div>
            </div>
          )}

          {/* depth selector */}
          <button style={{
            display: 'flex', alignItems: 'center', gap: 5,
            padding: '4px 9px', borderRadius: 7,
            background: 'transparent', border: 'none', cursor: 'pointer', color: t.text2, fontSize: 12, fontFamily: 'inherit',
          }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
             onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <span style={{ fontWeight: 500 }}>深度</span>
            <span style={{ color: t.accent, fontWeight: 600 }}>Medium</span>
          </button>

          <div style={{ flex: 1 }} />
          <div style={{ fontSize: 11, color: t.text4, marginRight: 4 }}>{text.length > 0 ? `${text.length} 字 · ⌘↩ 发送` : ''}</div>
          <button onClick={send} disabled={!text.trim()} style={{
            width: 30, height: 30, borderRadius: 8, border: 'none', cursor: text.trim() ? 'pointer' : 'default',
            background: text.trim() ? t.accent : t.surfaceHover,
            color: text.trim() ? '#fff' : t.text4,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'all 0.15s',
            boxShadow: text.trim() ? `0 4px 12px color-mix(in oklab, ${t.accent} 40%, transparent)` : 'none',
          }}>
            <Icon name="arrowUp" size={15} color="currentColor" />
          </button>
        </div>
      </div>
      <div style={{ textAlign: 'center', fontSize: 10.5, color: t.text4, marginTop: 6 }}>
        灵犀可能会出错。请核对重要信息。
      </div>
    </div>
  );
}

// ─── MAIN CHAT AREA ──────────────────────────────────────────
function ChatArea({ session, knowledgeOpen, setKnowledgeOpen, theme, setTheme }) {
  const t = useT();
  const [messages, setMessages] = useState(MESSAGES);
  const [model, setModel] = useState(MODELS[0]);
  const [isStreaming, setIsStreaming] = useState(false);
  const scrollRef = useRef(null);

  const send = (txt) => {
    setMessages(ms => [...ms, { role: 'user', text: txt }]);
    setIsStreaming(true);
    setTimeout(() => {
      setMessages(ms => [...ms, { role: 'ai', tag: '思考了 12 秒', text: '收到。已根据你的描述更新方案。\n\n你可以在 **右侧抽屉**（点击右上角面板图标）查看刚刚生成的组件树与文件引用。' }]);
      setIsStreaming(false);
    }, 1400);
  };

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, isStreaming]);

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: t.windowBg, minWidth: 0, position: 'relative' }}>
      {/* Ambient gradient */}
      <div style={{ position: 'absolute', inset: 0, background: t.ambient, pointerEvents: 'none' }} />

      {/* Top bar */}
      <div style={{
        height: 52, flexShrink: 0,
        padding: '0 20px 0 20px',
        display: 'flex', alignItems: 'center', gap: 10,
        borderBottom: `0.5px solid ${t.border}`,
        position: 'relative', zIndex: 2,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: t.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{session.title}</div>
          <span style={{ fontSize: 12, color: t.text4 }}>· {session.msgs} 条消息</span>
        </div>
        <div style={{ flex: 1 }} />

        {/* Theme toggle */}
        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="切换主题" style={{
          width: 32, height: 32, borderRadius: 8, border: 'none', cursor: 'pointer',
          background: 'transparent', color: t.text2,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }} onMouseEnter={e => { e.currentTarget.style.background = t.surfaceHover; e.currentTarget.style.color = t.text; }}
           onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = t.text2; }}>
          <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={16} stroke={1.7} />
        </button>

        {[
          { icon: 'share', tip: '分享' },
          { icon: 'dots', tip: '更多' },
          { icon: 'panelRight', tip: '抽屉', onClick: () => setKnowledgeOpen(!knowledgeOpen), active: knowledgeOpen },
        ].map(b => (
          <button key={b.icon} onClick={b.onClick} title={b.tip} style={{
            width: 32, height: 32, borderRadius: 8, border: 'none', cursor: 'pointer',
            background: b.active ? t.surfaceActive : 'transparent', color: b.active ? t.accent : t.text2,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }} onMouseEnter={e => { if (!b.active) { e.currentTarget.style.background = t.surfaceHover; e.currentTarget.style.color = t.text; } }}
             onMouseLeave={e => { if (!b.active) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = t.text2; } }}>
            <Icon name={b.icon} size={16} stroke={1.7} />
          </button>
        ))}
      </div>

      <WorkflowBar />

      {/* Messages */}
      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', position: 'relative', zIndex: 2 }}>
        <div style={{ maxWidth: 780, margin: '0 auto', padding: '32px 24px 16px' }}>
          {messages.map((m, i) => <Message key={i} m={m} />)}
          {isStreaming && (
            <div style={{ display: 'flex', gap: 14, marginBottom: 36, alignItems: 'center' }}>
              <div style={{ width: 30, height: 30, borderRadius: 8, background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="sparkle" size={15} color="#fff" stroke={2} />
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: t.text3, fontSize: 13 }}>
                <span style={{ animation: 'shimmer 1.4s infinite' }}>思考中</span>
                <div style={{ display: 'flex', gap: 3 }}>
                  {[0, 1, 2].map(i => <span key={i} style={{ width: 4, height: 4, borderRadius: 99, background: t.accent, animation: `shimmer 1.2s infinite ${i * 0.15}s` }} />)}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={{ maxWidth: 780, margin: '0 auto', width: '100%', position: 'relative', zIndex: 2 }}>
        <Composer model={model} setModel={setModel} onSend={send} />
      </div>
    </div>
  );
}

                    </div>
                    <div style={{ height: 4, borderRadius: 99, background: t.surfaceHover, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${u.p * 100}%`, background: `linear-gradient(90deg, ${t.accent}, ${t.accent2})`, borderRadius: 99 }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'models' && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 600, color: t.text, marginBottom: 6 }}>模型</div>
              <div style={{ fontSize: 13, color: t.text3, marginBottom: 24 }}>选择默认模型与上下文策略。</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {MODELS.map((m, i) => (
                  <div key={m.id} style={{
                    display: 'flex', alignItems: 'center', gap: 14, padding: 14,
                    background: t.surface, border: `0.5px solid ${i === 0 ? t.accentBorder : t.border}`,
                    borderRadius: 10,
                  }}>
                    <div style={{ width: 36, height: 36, borderRadius: 8, background: `color-mix(in oklab, ${m.color} 20%, ${t.surface})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <span style={{ width: 10, height: 10, borderRadius: 99, background: m.color }} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontSize: 14, fontWeight: 600, color: t.text }}>{m.name}</span>
                        {m.tag && <Pill color={m.color}>{m.tag}</Pill>}
                      </div>
                      <div style={{ fontSize: 12, color: t.text3, marginTop: 3 }}>{m.desc}</div>
                    </div>
                    <div style={{
                      width: 36, height: 22, borderRadius: 99,
                      background: i === 0 ? t.accent : t.surfaceHover,
                      position: 'relative', cursor: 'pointer', transition: 'background 0.15s',
                    }}>
                      <div style={{ position: 'absolute', top: 2, left: i === 0 ? 16 : 2, width: 18, height: 18, borderRadius: '50%', background: '#fff', transition: 'left 0.15s', boxShadow: '0 1px 3px rgba(0,0,0,0.15)' }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'appearance' && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 600, color: t.text, marginBottom: 6 }}>外观</div>
              <div style={{ fontSize: 13, color: t.text3, marginBottom: 24 }}>主题、字号、密度。</div>
              <div style={{ fontSize: 13, fontWeight: 500, color: t.text2, marginBottom: 10 }}>主题</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
                {[
                  { id: 'light', label: '浅色', bg: '#faf8f5' },
                  { id: 'dark', label: '深色', bg: '#15131a' },
                  { id: 'auto', label: '跟随系统', bg: 'linear-gradient(135deg, #faf8f5 50%, #15131a 50%)' },
                ].map(o => (
                  <div key={o.id} onClick={() => o.id !== 'auto' && setTheme(o.id)} style={{
                    padding: 14, borderRadius: 10, cursor: 'pointer',
                    background: t.surface, border: `1.5px solid ${theme === o.id ? t.accent : t.border}`,
                  }}>
                    <div style={{ height: 60, borderRadius: 6, background: o.bg, marginBottom: 8, border: `0.5px solid ${t.border}` }} />
                    <div style={{ fontSize: 12.5, color: t.text, fontWeight: 500, textAlign: 'center' }}>{o.label}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 500, color: t.text2, marginBottom: 10 }}>强调色</div>
                <div style={{ display: 'flex', gap: 10 }}>
                  {['oklch(50% 0.22 268)', 'oklch(55% 0.22 320)', 'oklch(52% 0.20 195)', 'oklch(55% 0.20 155)', 'oklch(60% 0.18 65)', 'oklch(58% 0.22 25)'].map((c, i) => (
                    <div key={i} style={{
                      width: 32, height: 32, borderRadius: '50%', background: c, cursor: 'pointer',
                      border: i === 0 ? `2px solid ${t.text}` : '2px solid transparent',
                      boxShadow: i === 0 ? `0 0 0 2px ${t.windowBg}, 0 0 0 4px ${c}` : 'none',
                    }} />
                  ))}
                </div>
              </div>
            </div>
          )}

          {tab === 'shortcuts' && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 600, color: t.text, marginBottom: 6 }}>快捷键</div>
              <div style={{ fontSize: 13, color: t.text3, marginBottom: 24 }}>全局与会话内快捷键。</div>
              <div style={{ background: t.surface, border: `0.5px solid ${t.border}`, borderRadius: 10, overflow: 'hidden' }}>
                {[
                  { l: '新建对话', k: '⌘ N' },
                  { l: '搜索', k: '⌘ K' },
                  { l: '切换工作区', k: '⌘ ⇧ W' },
                  { l: '打开知识库抽屉', k: '⌘ /' },
                  { l: '发送消息', k: '⌘ ↩' },
                  { l: '切换深/浅色', k: '⌘ ⇧ L' },
                  { l: '打开设置', k: '⌘ ,' },
                ].map((s, i, arr) => (
                  <div key={s.l} style={{ display: 'flex', alignItems: 'center', padding: '12px 16px', borderBottom: i < arr.length - 1 ? `0.5px solid ${t.border}` : 'none' }}>
                    <span style={{ flex: 1, fontSize: 13, color: t.text }}>{s.l}</span>
                    <span style={{ fontSize: 12, color: t.text3, fontFamily: '-apple-system', padding: '3px 8px', background: t.surfaceHover, borderRadius: 5, border: `0.5px solid ${t.border}` }}>{s.k}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'knowledge' && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 600, color: t.text, marginBottom: 6 }}>知识库</div>
              <div style={{ fontSize: 13, color: t.text3, marginBottom: 24 }}>{KNOWLEDGE.length} 项 · 全局可被任何工作区引用。</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {KNOWLEDGE.map(k => (
                  <div key={k.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', background: t.surface, border: `0.5px solid ${t.border}`, borderRadius: 9 }}>
                    <div style={{ width: 32, height: 32, borderRadius: 7, background: t.surfaceHover, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Icon name={k.type === 'file' ? 'file' : k.type === 'memory' ? 'brain' : 'link'} size={15} color={k.type === 'memory' ? t.accent2 : t.accent} stroke={1.7} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 500, color: t.text }}>{k.name}</div>
                      <div style={{ fontSize: 11.5, color: t.text4, marginTop: 1 }}>{k.size} · {k.tag}</div>
                    </div>
                    <Icon name="dots" size={14} color={t.text3} />
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState('dark');
  const t = useMemo(() => tokens(theme === 'dark'), [theme]);
  const [activeWs, setActiveWs] = useState('work');
  const [activeSession, setActiveSession] = useState('s1');
  const [knowledgeOpen, setKnowledgeOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const session = ALL_SESSIONS.find(s => s.id === activeSession) || ALL_SESSIONS[0];

  return (
    <Theme.Provider value={t}>
      <div style={{
        width: '100vw', height: '100vh',
        background: t.appBg,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 0, overflow: 'hidden',
        transition: 'background 0.3s ease',
      }} data-screen-label="灵犀 macOS">
        {/* macOS Window */}
        <div style={{
          width: '100%', height: '100%',
          background: t.windowBg, borderRadius: 0, overflow: 'hidden',
          boxShadow: t.windowShadow,
          display: 'flex', position: 'relative',
        }}>
          {/* Traffic lights (overlay on top of sidebar) */}
          <div style={{
            position: 'absolute', top: 14, left: 16, zIndex: 30,
            display: 'flex', gap: 8,
          }}>
            {['#ff5f57', '#febc2e', '#28c840'].map(c => (
              <div key={c} style={{ width: 12, height: 12, borderRadius: '50%', background: c, border: '0.5px solid rgba(0,0,0,0.1)' }} />
            ))}
          </div>

          <Sidebar
            activeWs={activeWs} setActiveWs={setActiveWs}
            activeSession={activeSession} setActiveSession={setActiveSession}
            openSettings={() => setSettingsOpen(true)}
            openKnowledge={() => setKnowledgeOpen(true)}
          />
          <ChatArea session={session} knowledgeOpen={knowledgeOpen} setKnowledgeOpen={setKnowledgeOpen} theme={theme} setTheme={setTheme} />
          <KnowledgePanel open={knowledgeOpen} onClose={() => setKnowledgeOpen(false)} />
        </div>

        <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} theme={theme} setTheme={setTheme} />
      </div>
    </Theme.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
