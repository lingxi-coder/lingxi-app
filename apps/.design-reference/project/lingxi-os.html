<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵犀 OS — AI智能手机界面</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    overflow: hidden; height: 100vh; width: 100vw;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink-cursor {
    0%, 100% { opacity: 1; } 50% { opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); } to { transform: rotate(360deg); }
  }
  @keyframes ripple {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  /* Hide scrollbars throughout the phone screens */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── THEME SYSTEM ────────────────────────────────────────────
const ThemeContext = React.createContext(null);
const useTheme = () => React.useContext(ThemeContext);

function makeTheme(isDark) {
  if (isDark) return {
    isDark: true,
    phoneBg: '#050310',
    canvasBg: '#04030e',
    canvasGrad: 'radial-gradient(ellipse 80% 60% at 30% 20%, oklch(20% 0.12 258 / 0.6), transparent), radial-gradient(ellipse 60% 50% at 80% 80%, oklch(18% 0.12 300 / 0.5), transparent)',
    screenBgCss: 'radial-gradient(ellipse 120% 60% at 50% 0%, oklch(30% 0.15 258 / 0.7) 0%, transparent 65%), radial-gradient(ellipse 80% 40% at 80% 100%, oklch(28% 0.15 300 / 0.5) 0%, transparent 60%), linear-gradient(160deg, #08061280 0%, #06050f 100%)',
    glass: 'rgba(255,255,255,0.06)',
    glassBorder: 'rgba(255,255,255,0.12)',
    accent: 'oklch(72% 0.18 258)',
    accentSoft: 'oklch(72% 0.18 258 / 0.2)',
    accent2: 'oklch(72% 0.18 300)',
    accent3: 'oklch(72% 0.18 200)',
    textPrimary: 'rgba(255,255,255,0.95)',
    textSecondary: 'rgba(255,255,255,0.55)',
    textMuted: 'rgba(255,255,255,0.28)',
    success: 'oklch(72% 0.18 155)',
    warning: 'oklch(72% 0.18 80)',
    danger: 'oklch(72% 0.18 30)',
    titlePillBg: 'rgba(255,255,255,0.05)',
    titlePillBorder: 'rgba(255,255,255,0.10)',
    navBtnActive: 'linear-gradient(135deg, oklch(50% 0.2 258), oklch(50% 0.2 300))',
    navBtnInactive: 'rgba(255,255,255,0.05)',
    navBtnActiveText: '#fff',
    navBtnInactiveText: 'rgba(255,255,255,0.45)',
    frameBoxShadow: '0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.04)',
    statusBarColor: 'rgba(255,255,255,0.9)',
    homeIndicator: 'rgba(255,255,255,0.5)',
    orb1: 'radial-gradient(circle, oklch(40% 0.2 258 / 0.3) 0%, transparent 70%)',
    orb2: 'radial-gradient(circle, oklch(40% 0.2 300 / 0.25) 0%, transparent 70%)',
  };
  // ── LIGHT THEME ──
  return {
    isDark: false,
    phoneBg: '#f0eef8',
    canvasBg: '#e8e5f5',
    canvasGrad: 'radial-gradient(ellipse 80% 60% at 30% 20%, oklch(85% 0.08 258 / 0.8), transparent), radial-gradient(ellipse 60% 50% at 80% 80%, oklch(85% 0.08 300 / 0.6), transparent)',
    screenBgCss: 'radial-gradient(ellipse 120% 60% at 50% 0%, oklch(88% 0.10 258 / 0.8) 0%, transparent 65%), radial-gradient(ellipse 80% 40% at 80% 100%, oklch(87% 0.10 300 / 0.6) 0%, transparent 60%), linear-gradient(160deg, #ede9fa 0%, #f5f3fc 100%)',
    glass: 'rgba(255,255,255,0.55)',
    glassBorder: 'rgba(140,120,200,0.20)',
    accent: 'oklch(52% 0.20 258)',
    accentSoft: 'oklch(52% 0.20 258 / 0.12)',
    accent2: 'oklch(52% 0.20 300)',
    accent3: 'oklch(52% 0.20 200)',
    textPrimary: 'rgba(20,10,50,0.92)',
    textSecondary: 'rgba(60,40,120,0.60)',
    textMuted: 'rgba(80,60,140,0.38)',
    success: 'oklch(52% 0.18 155)',
    warning: 'oklch(52% 0.18 80)',
    danger: 'oklch(52% 0.18 30)',
    titlePillBg: 'rgba(255,255,255,0.65)',
    titlePillBorder: 'rgba(140,120,200,0.25)',
    navBtnActive: 'linear-gradient(135deg, oklch(52% 0.20 258), oklch(52% 0.20 300))',
    navBtnInactive: 'rgba(255,255,255,0.55)',
    navBtnActiveText: '#fff',
    navBtnInactiveText: 'rgba(60,40,120,0.55)',
    frameBoxShadow: '0 40px 80px rgba(100,80,180,0.18), 0 0 0 1px rgba(140,120,200,0.25), inset 0 0 0 1px rgba(255,255,255,0.7)',
    statusBarColor: 'rgba(20,10,50,0.85)',
    homeIndicator: 'rgba(80,60,140,0.35)',
    orb1: 'radial-gradient(circle, oklch(80% 0.12 258 / 0.5) 0%, transparent 70%)',
    orb2: 'radial-gradient(circle, oklch(80% 0.12 300 / 0.4) 0%, transparent 70%)',
  };
}

// Reactive tokens — components call useTheme() to get T
let T = makeTheme(true); // fallback for non-context usage

// Glass card — reads theme from context
const GlassCard = ({ children, style = {}, onClick }) => {
  const th = useTheme() || T;
  return (
    <div onClick={onClick} style={{
      background: th.glass,
      border: `0.5px solid ${th.glassBorder}`,
      backdropFilter: 'blur(20px) saturate(180%)',
      WebkitBackdropFilter: 'blur(20px) saturate(180%)',
      borderRadius: 20,
      ...style,
    }}>{children}</div>
  );
};

// Glow dot
const GlowDot = ({ color, size = 6 }) => {
  const th = useTheme() || T;
  const c = color || th.accent;
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: c,
      boxShadow: `0 0 ${size * 2}px ${c}`,
    }} />
  );
};

// ScreenBg — renders the gradient bg layer
const ScreenBg = () => {
  const th = useTheme() || T;
  return <div style={{ position: 'absolute', inset: 0, background: th.screenBgCss }} />;
};

// ─── SCREEN 1: LOCK SCREEN ───────────────────────────────────
function LockScreen({ active }) {
  const th = useTheme() || T;
  const [unlocked, setUnlocked] = useState(false);
  const [time, setTime] = useState('');
  const [date, setDate] = useState('');

  useEffect(() => {
    const update = () => {
      const now = new Date();
      setTime(now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }));
      setDate(now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }));
    };
    update();
    const t = setInterval(update, 1000);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
      <ScreenBg />
      {/* Ambient orbs */}
      <div style={{ position: 'absolute', top: -60, left: -40, width: 260, height: 260, borderRadius: '50%', background: th.orb1, animation: 'pulse-glow 4s ease-in-out infinite' }} />
      <div style={{ position: 'absolute', bottom: 80, right: -60, width: 200, height: 200, borderRadius: '50%', background: th.orb2, animation: 'pulse-glow 5s ease-in-out infinite 1s' }} />

      <div style={{ position: 'relative', zIndex: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', height: '100%', paddingTop: 64 }}>
        {/* Time */}
        <div style={{
          fontSize: 80, fontWeight: 200, color: th.textPrimary, letterSpacing: -4,
          lineHeight: 1, fontVariantNumeric: 'tabular-nums',
          fontFamily: '-apple-system, system-ui',
          textShadow: `0 0 40px ${th.accent}80`,
        }}>{time || '09:41'}</div>
        <div style={{ fontSize: 17, color: th.textSecondary, marginTop: 12, fontWeight: 300 }}>
          {date || '2026年5月2日 星期六'}
        </div>

        {/* AI Summary card */}
        <GlassCard style={{ margin: '32px 16px 0', padding: '16px 20px', width: 'calc(100% - 32px)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
            <div style={{ width: 28, height: 28, borderRadius: 8, background: 'linear-gradient(135deg, oklch(60% 0.2 258), oklch(60% 0.2 300))', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="white" strokeWidth="1.5"/><path d="M7 4v3l2 2" stroke="white" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </div>
            <span style={{ fontSize: 13, color: th.textSecondary, fontWeight: 500, letterSpacing: 0.3 }}>灵犀 · 今日摘要</span>
          </div>
          <div style={{ fontSize: 15, color: th.textPrimary, lineHeight: 1.6, fontWeight: 300 }}>
            今天有 <span style={{ color: th.accent, fontWeight: 500 }}>3个会议</span>，下午有一个重要的产品评审。明天飞上海的机票已确认，需要提前 2 小时到达机场。
          </div>
        </GlassCard>

        {/* Notification pills */}
        <div style={{ width: 'calc(100% - 32px)', display: 'flex', flexDirection: 'column', gap: 8, marginTop: 16 }}>
          {[
            { app: '微信', msg: '张总: 明天的方案确认一下', time: '刚刚', color: th.success },
            { app: '灵犀提醒', msg: '10:30 产品周会 — 15分钟后', time: '10:15', color: th.warning },
          ].map((n, i) => (
            <GlassCard key={i} style={{ padding: '12px 16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <GlowDot color={n.color} size={7} />
                <span style={{ fontSize: 12, color: th.textSecondary, fontWeight: 500 }}>{n.app}</span>
                <span style={{ marginLeft: 'auto', fontSize: 11, color: th.textMuted }}>{n.time}</span>
              </div>
              <div style={{ fontSize: 14, color: th.textPrimary, marginTop: 5, fontWeight: 300 }}>{n.msg}</div>
            </GlassCard>
          ))}
        </div>

        {/* Unlock hint */}
        <div style={{ marginTop: 32, marginBottom: 24, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
          <div style={{ position: 'relative', width: 56, height: 56 }}>
            <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', border: `1.5px solid ${th.accent}`, animation: 'ripple 2s ease-out infinite' }} />
            <div style={{ position: 'absolute', inset: 6, borderRadius: '50%', background: th.accentSoft, border: `1px solid ${th.accent}60`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="18" height="22" viewBox="0 0 18 22" fill="none"><rect x="3" y="10" width="12" height="10" rx="2.5" stroke={th.accent} strokeWidth="1.5"/><path d="M5 10V6.5a4 4 0 018 0V10" stroke={th.accent} strokeWidth="1.5" strokeLinecap="round"/></svg>
            </div>
          </div>
          <span style={{ fontSize: 13, color: th.textMuted, letterSpacing: 0.5 }}>上滑解锁 · 或说"灵犀，打开"</span>
        </div>
      </div>
    </div>
  );
}

// ─── SCREEN 2: HOME / TIMELINE ────────────────────────────────
function HomeScreen() {
  const th = useTheme() || T;
  const [selectedTab, setSelectedTab] = useState('今天');
  const tabs = ['昨天', '今天', '明天'];

  const timelineItems = [
    { time: '08:00', type: 'done', title: '晨间简报', sub: '灵犀已为你整理了今天的要点', icon: '☀️', color: th.accent3 },
    { time: '09:30', type: 'done', title: '发送周报邮件', sub: '已自动生成并发送至 5 人', icon: null, color: th.success },
    { time: '10:30', type: 'now', title: '产品周会', sub: '腾讯会议 · 主持人: 李总', icon: null, color: th.warning },
    { time: '13:00', type: 'future', title: '午饭 · 与设计团队', sub: '外卖预计 12:45 到达', icon: null, color: th.accent },
    { time: '15:00', type: 'future', title: '产品评审 PRD v2', sub: '你有 3 条待回复评论', icon: null, color: th.accent2 },
    { time: '18:30', type: 'future', title: '健身', sub: '已预约私教 · 3.8公里 昨日步数', icon: null, color: th.accent3 },
  ];

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
      <ScreenBg />
      <div style={{ position: 'absolute', top: -80, right: -60, width: 240, height: 240, borderRadius: '50%', background: th.orb1, pointerEvents: 'none' }} />

      <div style={{ position: 'relative', zIndex: 2, display: 'flex', flexDirection: 'column', height: '100%', paddingTop: 56 }}>
        {/* Header */}
        <div style={{ padding: '8px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 600, color: th.textPrimary, letterSpacing: -0.5 }}>你好，Alex</div>
            <div style={{ fontSize: 13, color: th.textSecondary, marginTop: 2 }}>今天还有 <span style={{ color: th.accent }}>4 件事</span> 待完成</div>
          </div>
          <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg, oklch(60% 0.2 258), oklch(60% 0.2 300))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>👤</div>
        </div>

        {/* Tab bar */}
        <div style={{ display: 'flex', gap: 4, padding: '16px 20px 0' }}>
          {tabs.map(t => (
            <button key={t} onClick={() => setSelectedTab(t)} style={{
              padding: '7px 18px', borderRadius: 20, border: 'none', cursor: 'pointer',
              background: selectedTab === t ? th.accent : th.glass,
              color: selectedTab === t ? '#fff' : th.textSecondary,
              fontSize: 13, fontWeight: selectedTab === t ? 600 : 400,
              fontFamily: 'inherit',
              backdropFilter: 'blur(10px)',
              transition: 'all 0.2s ease',
              boxShadow: selectedTab === t ? `0 4px 16px ${th.accent}50` : 'none',
            }}>{t}</button>
          ))}
        </div>

        {/* Timeline */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px 100px', display: 'flex', flexDirection: 'column', gap: 0 }}>
          {timelineItems.map((item, i) => (
            <div key={i} style={{ display: 'flex', gap: 14, position: 'relative' }}>
              {/* Line + dot */}
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: 40, flexShrink: 0 }}>
                <div style={{ fontSize: 11, color: item.type === 'now' ? th.warning : th.textMuted, fontWeight: 500, marginTop: 4, lineHeight: 1.2, textAlign: 'center', whiteSpace: 'nowrap' }}>{item.time}</div>
                <div style={{ width: item.type === 'now' ? 10 : 7, height: item.type === 'now' ? 10 : 7, borderRadius: '50%', background: item.color, margin: '8px 0', flexShrink: 0, boxShadow: item.type === 'now' ? `0 0 12px ${item.color}` : 'none', animation: item.type === 'now' ? 'pulse-glow 2s ease-in-out infinite' : 'none' }} />
                {i < timelineItems.length - 1 && (
                  <div style={{ width: 1, flex: 1, minHeight: 20, background: `linear-gradient(to bottom, ${item.color}40, transparent)` }} />
                )}
              </div>
              {/* Card */}
              <GlassCard style={{
                flex: 1, padding: '12px 14px', marginBottom: 10,
                opacity: item.type === 'done' ? 0.55 : 1,
                border: item.type === 'now' ? `0.5px solid ${th.warning}50` : `0.5px solid ${th.glassBorder}`,
                boxShadow: item.type === 'now' ? `0 0 20px ${th.warning}20` : 'none',
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 500, color: th.textPrimary, flex: 1 }}>{item.title}</span>
                  {item.type === 'done' && <span style={{ fontSize: 11, color: th.success }}>✓ 完成</span>}
                  {item.type === 'now' && <span style={{ fontSize: 11, color: th.warning, fontWeight: 600, padding: '2px 8px', borderRadius: 10, background: `${th.warning}20` }}>进行中</span>}
                </div>
                <div style={{ fontSize: 12, color: th.textSecondary, marginTop: 4, fontWeight: 300 }}>{item.sub}</div>
              </GlassCard>
            </div>
          ))}
        </div>

        {/* Bottom AI bar */}
        <div style={{ position: 'absolute', bottom: 20, left: 16, right: 16 }}>
          <GlassCard style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: `0 8px 32px rgba(0,0,0,0.4), 0 0 0 0.5px ${th.accent}30` }}>
            <div style={{ width: 32, height: 32, borderRadius: 10, background: `linear-gradient(135deg, ${th.accent}, ${th.accent2})`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" fill="white"/><path d="M8 2v1M8 13v1M2 8h1M13 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M3.5 12.5l.7-.7M11.8 4.2l.7-.7" stroke="white" strokeWidth="1.2" strokeLinecap="round"/></svg>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, color: th.textMuted, fontWeight: 300 }}>问灵犀…</div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: th.glass, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="5" r="2.5" stroke={th.textSecondary} strokeWidth="1.3"/><path d="M2 12c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5" stroke={th.textSecondary} strokeWidth="1.3" strokeLinecap="round"/></svg>
              </div>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: th.glass, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="4.5" y="1" width="5" height="9" rx="2.5" stroke={th.textSecondary} strokeWidth="1.3"/><path d="M2 9c0 2.8 2 4 5 4s5-1.2 5-4M7 13v1" stroke={th.textSecondary} strokeWidth="1.3" strokeLinecap="round"/></svg>
              </div>
            </div>
          </GlassCard>
        </div>
      </div>
    </div>
  );
}

// ─── SCREEN 3: AI CHAT ────────────────────────────────────────
function ChatScreen() {
  const th = useTheme() || T;
  const [input, setInput] = useState('');
  const [thinking, setThinking] = useState(false);
  const messages = [
    { role: 'ai', text: '你好 Alex，今天有什么我可以帮你的？', time: '09:41' },
    { role: 'user', text: '帮我查一下明天上海的天气，顺便看看我有没有带伞', time: '09:42' },
    { role: 'ai', text: '明天上海 🌧️ 小到中雨，气温 16–22°C。\n\n我扫描了你的行李清单备忘录，**没有看到折叠伞**。要我帮你在附近的便利店预订一把吗，或者提醒你出门前带伞？', time: '09:42', actions: ['预订折叠伞', '设置提醒', '查看路线'] },
    { role: 'user', text: '设置提醒，明天早上7点', time: '09:43' },
    { role: 'ai', text: '✅ 已设置：**明天早上 7:00** 提醒「带雨伞 ☂️」\n\n还有其他需要为这次出行准备的吗？', time: '09:43' },
  ];

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
      <ScreenBg />
      <div style={{ position: 'relative', zIndex: 2, display: 'flex', flexDirection: 'column', height: '100%', paddingTop: 56 }}>
        {/* Header */}
        <div style={{ padding: '8px 20px 12px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: `0.5px solid ${th.glassBorder}` }}>
          <div style={{ width: 36, height: 36, borderRadius: 12, background: 'linear-gradient(135deg, oklch(60% 0.2 258), oklch(60% 0.2 300))', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="4" fill="white"/><path d="M9 2v1.5M9 14.5V16M2 9h1.5M14.5 9H16" stroke="white" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <div style={{ position: 'absolute', bottom: -2, right: -2, width: 10, height: 10, borderRadius: '50%', background: th.success, border: '1.5px solid #08061a' }} />

// ─── SCREEN SHELL WITH NAVIGATION ─────────────────────────────

const PHONE_W = 390;
const PHONE_H = 844;

// ─── SCALED PHONE WRAPPER ─────────────────────────────────────
function ScaledPhone({ screenId }) {
  const containerRef = useRef(null);
  const [scale, setScale] = useState(0.8);

  useEffect(() => {
    const compute = () => {
      if (!containerRef.current) return;
      const parent = containerRef.current.parentElement;
      if (!parent) return;
      const availW = parent.clientWidth - 160; // nav panel ~140px + gap
      const availH = parent.clientHeight - 24; // padding
      const scaleByH = availH / PHONE_H;
      const scaleByW = availW / PHONE_W;
      setScale(Math.min(scaleByH, scaleByW, 1));
    };
    compute();
    const ro = new ResizeObserver(compute);
    if (containerRef.current?.parentElement) ro.observe(containerRef.current.parentElement);
    return () => ro.disconnect();
  }, []);

  return (
    <div ref={containerRef} style={{
      position: 'relative', zIndex: 5, flexShrink: 0,
      width: PHONE_W * scale,
      height: PHONE_H * scale,
    }}>
      <div style={{
        position: 'absolute', top: 0, left: 0,
        width: PHONE_W, height: PHONE_H,
        transformOrigin: 'top left',
        transform: `scale(${scale})`,
      }}>
        <PhoneShell screenId={screenId} />
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App() {
  const [activeScreen, setActiveScreen] = useState('lock');
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [isDark, setIsDark] = useState(true);
  const theme = React.useMemo(() => makeTheme(isDark), [isDark]);
  T = theme; // keep global T in sync for residual references

  // Tweaks protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <ThemeContext.Provider value={theme}>

            <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="2" fill="white"/><path d="M5 1v1M5 8v1M1 5h1M8 5h1" stroke="white" strokeWidth="1.2" strokeLinecap="round" opacity="0.6"/></svg>
          </div>
          <span style={{ fontSize: 13, fontWeight: 600, color: theme.textPrimary, letterSpacing: 0.3 }}>灵犀 OS</span>
          <span style={{ fontSize: 11, color: theme.textMuted, borderLeft: `0.5px solid ${theme.glassBorder}`, paddingLeft: 8 }}>AI智能手机界面原型</span>
          {/* Theme toggle */}

            marginLeft: 4, padding: '3px 10px', borderRadius: 10,
            border: `0.5px solid ${theme.glassBorder}`,
            background: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(100,80,180,0.12)',
            color: theme.textSecondary, fontSize: 11, cursor: 'pointer',
            fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 5,
            transition: 'all 0.2s ease',
          }}>
            {isDark ? '☀️ 浅色' : '🌙 深色'}
          </button>
        </div>
      </div>

      {/* Main area — nav + phone side by side */}
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 24, padding: '12px 24px 20px', position: 'relative', minHeight: 0 }}>
        {/* Screen selector */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flexShrink: 0, alignSelf: 'center' }}>
          {SCREENS.map(s => (
            <button key={s.id} onClick={() => setActiveScreen(s.id)} style={{
              padding: '8px 16px', borderRadius: 12, border: 'none', cursor: 'pointer',

            }}>{s.label}</button>
          ))}
        </div>

        {/* Phone — auto-scale to fit remaining space */}
        <ScaledPhone screenId={activeScreen} />
      </div>

      {/* Tweaks panel */}
      {tweaksVisible && (
        <div style={{
          position: 'fixed', bottom: 32, right: 32, zIndex: 1000,
          background: isDark ? 'rgba(16,14,36,0.96)' : 'rgba(240,238,252,0.96)',

          </div>
          {/* Theme toggle in tweaks */}

          {SCREENS.map(s => (
            <button key={s.id} onClick={() => setActiveScreen(s.id)} style={{
              display: 'block', width: '100%', padding: '8px 12px', borderRadius: 10, border: 'none',
              background: activeScreen === s.id ? `${theme.accent}25` : theme.glass,
              color: activeScreen === s.id ? theme.accent : theme.textSecondary,
              fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', marginBottom: 4,
              fontWeight: activeScreen === s.id ? 600 : 400,
            }}>{s.label}</button>
          ))}
        </div>
      )}
    </div>
    </ThemeContext.Provider>
  );
}
