name: LingXiDesktopCrashlytics
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2
targets:
  LingXiDesktopCrashlytics:
    type: framework
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Sources/LingXiDesktopCrashlytics
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.crashlytics
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: NO
