name: LingxiCode
options:
  bundleIdPrefix: com.lingxi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: "zh-Hans"

attributes:
  knownRegions:
    - zh-Hans
    - zh-Hant
    - en
    - ja
    - ko

configs:
  StoreDebug: debug
  StoreRelease: release
  FullDebug: debug
  FullRelease: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    # The company team the user configured in Xcode (2026-08-09) — kept in the
    # generator source so `xcodegen generate` stops resetting code signing.
    DEVELOPMENT_TEAM: "AZ4AX7J833"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (NavigationSplitView goes multi-column on iPad)
    CFBundleLocalizations:
      - zh-Hans
      - zh-Hant
      - en
      - ja
      - ko

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0

targets:
  LingxiCode:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - ConversationWidget/**
          - LinuxRuntimeNative/**
      # Generated UniFFI Swift bindings (reproduce via scripts/build-xcframework.sh).
      # Gitignored; compiled directly into this app target. They import the
      # per-namespace C/FFI clang modules from LingxiCodeFFI.xcframework below.
      - path: Generated
      - path: Resources
        excludes:
          - Firebase/**
      - path: ../../../config/product-config.json
        buildPhase: resources
      - path: ../../../docs/mobile-linux/mobile-linux-native-pins.json
        buildPhase: resources
      - path: ../../../resources/extensions/public-directory.json
        buildPhase: resources
      - path: ../../../resources/mermaid/mermaid.html
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseInstallations
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ConversationWidget
        embed: true
      # UniFFI FFI static-library xcframework: exports the harness_runtime /
      # client_protocol C symbols the generated bindings call, and ships the
      # clang modulemap (module.modulemap) that defines the *FFI modules the
      # generated Swift imports via `#if canImport(...)`. Static archive →
      # link into the binary, do NOT embed (no dylib to copy).
      - framework: Frameworks/LingxiCodeFFI.xcframework
        embed: false
        link: true
      # Shared Rust media references the official static GStreamer archive;
      # linking this XCFramework once at the app boundary resolves those symbols.
      - framework: Frameworks/GStreamer.xcframework
        embed: false
        link: true
      # Native support contains Swift/ObjC/C iSH glue, with no second Rust core.
      - framework: Frameworks/MobileLinuxNativeSupport.xcframework
        embed: false
        link: true
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
        link: true
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
        link: true
      # Native Rust dependencies reference the platform zlib/iconv supplied by
      # the iOS SDK; static XCFrameworks cannot encode these transitive links.
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
      # Device-only iSH uses SQLite-backed fakefs, the host resolver, and
      # SystemConfiguration for live DNS updates. The iSH archives themselves
      # are supplied by the fixed SDK's native-support framework. Its simulator
      # slices report unavailable and contain no iSH kernel.
      - sdk: libsqlite3.tbd
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      # The pinned GStreamer applemedia slice contains iosassetsrc, which
      # retains the legacy AssetsLibrary class references in its static archive.
      - sdk: AssetsLibrary.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/LingxiCode-Bridging-Header.h
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Account.entitlements
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "8721"
        APS_ENVIRONMENT: development
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        CRASHLYTICS_COLLECTION_ENABLED: "NO"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # The Cargo-locked SDK lives outside SRCROOT; the build scripts only
        # write generated products under this app's build/ and Frameworks/.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        StoreDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code
          FIREBASE_REVERSED_CLIENT_ID: com.googleusercontent.apps.55470483519-lpv35qh1vufvtpi63eg024osucdofeml
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINGXI_STORE"
        StoreRelease:
          CRASHLYTICS_COLLECTION_ENABLED: "YES"
          APS_ENVIRONMENT: production
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code
          FIREBASE_REVERSED_CLIENT_ID: com.googleusercontent.apps.55470483519-lpv35qh1vufvtpi63eg024osucdofeml
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINGXI_STORE"
        FullDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.full
          FIREBASE_REVERSED_CLIENT_ID: com.googleusercontent.apps.55470483519-qtq162qv2bl6f5ft5pb2538ra9mmrf22
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINGXI_FULL"
        FullRelease:
          CRASHLYTICS_COLLECTION_ENABLED: "YES"
          APS_ENVIRONMENT: production
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.full
          FIREBASE_REVERSED_CLIENT_ID: com.googleusercontent.apps.55470483519-qtq162qv2bl6f5ft5pb2538ra9mmrf22
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINGXI_FULL"
    preBuildScripts:
      - name: Stage product namespace
        basedOnDependencyAnalysis: false
        script: /bin/bash "${SRCROOT}/scripts/stage-product-namespace.sh" "${LINGXI_PYTHON3:-}"
      - name: Select Firebase application
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          FIREBASE_CONFIG="${SRCROOT}/Resources/Firebase/${PRODUCT_BUNDLE_IDENTIFIER}/GoogleService-Info.plist"
          test -f "${FIREBASE_CONFIG}"
          # Reject a mismatched OAuth client before shipping an app whose Google
          # callback cannot return to the selected Store / Full variant.
          CONFIG_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "${FIREBASE_CONFIG}")
          CONFIG_CALLBACK=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "${FIREBASE_CONFIG}")
          if [ "${CONFIG_BUNDLE_ID}" != "${PRODUCT_BUNDLE_IDENTIFIER}" ] || [ "${CONFIG_CALLBACK}" != "${FIREBASE_REVERSED_CLIENT_ID}" ]; then
            echo "error: Firebase iOS bundle ID or Google callback scheme does not match the selected build configuration."
            exit 1
          fi
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${FIREBASE_CONFIG}" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
      - name: Stage Alpine rootfs
        basedOnDependencyAnalysis: false
        script: |
          if [ "${PLATFORM_NAME}" != "iphoneos" ]; then
            exit 0
          fi
          RUNTIME_STAGE_ROOT="${SRCROOT}/build/linux-runtime/openminis"
          RUNTIME_RESOURCES="${SRCROOT}/build/linux-runtime/openminis/resources"
          ROOTFS_ARCHIVE="${RUNTIME_RESOURCES}/alpine-rootfs.zip"
          if [ ! -f "${ROOTFS_ARCHIVE}" ]; then
            echo "error: Alpine rootfs is missing. Run apps/ios/native/scripts/build-linux-runtime.sh first."
            exit 1
          fi
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DESTINATION}"
          cp "${ROOTFS_ARCHIVE}" "${DESTINATION}/alpine-rootfs.zip"
          if [ -d "${RUNTIME_RESOURCES}/default_mount" ]; then
            rm -rf "${DESTINATION}/default_mount"
            cp -R "${RUNTIME_RESOURCES}/default_mount" "${DESTINATION}/default_mount"
          fi
          if [ -f "${RUNTIME_RESOURCES}/libvdso.so.elf" ]; then
            cp "${RUNTIME_RESOURCES}/libvdso.so.elf" "${DESTINATION}/libvdso.so.elf"
          fi
          if [ -f "${RUNTIME_STAGE_ROOT}/manifest.json" ]; then
            cp "${RUNTIME_STAGE_ROOT}/manifest.json" "${DESTINATION}/linux-runtime-manifest.json"
          elif [ -f "${RUNTIME_RESOURCES}/runtime-manifest.json" ]; then
            cp "${RUNTIME_RESOURCES}/runtime-manifest.json" "${DESTINATION}/linux-runtime-manifest.json"
          else
            echo "error: Linux runtime manifest is missing; rebuild the Alpine runtime."
            exit 1
          fi
          # iSH's FsApplyOverlay does
          #   [NSBundle bundleWithURL:[mainBundle URLForResource:@"RootfsPatch" ...]]
          # and only then checks the RESULT for nil — but URLForResource:
          # returns nil when the bundle is absent, and +bundleWithURL: RAISES on
          # a nil URL. Shipping this bundle is the supported configuration of
          # the vendored component; without it the app aborts inside
          # -[ISHKernel bootWithRootPath:] the first time a terminal opens.
          # Fail the build rather than the device.
          PATCH_BUNDLE="${RUNTIME_RESOURCES}/RootfsPatch.bundle"
          if [ ! -d "${PATCH_BUNDLE}" ]; then
            echo "error: RootfsPatch.bundle is missing; iSH FsApplyOverlay raises on a nil bundle URL and aborts the app at boot."
            exit 1
          fi
          rm -rf "${DESTINATION}/RootfsPatch.bundle"
          cp -R "${PATCH_BUNDLE}" "${DESTINATION}/RootfsPatch.bundle"
          AUTH_MANIFEST="${SRCROOT}/../../../docs/mobile-linux/authorization/AUTHORIZATION_MANIFEST.json"
          if [ -f "${AUTH_MANIFEST}" ]; then
            cp "${AUTH_MANIFEST}" "${DESTINATION}/AUTHORIZATION_MANIFEST.json"
          fi

    postBuildScripts:
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          set -eu
          # Local/debug and simulator builds do not upload symbols or reports.
          case "${CONFIGURATION}:${PLATFORM_NAME}" in
            *Release:iphoneos) ;;
            *) exit 0 ;;
          esac
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"

  # XCTest simulator e2e (M10 A2 / P4): builds the in-process engine via
  # `buildIosEngine`, submits a prompt, and asserts the streamed ClientEvent path
  # reaches a test `IosEventListener` — proving SwiftUI→UniFFI→engine→listener
  # in-process. Passes KEYLESS: with no ANTHROPIC_API_KEY the turn surfaces a
  # terminal `.error` event. Hosted in the app target so it shares the app's
  # compiled UniFFI bindings; also links the FFI xcframework so the per-namespace
  # `harness_runtimeFFI` clang module is importable here.
  LingxiCodeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
      - path: ../../../packages/deep-links/fixtures.json
        buildPhase: resources
    preBuildScripts:
      - name: Stage pinned Harness protocol fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:${PATH}"
          FIXTURE_PYTHON="${LINGXI_PYTHON3:-}"
          if [[ -z "${FIXTURE_PYTHON}" ]]; then
            for candidate in python3 python3.14 python3.13 python3.12 python3.11; do
              if command -v "${candidate}" >/dev/null && "${candidate}" -c 'import tomllib' >/dev/null 2>&1; then
                FIXTURE_PYTHON="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${FIXTURE_PYTHON}" ]]; then
            echo "Harness fixture staging requires Python 3.11+; install it or set LINGXI_PYTHON3" >&2
            exit 1
          fi
          "${FIXTURE_PYTHON}" "${SRCROOT}/scripts/stage-protocol-fixtures.py" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/HarnessProtocolFixtures"
          "${FIXTURE_PYTHON}" "${SRCROOT}/scripts/stage-local-app-fixtures.py" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/UnifiedAppFixtures"
    dependencies:
      - target: LingxiCode
      - framework: Frameworks/LingxiCodeFFI.xcframework
        embed: false
        link: true
      - framework: Frameworks/GStreamer.xcframework
        embed: false
        link: true
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: AssetsLibrary.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.tests
        GENERATE_INFOPLIST_FILE: true
        # The locked Cargo resolver reads its immutable checkout outside SRCROOT.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  ConversationWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/ConversationWidget
      - path: Sources/ConversationWidgetShared
      # The Live Activity's status chips are localized in the EXTENSION, whose
      # `Bundle.main` is this bundle — not the app's. Only the catalog is added
      # (not all of `Resources/`), so no app asset is duplicated into the
      # extension. `ConversationLiveActivityWidget` reads it through
      # `NSLocalizedString(_:value:)`, so the surface degrades to English, never
      # to raw keys, if this line is ever lost.
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.widget
        INFOPLIST_FILE: Sources/ConversationWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: false
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "8721"
      configs:
        FullDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.full.widget
        FullRelease:
          PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.full.widget

  LingxiCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
      - path: Sources/RuntimeIntegration/ProductNamespace.swift
    preBuildScripts:
      - name: Stage product namespace
        basedOnDependencyAnalysis: false
        script: /bin/bash "${SRCROOT}/scripts/stage-product-namespace.sh" "${LINGXI_PYTHON3:-}"
    dependencies:
      - target: LingxiCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.code.uitests
        GENERATE_INFOPLIST_FILE: true
        ENABLE_USER_SCRIPT_SANDBOXING: NO

# Run the unit tests under the app scheme so `xcodebuild -scheme LingxiCode test`
# executes the engine round-trip suite.
schemes:
  LingxiCode:
    build:
      targets:
        LingxiCode: all
        LingxiCodeTests: [test]
        LingxiCodeUITests: [test]
    test:
      config: StoreDebug
      targets:
        - LingxiCodeTests
        - LingxiCodeUITests
      gatherCoverageData: false
      # Unit tests assert business logic that now returns catalog-resolved
      # copy (String(localized:)), not the pre-i18n Chinese literal — without
      # this, results depend on whatever language the host Mac/simulator
      # happens to be set to. Pinning to the catalog's source language keeps
      # the suite deterministic and matches every test's existing zh-Hans
      # expected values, which were never rewritten for i18n.
      commandLineArguments:
        "-AppleLanguages (zh-Hans)": true
    run:
      config: StoreDebug

  LingxiCodeStore:
    build:
      targets:
        LingxiCode: all
        LingxiCodeTests: [test]
        LingxiCodeUITests: [test]
    test:
      config: StoreDebug
      targets:
        - LingxiCodeTests
        - LingxiCodeUITests
      commandLineArguments:
        "-AppleLanguages (zh-Hans)": true
    run:
      config: StoreDebug
    archive:
      config: StoreRelease

  LingxiCodeFull:
    build:
      targets:
        LingxiCode: all
        LingxiCodeTests: [test]
        LingxiCodeUITests: [test]
    test:
      config: FullDebug
      targets:
        - LingxiCodeTests
        - LingxiCodeUITests
      commandLineArguments:
        "-AppleLanguages (zh-Hans)": true
    run:
      config: FullDebug
    archive:
      config: FullRelease
