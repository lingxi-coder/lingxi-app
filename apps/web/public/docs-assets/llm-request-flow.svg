<svg xmlns="http://www.w3.org/2000/svg" width="850" height="540" viewBox="0 0 850 540" role="img" aria-labelledby="title desc"><title id="title">LLM request pipeline</title><desc id="desc">Host captures context, SDK resolves and validates a route, prepares attachments, encodes wire data, authenticates and dispatches, decodes streamed events and usage, then host executes local tools and persists history.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="850" height="540" rx="18" fill="#f8fafc"/><g fill="#fff" stroke="#cbd5e1"><rect x="70" y="25" width="710" height="50" rx="9"/><rect x="70" y="100" width="710" height="50" rx="9"/><rect x="70" y="175" width="710" height="50" rx="9"/><rect x="70" y="250" width="710" height="50" rx="9"/><rect x="70" y="325" width="710" height="50" rx="9"/><rect x="70" y="400" width="710" height="50" rx="9"/><rect x="70" y="475" width="710" height="40" rx="9"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a" font-size="17"><text x="425" y="56">Host context and immutable request snapshot</text><text x="425" y="131">Resolve route · validate controls and capabilities</text><text x="425" y="206">Resolve attachments and account-scoped resources</text><text x="425" y="281">Codec · finalizer · request authentication</text><text x="425" y="356">Transport dispatch · bounded stream ownership</text><text x="425" y="431">Decode events · normalize usage · settle physical attempt</text><text x="425" y="501">Harness: local tools, permissions, replay and durable history</text></g><g stroke="#64748b" stroke-width="2" marker-end="url(#a)"><path d="M425 75V98"/><path d="M425 150V173"/><path d="M425 225V248"/><path d="M425 300V323"/><path d="M425 375V398"/><path d="M425 450V473"/></g></svg>
