      <stop offset="0%" stop-color="#18353a"/>
      <stop offset="56%" stop-color="#071820"/>
      <stop offset="100%" stop-color="#03070b"/>
    </radialGradient>

    <linearGradient id="crossShade" x1="466" y1="420" x2="558" y2="604" gradientUnits="userSpaceOnUse">
