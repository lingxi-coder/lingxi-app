const Kbd = ({ children }) => {

  return <span style={{
    fontSize: 10.5, color: t.text3, padding: '2px 6px', borderRadius: 5,
    background: t.surface, border: `0.5px solid ${t.border}`,
    fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', fontWeight: 500,
    lineHeight: 1,
  }}>{children}</span>;
};

const ModeTabs = ({ mode, setMode }) => {
  const t = useT();
  const tabs = [
    { id: 'chat',   icon: 'chat',   label: 'Chat' },
    { id: 'cowork', icon: 'cowork', label: 'Cowork' },
    { id: 'code',   icon: 'code',   label: 'Code' },
  ];
  return (
    <div style={{
      display: 'flex', gap: 2, padding: 3, borderRadius: 9,
      background: t.surface, border: `0.5px solid ${t.border}`,
    }}>
      {tabs.map(x => {
        const active = mode === x.id;
        return (
          <button key={x.id} onClick={() => setMode(x.id)} style={{
            flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
            padding: '5px 8px', borderRadius: 7, border: 'none', cursor: 'pointer',
            background: active ? (x.id === 'code' ? t.windowBg : t.surfaceActive) : 'transparent',
            color: active ? t.text : t.text3,
            fontSize: 12, fontWeight: active ? 600 : 500, fontFamily: 'inherit',
            boxShadow: active ? '0 1px 2px rgba(0,0,0,0.04), 0 0 0 0.5px ' + t.border : 'none',
            transition: 'all 0.12s',
          }}>
            <Icon name={x.icon} size={12.5} stroke={1.9} />
            {x.label}
          </button>
        );
      })}
    </div>
  );
};

  const t = useT();
  const [moreOpen, setMoreOpen] = useState(false);
  const [accountOpen, setAccountOpen] = useState(false);
  const [hoverProject, setHoverProject] = useState(null);
  const [menuProject, setMenuProject] = useState(null);
  const [menuPos, setMenuPos] = useState(null);

  // Position the project context menu — flip above when there isn't room below.
  React.useLayoutEffect(() => {
    if (!menuProject) { setMenuPos(null); return; }
    const trigger = document.querySelector(`[data-project-row="${menuProject}"]`);
    if (!trigger) return;
    const rect = trigger.getBoundingClientRect();
    const MENU_H = 268;
    const spaceBelow = window.innerHeight - rect.bottom;
    const flipUp = spaceBelow < MENU_H + 12;
    setMenuPos({
      left: rect.left + 16,
      top: flipUp ? Math.max(8, rect.top - MENU_H - 4) : rect.bottom + 2,
    });
  }, [menuProject]);
  // expand state per project — default: open the project that owns the active session, plus a couple by default
  const [expanded, setExpanded] = useState({ mlplatform: true, agai: true, visionx: true, 'lingxi-next': true, lingxi: true, telegram: true });
  const [showMore, setShowMore] = useState({}); // per-project show-hidden flag
  const toggle = (id) => setExpanded(o => ({ ...o, [id]: !o[id] }));

  if (collapsed) {
    return (
      <div style={{
        width: 52, flexShrink: 0, background: t.sidebarBg,
        borderRight: `0.5px solid ${t.border}`, paddingTop: 40,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
      }}>
        <button onClick={() => setCollapsed(false)} title="展开" style={iconBtn(t)}>
          <Icon name="sidebar" size={15} color={t.text2} stroke={1.7} />
        </button>
        <button title="搜索" style={iconBtn(t)}><Icon name="search" size={15} color={t.text2} stroke={1.7} /></button>
        <div style={{ height: 1, width: 28, background: t.border, margin: '6px 0' }} />
        <button title="新建会话" style={iconBtn(t)}><Icon name="plus" size={15} color={t.text2} stroke={1.7} /></button>
        <button title="Routines" style={iconBtn(t)}><Icon name="bolt" size={15} color={t.text2} stroke={1.7} /></button>
        <button title="Customize" style={iconBtn(t)}><Icon name="box" size={15} color={t.text2} stroke={1.7} /></button>
        <div style={{ flex: 1 }} />
        <button onClick={openSettings} title="设置" style={iconBtn(t)}><Icon name="cog" size={15} color={t.text2} stroke={1.7} /></button>
        <div style={{
          width: 28, height: 28, borderRadius: 7, marginBottom: 10,
          background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`,
          color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 11, fontWeight: 600,
        }}>LL</div>
      </div>
    );
  }

  return (
    <div style={{
      width: 260, flexShrink: 0, background: t.sidebarBg,
      borderRight: `0.5px solid ${t.border}`,
      display: 'flex', flexDirection: 'column', paddingTop: 38,
    }}>
      {/* Top icon row */}
      <div style={{ padding: '4px 10px 6px', display: 'flex', alignItems: 'center', gap: 2 }}>
        <button onClick={() => setCollapsed(true)} title="收起边栏" style={iconBtn(t)}
          onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <Icon name="sidebar" size={15} color={t.text2} stroke={1.7} />
        </button>
        <button title="搜索 ⌘K" style={iconBtn(t)}
          onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <Icon name="search" size={15} color={t.text2} stroke={1.7} />
        </button>
        <div style={{ flex: 1 }} />
      </div>

      {/* Mode tabs — full width below icons */}
      <div style={{ padding: '0 10px 10px' }}>
        <ModeTabs mode={mode} setMode={setMode} />
      </div>

      {/* Primary actions */}
      <div style={{ padding: '0 10px 6px' }}>
        {[
          { icon: 'plus',    label: '新建会话',  kbd: '⌘ N',  bold: true },
          { icon: 'bolt',    label: 'Routines',  desc: '自动化工作流' },
          { icon: 'box',     label: 'Customize', desc: '指令与角色' },
        ].map(item => (
          <button key={item.label} style={{
            display: 'flex', alignItems: 'center', gap: 10, width: '100%',
            padding: '8px 10px', borderRadius: 8, border: 'none', cursor: 'pointer',
            background: 'transparent', color: t.text,
            fontSize: 13, fontWeight: item.bold ? 600 : 500,
            fontFamily: 'inherit', textAlign: 'left',
            transition: 'background 0.12s',
          }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
             onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <Icon name={item.icon} size={item.icon === 'bolt' ? 14 : 15} color={item.bold ? t.text : t.text2} stroke={1.8} />
            <span style={{ flex: 1 }}>{item.label}</span>
            {item.kbd && <Kbd>{item.kbd}</Kbd>}
          </button>
        ))}
        <button onClick={() => setMoreOpen(!moreOpen)} style={{
          display: 'flex', alignItems: 'center', gap: 10, width: '100%',
          padding: '8px 10px', borderRadius: 8, border: 'none', cursor: 'pointer',
          background: 'transparent', color: t.text2,
          fontSize: 13, fontWeight: 500, fontFamily: 'inherit', textAlign: 'left',
        }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
           onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <Icon name="chevron" size={14} stroke={2} color={t.text2} style={{ transform: moreOpen ? 'rotate(180deg)' : '' }} />
          <span style={{ flex: 1 }}>More</span>
        </button>
        {moreOpen && (
          <div style={{ paddingLeft: 26, paddingBottom: 4, animation: 'fade-in 0.15s ease' }}>
            {['Routines · 历史', '快捷指令', '导入 / 导出', '帮助'].map(label => (
              <div key={label} style={{
                padding: '6px 10px', borderRadius: 6, fontSize: 12.5, color: t.text3, cursor: 'pointer',
              }} onMouseEnter={e => { e.currentTarget.style.background = t.surfaceHover; e.currentTarget.style.color = t.text2; }}
                 onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = t.text3; }}>{label}</div>
            ))}
          </div>
        )}
      </div>

      {/* Projects header */}
      <div style={{
        padding: '14px 8px 4px 14px', display: 'flex', alignItems: 'center', gap: 4,
      }}>
        <span style={{
          flex: 1, fontSize: 12.5, color: t.text2, fontWeight: 600,
          display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer',
        }}>Projects <Icon name="chevron" size={11} color={t.text3} stroke={2} /></span>
        <button title="全部折叠" onClick={() => setExpanded({})} style={{ ...iconBtn(t), width: 22, height: 22 }}
          onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={t.text3} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <path d="M4 4l6 6M20 4l-6 6M4 20l6-6M20 20l-6-6"/>
          </svg>
        </button>
        <button title="更多" style={{ ...iconBtn(t), width: 22, height: 22 }}
          onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <Icon name="more" size={13} color={t.text3} stroke={2} />
        </button>
        <button title="新建项目" style={{ ...iconBtn(t), width: 22, height: 22 }}
          onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={t.text3} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <path d="M12 12v4M10 14h4"/>
          </svg>
        </button>
      </div>

      {/* Project tree */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '2px 8px 8px' }}>
        {PROJECTS.map(p => {
          const open = !!expanded[p.id];
          const visibleSessions = open
            ? (showMore[p.id] ? p.sessions : p.sessions.filter(s => !s.hidden))
            : [];
          const hiddenCount = p.sessions.filter(s => s.hidden).length;
          const projectActive = p.id === activeRepo;
          return (
            <div key={p.id} style={{ marginBottom: 2, position: 'relative' }}>
              {/* Project header */}
              <div data-project-row={p.id}
                   onClick={() => { toggle(p.id); setActiveRepo(p.id); }}
                   onMouseEnter={() => setHoverProject(p.id)}
                   onMouseLeave={() => setHoverProject(null)}
                   style={{
                display: 'flex', alignItems: 'center', gap: 8,
                height: 30, padding: '0 6px 0 8px', borderRadius: 7, cursor: 'pointer',
                color: t.text2,
                background: (hoverProject === p.id || menuProject === p.id) ? t.surfaceHover : 'transparent',
                transition: 'background 0.12s',
              }}>
                <Icon name="folder" size={14} color={t.text3} stroke={1.7} />
                <span style={{
                  flex: 1, fontSize: 13, fontWeight: 500, color: t.text,
                  overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                }}>{p.name}</span>

                {(hoverProject === p.id || menuProject === p.id) ? (
                  <div style={{ display: 'flex', gap: 1, alignItems: 'center' }}>
                    <button onClick={(e) => { e.stopPropagation(); setMenuProject(menuProject === p.id ? null : p.id); }} title="更多" style={{
                      width: 20, height: 20, borderRadius: 5, border: 'none', cursor: 'pointer',
                      background: menuProject === p.id ? t.surfaceActive : 'transparent',
                      color: t.text2, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }} onMouseEnter={e => { if (menuProject !== p.id) e.currentTarget.style.background = t.surfaceActive; }}
                       onMouseLeave={e => { if (menuProject !== p.id) e.currentTarget.style.background = 'transparent'; }}>
                      <Icon name="more" size={13} stroke={2} />
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); }} title="新会话" style={{
                      width: 20, height: 20, borderRadius: 5, border: 'none', cursor: 'pointer',
                      background: 'transparent', color: t.text2,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceActive}
                       onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                      <Icon name="pencil" size={12} stroke={1.8} />
                    </button>
                  </div>
                ) : p.dirty ? (
                  <span style={{
                    width: 6, height: 6, borderRadius: 99,
                    background: t.warn, flexShrink: 0,
                    boxShadow: `0 0 0 2px color-mix(in oklab, ${t.warn} 25%, transparent)`,
                  }} />
                ) : null}
              </div>

              {/* Context menu */}
              {menuProject === p.id && menuPos && (
                <>
                  <div onClick={() => setMenuProject(null)} style={{ position: 'fixed', inset: 0, zIndex: 49 }} />
                  <div style={{
                    position: 'fixed', left: menuPos.left, top: menuPos.top, zIndex: 50,
                    background: t.surface, border: `0.5px solid ${t.borderStrong}`,
                    borderRadius: 11, padding: 6, minWidth: 230,
                    boxShadow: '0 16px 40px rgba(0,0,0,0.28)',
                    animation: 'fade-in 0.12s ease',
                  }}>
                    {[
                      { icon: 'pin',     label: 'Pin project' },
                      { icon: 'finder',  label: 'Open in Finder' },
                      { icon: 'tree',    label: 'Create permanent worktree' },
                      { icon: 'rename',  label: 'Rename project' },
                      { icon: 'archive', label: 'Archive chats' },
                      { divider: true },
                      { icon: 'x',       label: 'Remove', danger: true },
                    ].map((mi, i) => mi.divider ? (
                      <div key={i} style={{ height: 0.5, background: t.border, margin: '4px 6px' }} />
                    ) : (
                      <div key={mi.label} onClick={() => setMenuProject(null)} style={{
                        display: 'flex', alignItems: 'center', gap: 10,
                        padding: '6px 10px', borderRadius: 6, cursor: 'pointer',
                        color: mi.danger ? t.danger : t.text,
                      }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
                         onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                        <ProjectMenuIcon name={mi.icon} color={mi.danger ? t.danger : t.text2} />
                        <span style={{ fontSize: 13, fontWeight: 500 }}>{mi.label}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {/* Sessions */}
              {open && (
                <div style={{ paddingLeft: 6, paddingBottom: 4, animation: 'fade-in 0.15s ease' }}>
                  {p.sessions.length === 0 ? (
                    <div style={{
                      padding: '6px 10px 6px 30px', fontSize: 12.5, color: t.text4,
                    }}>No chats</div>
                  ) : (
                    <>
                      {visibleSessions.map(s => {
                        const active = s.id === activeSession;
                        return (
                          <div key={s.id} onClick={() => { setActiveSession(s.id); setActiveRepo(p.id); }} style={{
                            display: 'flex', alignItems: 'center', gap: 6,
                            padding: '5px 10px 5px 30px', borderRadius: 6, cursor: 'pointer',
                            background: active ? t.surfaceActive : 'transparent',
                            color: active ? t.text : t.text2,
                            transition: 'background 0.12s', position: 'relative',
                          }} onMouseEnter={e => { if (!active) e.currentTarget.style.background = t.surfaceHover; }}
                             onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}>
                            {active && <div style={{ position: 'absolute', left: 20, top: 6, bottom: 6, width: 2, background: t.accent, borderRadius: 99 }} />}
                            <span style={{
                              flex: 1, fontSize: 12.5, fontWeight: active ? 600 : 500,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{s.title}</span>
                            {s.kbd && <Kbd>{s.kbd}</Kbd>}
                            {s.activity && <span style={{ fontSize: 11, color: t.text4, fontFamily: 'inherit' }}>{s.activity}</span>}
                          </div>
                        );
                      })}
                      {hiddenCount > 0 && (
                        <div onClick={() => setShowMore(o => ({ ...o, [p.id]: !o[p.id] }))} style={{
                          padding: '4px 10px 6px 30px', fontSize: 11.5, color: t.text3, cursor: 'pointer',
                        }} onMouseEnter={e => e.currentTarget.style.color = t.text2}
                           onMouseLeave={e => e.currentTarget.style.color = t.text3}>
                          {showMore[p.id] ? 'Show less' : 'Show more'}
                        </div>
                      )}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Account row */}
      <div style={{ borderTop: `0.5px solid ${t.border}`, padding: '8px 10px 12px', position: 'relative' }}>
        <div onClick={() => setAccountOpen(!accountOpen)} style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '6px 8px', borderRadius: 8, cursor: 'pointer',
          background: accountOpen ? t.surfaceHover : 'transparent',
          transition: 'background 0.12s',
        }} onMouseEnter={e => { if (!accountOpen) e.currentTarget.style.background = t.surfaceHover; }}
           onMouseLeave={e => { if (!accountOpen) e.currentTarget.style.background = 'transparent'; }}>
          <div style={{
            width: 28, height: 28, borderRadius: 7,
            background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`,
            color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 11, fontWeight: 600,
          }}>LL</div>
          <div style={{ flex: 1, minWidth: 0, display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: t.text }}>lingfeng</span>
            <span style={{ color: t.text4 }}>·</span>
            <span style={{ fontSize: 12, color: t.text3 }}>Max</span>
          </div>
          <Icon name="chevron" size={13} color={t.text3} stroke={2} style={{ transform: accountOpen ? '' : 'rotate(180deg)' }} />
        </div>

        {accountOpen && (
          <>
            <div onClick={() => setAccountOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 49 }} />
            <div style={{
              position: 'absolute', bottom: 'calc(100% - 4px)', left: 10, right: 10, zIndex: 50,
              background: t.surface, border: `0.5px solid ${t.borderStrong}`,
              borderRadius: 12, padding: 6,
              boxShadow: '0 16px 40px rgba(0,0,0,0.32)',
              animation: 'fade-in 0.15s ease',
            }}>
              <div style={{ padding: '8px 10px 10px', fontSize: 12.5, color: t.text3 }}>
                luolingfeng.flare@gmail.com
              </div>
              <AccountMenuItem icon="cog"     label="Settings"  kbd="⌘," onClick={() => { setAccountOpen(false); openSettings(); }} />
              <AccountMenuItem icon="globe"   label="Language"  arrow />
              <AccountMenuItem icon="help"    label="Get help" />
              <div style={{ height: 0.5, background: t.border, margin: '6px 6px' }} />
              <AccountMenuItem icon="plans"   label="View all plans" />
              <AccountMenuItem icon="download" label="Get apps and extensions" />
              <AccountMenuItem icon="gift"    label="Gift Lingxi" />
              <AccountMenuItem icon="news"    label="View changelog" />
              <AccountMenuItem icon="info"    label="Learn more" arrow />
              <div style={{ height: 0.5, background: t.border, margin: '6px 6px' }} />
              <AccountMenuItem icon="logout"  label="Log out" />
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const iconBtn = (t) => ({
  width: 30, height: 30, borderRadius: 7, border: 'none', cursor: 'pointer',
  background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center',
  transition: 'background 0.12s',
});

// ─── PROJECT CONTEXT MENU ICONS ────────────────────────
const ProjectMenuIcon = ({ name, color }) => {
  const p = { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'pin':     return <svg {...p}><path d="m9 4 9 9-2 2-1-1-3 3v4l-2-2-2 2v-4l3-3-1-1z"/></svg>;
    case 'finder':  return <svg {...p}><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M14 13l3-3M17 13l-3-3"/></svg>;
    case 'tree':    return <svg {...p}><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8M12 13v3"/></svg>;
    case 'rename':  return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>;
    case 'archive': return <svg {...p}><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>;
    case 'x':       return <svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    default: return null;
  }
};

// ─── ACCOUNT MENU ITEM ────────────────────────────
const AccountIcon = ({ name, color, size = 16 }) => {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'cog':      return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
    case 'globe':    return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>;
    case 'help':     return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.6" fill={color} stroke="none"/></svg>;
    case 'plans':    return <svg {...p}><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
    case 'download': return <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>;
    case 'gift':     return <svg {...p}><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>;
    case 'news':     return <svg {...p}><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18M7 13h4M7 17h10"/></svg>;
    case 'info':     return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>;
    case 'logout':   return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>;
    default: return null;
  }
};

function AccountMenuItem({ icon, label, kbd, arrow, onClick }) {
  const t = useT();
  return (
    <div onClick={onClick} style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '7px 10px', borderRadius: 7, cursor: 'pointer',
    }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
       onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
      <AccountIcon name={icon} color={t.text2} size={15} />

// ─── AUDIO MESSAGE (user voice message bubble with static waveform) ─
function AudioMessage({ bars, duration }) {
  const t = useT();
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0); // 0..1
  const rafRef = useRef(null);
  const startRef = useRef(0);

  useEffect(() => {
    if (!playing) return;
    startRef.current = performance.now() - progress * duration * 1000;
    const tick = () => {
      const elapsed = (performance.now() - startRef.current) / 1000;
      const p = Math.min(1, elapsed / duration);
      setProgress(p);
      if (p >= 1) { setPlaying(false); setProgress(0); return; }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [playing, duration]);

  const fmt = (s) => {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  };

  // Downsample bars to a tidy fixed count for display
  const N = 56;
  const display = useMemo(() => {
    if (!bars || bars.length === 0) return new Array(N).fill(0);
    const out = new Array(N).fill(0);
    const step = bars.length / N;
    for (let i = 0; i < N; i++) {
      const lo = Math.floor(i * step);
      const hi = Math.max(lo + 1, Math.floor((i + 1) * step));
      let max = 0;
      for (let j = lo; j < hi && j < bars.length; j++) max = Math.max(max, bars[j]);
      out[i] = max;
    }
    return out;
  }, [bars]);

  const W = 220, H = 28;
  const slot = W / N;
  const barW = 1.8;
  const played = Math.floor(progress * N);

  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 12,
      padding: '8px 12px 8px 8px', borderRadius: 18,
      background: t.accentBg,
      border: `0.5px solid ${t.accentBorder}`,
      maxWidth: 360,
    }}>
      <button onClick={() => setPlaying(p => !p)} style={{
        width: 30, height: 30, borderRadius: 99, border: 'none', cursor: 'pointer',
        background: t.accent, color: '#fff',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexShrink: 0,
      }} onMouseEnter={e => e.currentTarget.style.filter = 'brightness(1.08)'}
         onMouseLeave={e => e.currentTarget.style.filter = 'none'}>
        {playing ? (
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        ) : (
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg>
        )}
      </button>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', flexShrink: 0 }}>
        {/* dotted baseline */}
        {Array.from({ length: Math.floor(W / 5) }).map((_, i) => (
          <rect key={`d${i}`} x={i * 5} y={H / 2 - 0.5} width={1.5} height={1} fill={t.text4} opacity={0.55} />
        ))}
        {/* bars */}
        {display.map((v, i) => {
          if (v <= 0.003) return null;
          const h = Math.max(2, Math.min(H * 0.92, v * H * 3.6));
          const x = i * slot + (slot - barW) / 2;
          const active = i < played;
          return (
            <rect key={i} x={x} y={H / 2 - h / 2} width={barW} height={h}
              rx={0.6}
              fill={active ? t.accent2 || t.accent : t.text}
              opacity={active ? 1 : 0.85} />
          );
        })}
      </svg>
      <span className="mono" style={{
        fontSize: 12, color: t.text2, fontVariantNumeric: 'tabular-nums',
        minWidth: 30, textAlign: 'right',
      }}>{fmt(duration)}</span>
    </div>
  );
}

// ─── COMPOSER (slash command input + diff bar + controls) ────
function Composer({ repo, model, setModel, panelOpen, setPanelOpen, appendMessage, openFlow }) {
  const t = useT();
  const [text, setText] = useState('');
  const [slashOpen, setSlashOpen] = useState(false);
  const [modelOpen, setModelOpen] = useState(false);
  const [contextOpen, setContextOpen] = useState(false);
  const [permMode, setPermMode] = useState('bypass');
  const [permOpen, setPermOpen] = useState(false);
  const [effort, setEffort] = useState('max');
  const [fastMode, setFastMode] = useState(true);
  const taRef = useRef(null);

  // ─── Audio recording ─────────────────────────────────────
  const [recording, setRecording] = useState(false);
  const [recSecs, setRecSecs] = useState(0);
  const [micDenied, setMicDenied] = useState(false);
  const waveCanvasRef = useRef(null);
  const audioCtxRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const barsRef = useRef([]);
  const NUM_BARS = 90;

  useEffect(() => {
    if (!recording) return;
    barsRef.current = new Array(NUM_BARS).fill(0);
    const startTime = performance.now();
    let cancelled = false;

    (async () => {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        if (!cancelled) { setMicDenied(true); setRecording(false); }
        return;
      }
      if (cancelled) { stream.getTracks().forEach(tr => tr.stop()); return; }
      streamRef.current = stream;
      const AC = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AC();
      audioCtxRef.current = audioCtx;
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.4;
      source.connect(analyser);
      const buffer = new Uint8Array(analyser.fftSize);

      const drawWaveform = () => {
        const canvas = waveCanvasRef.current;
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        if (canvas.width !== Math.round(rect.width * dpr) ||
            canvas.height !== Math.round(rect.height * dpr)) {
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
        }
        const ctx2d = canvas.getContext('2d');
        ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx2d.clearRect(0, 0, rect.width, rect.height);

        const cy = rect.height / 2;
        const dotColor = t.text4;
        const barColor = t.text;

        // dotted baseline
        ctx2d.fillStyle = dotColor;
        for (let x = 0; x < rect.width; x += 5) {
          ctx2d.fillRect(x, cy - 0.5, 1.5, 1);
        }

        // scrolling bars (right-anchored)
        const bars = barsRef.current;
        const barW = 1.8;
        const gap = 2.4;
        const slot = barW + gap;
        const maxBarsThatFit = Math.floor(rect.width / slot);
        const visible = Math.min(bars.length, maxBarsThatFit);
        ctx2d.fillStyle = barColor;
        for (let i = bars.length - visible; i < bars.length; i++) {
          const v = bars[i];
          if (v <= 0.002) continue; // gap in baseline where silence
          const h = Math.max(1.5, Math.min(rect.height * 0.92, v * rect.height * 3.6));
          const x = rect.width - (bars.length - i) * slot;
          ctx2d.fillRect(x, cy - h / 2, barW, h);
        }
      };

      const tick = () => {
        if (cancelled) return;
        analyser.getByteTimeDomainData(buffer);
        let sum = 0;
        for (let i = 0; i < buffer.length; i++) {
          const v = (buffer[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / buffer.length);
        barsRef.current.shift();
        barsRef.current.push(rms);
        drawWaveform();
        const elapsed = Math.floor((performance.now() - startTime) / 1000);
        setRecSecs(elapsed);
        rafRef.current = requestAnimationFrame(tick);
      };
      rafRef.current = requestAnimationFrame(tick);
    })();

    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(tr => tr.stop());
        streamRef.current = null;
      }
      if (audioCtxRef.current) {
        try { audioCtxRef.current.close(); } catch (e) {}
        audioCtxRef.current = null;
      }
      setRecSecs(0);
    };
  }, [recording, t.text, t.text4]);

  const fmtTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  };

  useEffect(() => {
    if (text.startsWith('/')) setSlashOpen(true);
    else setSlashOpen(false);
  }, [text]);

  const filtered = SLASH_COMMANDS.filter(c => c.cmd.startsWith(text || '/'));

  return (
    <div style={{
      padding: '0 32px 16px', flexShrink: 0,
      background: t.stageBg, borderTop: `0.5px solid ${t.border}`,
    }}>
      <div style={{ maxWidth: 920, margin: '0 auto' }}>
        {/* Diff/commit bar */}
        {repo.diff && (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '10px 4px 12px',
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 8,
              padding: '6px 12px', borderRadius: 8,
              background: t.surface, border: `0.5px solid ${t.border}`,
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: 99, background: t.warn,
              }} />
              <span style={{ fontSize: 12.5, color: t.text, fontWeight: 500 }}>{repo.name}</span>
              <span className="mono" style={{ fontSize: 12, color: t.text3 }}>{repo.branch}</span>
            </div>
            <div style={{ flex: 1 }} />
            <div className="mono" style={{
              display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 600,
            }}>
              <span style={{ color: t.add }}>+{repo.diff.add}</span>
              <span style={{ color: t.text4 }}>−{repo.diff.del}</span>
            </div>
            <button style={{
              padding: '7px 14px', borderRadius: 8,
              background: 'transparent', color: t.text3,
              border: `0.5px solid ${t.border}`, cursor: 'not-allowed',
              fontSize: 12.5, fontWeight: 600, fontFamily: 'inherit',
            }}>Commit changes</button>
          </div>
        )}

        {/* Slash menu */}
        {slashOpen && filtered.length > 0 && (
          <div style={{
            background: t.surface, border: `0.5px solid ${t.borderStrong}`,
            borderRadius: 10, padding: 4, marginBottom: 6,
            boxShadow: '0 12px 32px rgba(0,0,0,0.25)',
            animation: 'fade-in 0.15s ease', maxHeight: 280, overflowY: 'auto',
          }}>
            {filtered.map(c => (
              <div key={c.cmd} onMouseDown={(e) => { e.preventDefault(); setText(c.cmd + ' '); setSlashOpen(false); taRef.current?.focus(); }} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '8px 10px', borderRadius: 7, cursor: 'pointer',
              }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
                 onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <span className="mono" style={{
                  fontSize: 12.5, color: t.accent, fontWeight: 600,
                  background: t.accentBg, padding: '2px 7px', borderRadius: 5,
                  border: `0.5px solid ${t.accentBorder}`,
                  minWidth: 80,
                }}>{c.cmd}</span>
                <span style={{ flex: 1, fontSize: 12.5, color: t.text2 }}>{c.desc}</span>
                {c.hint && <span style={{ fontSize: 10.5, color: t.text4 }}>{c.hint}</span>}
                {c.sub && <span style={{ fontSize: 10.5, color: t.text4 }}>{c.sub}</span>}
              </div>
            ))}
          </div>
        )}

        {/* Composer */}
        <div style={{
          background: t.surface, border: `0.5px solid ${t.borderStrong}`,
          borderRadius: 12, padding: '10px 12px 8px',
        }}>
          <textarea ref={taRef} value={text} onChange={e => {
            setText(e.target.value);
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 220) + 'px';
          }} placeholder={recording ? 'Ask for follow-up changes' : 'Type / for commands'}
            disabled={recording}
            rows={1}
            style={{
              width: '100%', border: 'none', outline: 'none', resize: 'none',
              background: 'transparent', color: t.text, fontSize: 14.5,
              lineHeight: 1.55, fontFamily: 'inherit',
              minHeight: 22, maxHeight: 220,
              opacity: recording ? 0.55 : 1,
            }} />
          {recording ? (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 8, marginTop: 6,
            }}>
              <button title="附加上下文" style={iconBtn(t)}
                onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <Icon name="plus" size={14} color={t.text3} stroke={2} />
              </button>
              <canvas ref={waveCanvasRef} style={{
                flex: 1, height: 28, minWidth: 0, display: 'block',
              }} />
              <span className="mono" style={{
                fontSize: 12.5, color: t.text2, fontVariantNumeric: 'tabular-nums',
                minWidth: 30, textAlign: 'right',
              }}>{fmtTime(recSecs)}</span>
              <button title="停止录音" onClick={() => setRecording(false)} style={{
                width: 28, height: 28, borderRadius: 99, border: 'none', cursor: 'pointer',
                background: t.surfaceActive, color: t.text2,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }} onMouseEnter={e => e.currentTarget.style.filter = 'brightness(0.95)'}
                 onMouseLeave={e => e.currentTarget.style.filter = 'none'}>
                <span style={{ width: 9, height: 9, borderRadius: 1.5, background: t.text }} />
              </button>
              <button title="发送" onClick={() => {
                const bars = (barsRef.current || []).slice();
                const duration = Math.max(1, recSecs);
                if (appendMessage) appendMessage({ type: 'audio', bars, duration });
                setRecording(false);
              }} style={{
                width: 28, height: 28, borderRadius: 99, border: 'none', cursor: 'pointer',
                background: t.text, color: t.windowBg,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }} onMouseEnter={e => e.currentTarget.style.filter = 'brightness(1.1)'}
                 onMouseLeave={e => e.currentTarget.style.filter = 'none'}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={t.windowBg} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 6, position: 'relative' }}>
            {/* Permission mode picker */}
            <PermissionPicker mode={permMode} setMode={setPermMode} open={permOpen} setOpen={setPermOpen} />
            <button title="附加上下文" style={iconBtn(t)}
              onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <Icon name="plus" size={14} color={t.text3} stroke={2} />
            </button>
            <button title={micDenied ? '麦克风权限被拒' : '语音'} onClick={() => { setMicDenied(false); setRecording(true); }} style={iconBtn(t)}
              onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <Icon name="mic" size={13} color={micDenied ? t.danger : t.text3} stroke={1.8} />
            </button>
            <button title="语音选项" style={{ ...iconBtn(t), width: 18 }}
              onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <Icon name="chevron" size={11} color={t.text3} stroke={2} />
            </button>
            <button title="心流模式 · 实时语音对话" onClick={openFlow} style={iconBtn(t)}
              onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <Icon name="flow" size={14} color={t.text3} stroke={1.6} />
            </button>

            <div style={{ flex: 1 }} />

            {/* Stop / run pill */}
            <button title="停止" style={{
              ...iconBtn(t), width: 28, height: 28,
              background: t.surfaceHover, color: t.text2,
            }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: t.text2 }} />
            </button>
          </div>
          )}
        </div>

        {/* Footer status row */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '8px 4px 0', fontSize: 11.5, color: t.text4,
        }}>
          <span style={{ flex: 1 }} />
          <ModelPicker model={model} setModel={setModel} open={modelOpen} setOpen={setModelOpen}
            effort={effort} setEffort={setEffort} fastMode={fastMode} setFastMode={setFastMode} />
          <ContextPicker open={contextOpen} setOpen={setContextOpen}
            model={model} effort={effort} fastMode={fastMode} />
        </div>
      </div>
    </div>
  );
}

         onMouseLeave={e => { if (!open) e.currentTarget.style.background = 'transparent'; }}>

              display: 'flex', alignItems: 'center', gap: 6,

                {current.label}
                {mode === PERM_DEFAULT && <span style={{ color: t.text4, fontWeight: 500 }}> · Default</span>}

                }} onMouseEnter={e => e.currentTarget.style.background = t.surfaceHover}
                   onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <span style={{ flex: 1, fontSize: 13.5, color: t.text, fontWeight: 500 }}>{m.label}</span>
                  {active && <Icon name="check" size={13} color={t.text2} stroke={2.2} />}
                  <span style={{ fontSize: 11.5, color: t.text4, fontFamily: 'inherit', minWidth: 10, textAlign: 'right' }}>{i + 1}</span>
                </div>

            })}

        </>
      )}
    </div>
  );
}

        { t: 'add', n: 4, text: '' },

        { t: 'add', n: 6, text: 'pub struct AgentId(pub u64);' },
        { t: 'add', n: 7, text: '' },

        { t: 'add', n: 12, text: '    pub fn new() -> Self { Self(0) }' },

      lines.push(
        { t: 'ctx', n: 1, text: '# ' + f.path },

                const bg = l.t === 'add' ? `color-mix(in oklab, ${t.add} 8%, transparent)` :
                           l.t === 'del' ? `color-mix(in oklab, ${t.del} 10%, transparent)` :
                           'transparent';
                const sigil = l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' ';

      {tab === 'plan' && (
        <div style={{ flex: 1, overflowY: 'auto', padding: 16 }}>
          <div style={{ fontSize: 11, color: t.text4, fontWeight: 600, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 10 }}>Implementation plan</div>

            <div><span style={{ color: t.accent }}>~/lingxi-next</span> <span style={{ color: t.text4 }}>on</span> <span style={{ color: t.warn }}>main *</span></div>
            <div><span style={{ color: t.add }}>$</span> <span style={{ color: t.text }}>cargo check --workspace</span></div>

function CodePreview({ theme }) {
  const c = theme === 'dark' ? {
    bg: '#15131a', text: '#dfd9eb', mute: '#7a7286',
    kw: '#c084e8', fn: '#7dd3a3', str: '#e8a872', name: '#8db8e8',
    addBg: '#0e2818', delBg: '#2a1418', addText: '#a5e8b8', delText: '#e8a5a5',
  } : {
    bg: '#fbf9f5', text: '#2c2a32', mute: '#8a8294',
    kw: '#7a3fb8', fn: '#1f7a4d', str: '#a85a1e', name: '#3460a8',
    addBg: '#e1f5e7', delBg: '#fde2e2', addText: '#1a6a36', delText: '#9a2828',
  };
  const lines = [
    { n: 1, t: 'ctx', text: <><span style={{ color: c.kw }}>function</span> <span style={{ color: c.fn }}>greet</span>(<span style={{ color: c.name }}>name</span>: <span style={{ color: c.kw }}>string</span>) {'{'}</> },
    { n: 2, t: 'del', text: <>{'  '}<span style={{ color: c.kw }}>return</span> <span style={{ color: c.str }}>"Hello, "</span> + <span style={{ color: c.name }}>name</span>;</> },
    { n: 2, t: 'add', text: <>{'  '}<span style={{ color: c.kw }}>return</span> <span style={{ color: c.str }}>{'`Hello, ${name}!`'}</span>;</> },
    { n: 3, t: 'ctx', text: '}' },
  ];
  return (
    <div className="mono" style={{
      background: c.bg, color: c.text,
      borderRadius: 10, overflow: 'hidden',
      fontSize: 12.5, lineHeight: 1.75, flex: 1, minWidth: 0,
      border: theme === 'light' ? '0.5px solid rgba(0,0,0,0.08)' : 'none',
    }}>
      {lines.map((l, i) => {
        const bg = l.t === 'add' ? c.addBg : l.t === 'del' ? c.delBg : 'transparent';
        const sigil = l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' ';
        const sigilColor = l.t === 'add' ? c.addText : l.t === 'del' ? c.delText : c.mute;
        return (
          <div key={i} style={{ display: 'flex', background: bg }}>
            <span style={{ width: 38, textAlign: 'right', color: c.mute, padding: '0 10px', flexShrink: 0 }}>{l.n}</span>
            <span style={{ width: 16, color: sigilColor, flexShrink: 0, fontWeight: 600 }}>{sigil}</span>
            <span style={{ paddingRight: 14, whiteSpace: 'pre' }}>{l.text}</span>
          </div>
        );
      })}
    </div>
  );
}

// ─── ORB CANVAS (living-orb renderer, shared with mobile 心流) ─
function OrbCanvas({ phaseRef, active = true, cyFrac = 0.42 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!active) return;
    const cv = canvasRef.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    const TAU = Math.PI * 2;
    let raf, last = performance.now(), tm = 0, amp = 0.12, hueShift = 0, baseScale = 1, breathT = 0;
    const parts = Array.from({ length: 76 }, () => ({
      a: Math.random() * TAU,
      rad: 0.55 + Math.random() * 1.5,
      sp: (0.1 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
      sz: 0.6 + Math.random() * 1.8,
      tw: Math.random() * TAU,
    }));
    // ── sci-fi layers ──
    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random(), y: Math.random(),
      z: 0.25 + Math.random() * 0.75,
      tw: Math.random() * TAU,
    }));
    const fit = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const r = cv.getBoundingClientRect();
      cv.width = r.width * dpr; cv.height = r.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: r.width, h: r.height };
    };
    let dim = fit();
    const onResize = () => { dim = fit(); };
    window.addEventListener('resize', onResize);

    const blob = (cx, cy, base, wob, seed, harm) => {
      const steps = 132;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * TAU;
        let r = base
          + Math.sin(a * 3 + tm * 1.3 + seed) * wob * 0.5
          + Math.sin(a * 5 - tm * 1.9 + seed * 1.7) * wob * 0.32
          + Math.sin(a * 2 + tm * 0.9 + seed * 0.4) * wob * 0.42
          + Math.sin(a * 7 + tm * 2.4) * wob * 0.16 * harm;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
    };

    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; tm += dt;
      const p = (phaseRef && phaseRef.current) || 'idle';
      const W = dim.w, H = dim.h, cx = W / 2, cy = H * cyFrac;
      const baseR = Math.min(W, H) * 0.165;

      // ease toward a sustained per-phase size; energy lives in the wobble
      let baseTarget, breathDepth, breathSpeed, wobTarget;
      if (p === 'idle') {
        baseTarget = 1.0;  breathDepth = 0.03;  breathSpeed = 0.9; wobTarget = 0.10;
      } else if (p === 'listening') {
        baseTarget = 1.07; breathDepth = 0.04;  breathSpeed = 1.5; wobTarget = 0.16;
      } else if (p === 'thinking') {
        baseTarget = 1.04; breathDepth = 0.03;  breathSpeed = 1.2; wobTarget = 0.13; hueShift += dt * 40;
      } else { // speaking
        baseTarget = 1.26; breathDepth = 0.035; breathSpeed = 1.8; wobTarget = 0.22;
      }
      baseScale += (baseTarget - baseScale) * Math.min(1, dt * 4.0);
      breathT += dt * breathSpeed;
      const scale = baseScale + Math.sin(breathT) * breathDepth;
      const R = baseR * scale;
      amp += (wobTarget - amp) * Math.min(1, dt * 3);
      const A = Math.max(0, amp);

      ctx.clearRect(0, 0, W, H);

      // ── deep-space starfield ──
      for (const s of stars) {
        const sx = ((s.x + tm * 0.004 * s.z) % 1) * W;
        const sy = s.y * H;
        const twk = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(tm * (1 + s.z * 2) + s.tw));
        const ss = s.z > 0.8 ? 1.6 : 1;
        ctx.fillStyle = `oklch(${78 + s.z * 18}% 0.03 ${250 + s.z * 60} / ${twk * (0.12 + s.z * 0.38)})`;
        ctx.fillRect(sx, sy, ss, ss);
      }

      ctx.globalCompositeOperation = 'lighter';
      const conv = p === 'thinking' ? 0.6 : 1;
      for (const pt of parts) {
        pt.a += pt.sp * dt * (p === 'idle' ? 0.4 : 1);
        const rr = R * pt.rad * conv * (1 + A * 0.25);
        const x = cx + Math.cos(pt.a) * rr * 1.15;
        const y = cy + Math.sin(pt.a) * rr;
        const tw = 0.4 + 0.6 * (Math.sin(tm * 2 + pt.tw) * 0.5 + 0.5);
        const hue = 250 + 80 * (pt.rad - 0.55) / 1.5 + hueShift;
        ctx.fillStyle = `oklch(85% 0.16 ${hue} / ${tw * (0.5 + A * 0.4)})`;
        ctx.beginPath(); ctx.arc(x, y, pt.sz * (0.7 + A * 0.5), 0, TAU); ctx.fill();
      }

      const wob = R * (0.05 + A * 0.24);
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      blob(cx, cy, R * 0.94, wob, 0, 1); ctx.clip();
      const coreH = 282 + 30 * Math.sin(tm * 0.5) + (p === 'thinking' ? hueShift * 0.3 : 0);
      const cg = ctx.createRadialGradient(cx, cy - R * 0.28, R * 0.05, cx, cy, R * 1.15);
      cg.addColorStop(0, `oklch(97% 0.04 ${coreH} / 0.95)`);
      cg.addColorStop(0.32, `oklch(80% 0.18 ${coreH} / 0.92)`);
      cg.addColorStop(0.7, `oklch(58% 0.21 ${coreH + 20} / 0.7)`);
      cg.addColorStop(1, `oklch(40% 0.18 ${coreH + 30} / 0.15)`);
      ctx.fillStyle = cg; ctx.fillRect(cx - R * 2, cy - R * 2, R * 4, R * 4);
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        const ya = cy + Math.sin(tm * (1.1 + k * 0.5) + k) * R * 0.4 * (0.4 + A);
        const bg = ctx.createRadialGradient(cx, ya, 0, cx, ya, R * 0.9);
        bg.addColorStop(0, `oklch(92% 0.14 ${[260, 320, 195][k] + hueShift} / ${0.18 + A * 0.22})`);
        bg.addColorStop(1, 'oklch(90% 0.1 270 / 0)');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, ya, R * 0.9, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = `oklch(99% 0.02 270 / ${0.5 + A * 0.3})`;
      ctx.beginPath(); ctx.arc(cx - R * 0.28, cy - R * 0.34, R * 0.14, 0, TAU); ctx.fill();
      ctx.restore();

      ctx.globalCompositeOperation = 'lighter';
      const ringH = [268, 322, 196];
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        blob(cx, cy, R * (1.0 + k * 0.07), wob * (1 + k * 0.35), k * 2.3, 1);
        ctx.lineWidth = 1.6 - k * 0.45;
        ctx.strokeStyle = `oklch(85% 0.17 ${ringH[k] + hueShift * 0.3} / ${0.55 - k * 0.14 + A * 0.2})`;
        ctx.stroke();
      }

      // ── electric filaments in the core (fractal arcs w/ glow + forks) ──
      if (p === 'thinking') {
        ctx.beginPath();
        const st = tm * 3.2;
        ctx.arc(cx, cy, R * 1.32, st, st + Math.PI * 1.1);
        ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.strokeStyle = `oklch(88% 0.16 ${260 + hueShift} / 0.85)`; ctx.stroke();
      }

      ctx.globalCompositeOperation = 'source-over';
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
  }, [active]);
  return <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block' }} />;
}

// ─── 心流 MODE (real-time voice overlay) ─────────────────────
const FLOW_SCRIPT = {
  user: '灵犀，lingxi-core 的 rust engine review 进行到哪一步了？',
  ai: '已完成 protocol 层的 spec review，两条修改建议待确认。引擎主循环这边测试全部通过——需要我把建议摘要发到当前会话吗？',
};

function FlowMode({ open, onClose }) {
  const phaseRef = useRef('idle');           // idle | listening | thinking | speaking
  const [phase, setPhase] = useState('idle');
  const [caption, setCaption] = useState('');
  const [role, setRole] = useState('user');
  const timersRef = useRef([]);
  const runRef = useRef(0);

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const clearTimers = () => { timersRef.current.forEach(clearTimeout); timersRef.current = []; };
  const after = (ms, fn) => { const id = setTimeout(fn, ms); timersRef.current.push(id); return id; };

  const typeText = (str, myRun, doneFn) => {
    let i = 0;
    const step = () => {
      if (runRef.current !== myRun) return;
      i++;
      setCaption(str.slice(0, i));
      if (i < str.length) after(30 + Math.random() * 34, step);
      else if (doneFn) after(420, doneFn);
    };
    step();
  };

  const startListen = () => {
    clearTimers();
    const myRun = ++runRef.current;
    setRole('user'); setCaption(''); setPhase('listening');
    after(700, () => {
      if (runRef.current !== myRun) return;
      typeText(FLOW_SCRIPT.user, myRun, () => {
        if (runRef.current !== myRun) return;
        setPhase('thinking');
        after(1500, () => {
          if (runRef.current !== myRun) return;
          setRole('ai'); setCaption(''); setPhase('speaking');
          typeText(FLOW_SCRIPT.ai, myRun, () => {
            if (runRef.current !== myRun) return;
            after(900, () => { if (runRef.current === myRun) { setPhase('idle'); setCaption(''); } });
          });
        });
      });
    });
  };

  // real-time voice: live the moment it opens; reset on close
  useEffect(() => {
    if (open) { startListen(); }
    else { clearTimers(); runRef.current++; setPhase('idle'); setCaption(''); }
  }, [open]);

  // Esc closes
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);

  if (!open) return null;

  const labels = { idle: '聆听中', listening: '聆听中', thinking: '思考中', speaking: '灵犀' };
  const sub = { idle: '', listening: '说完轻点收音 · 或继续', thinking: '正在组织语言…', speaking: '轻点光球可打断' };

  return (
    <div data-screen-label="心流模式" style={{
      position: 'absolute', inset: 0, zIndex: 95,
      background: 'radial-gradient(ellipse 70% 75% at 50% 36%, oklch(20% 0.07 270), #05050a 75%)',
      animation: 'orb-in 0.45s ease both', overflow: 'hidden',
    }}>
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(circle at 50% 42%, transparent 42%, rgba(0,0,0,0.5) 100%)', pointerEvents: 'none' }} />

      {/* close */}
      <button onClick={onClose} title="退出心流 (Esc)" style={{
        position: 'absolute', top: 16, right: 16, zIndex: 3,
        width: 36, height: 36, borderRadius: 99, cursor: 'pointer',
        background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.12)',
        color: 'oklch(90% 0.01 270)', display: 'flex', alignItems: 'center', justifyContent: 'center',
        backdropFilter: 'blur(8px)',
      }}>
        <Icon name="x" size={15} stroke={2} />
      </button>

      {/* the orb — tap to interrupt / re-listen */}
      <div onClick={startListen} style={{ position: 'absolute', inset: 0, cursor: 'pointer', zIndex: 1 }}>
        <OrbCanvas phaseRef={phaseRef} active={open} cyFrac={0.42} />
      </div>

      {/* status + caption */}
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '0 48px 44px', display: 'flex', flexDirection: 'column', alignItems: 'center', zIndex: 2, pointerEvents: 'none' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
          <span style={{ width: 7, height: 7, borderRadius: 99, background: phase === 'listening' ? 'oklch(72% 0.18 150)' : phase === 'speaking' ? 'oklch(75% 0.19 300)' : 'oklch(70% 0.16 260)', boxShadow: `0 0 10px ${phase === 'listening' ? 'oklch(72% 0.18 150)' : 'oklch(75% 0.18 290)'}`, animation: phase === 'idle' ? 'none' : 'shimmer 1.4s ease-in-out infinite' }} />
          <span style={{ fontSize: 14, fontWeight: 600, color: 'oklch(92% 0.02 270)', letterSpacing: 0.5, whiteSpace: 'nowrap' }}>{labels[phase]}</span>
        </div>
        <div key={phase + role} style={{ minHeight: 76, maxWidth: 560, textAlign: 'center', animation: 'orb-cap 0.4s ease both' }}>
          {caption ? (
            <div style={{ fontSize: role === 'ai' ? 17.5 : 16.5, lineHeight: 1.55, fontWeight: role === 'ai' ? 500 : 400, color: role === 'ai' ? 'oklch(96% 0.02 290)' : 'oklch(80% 0.03 270)' }}>
              {role === 'user' && <span style={{ color: 'oklch(62% 0.04 270)' }}>“</span>}
              {caption}
              {(phase === 'listening' || phase === 'speaking') && <span style={{ display: 'inline-block', width: 2, height: '1em', marginLeft: 2, verticalAlign: '-2px', background: 'oklch(85% 0.15 290)', animation: 'caret-blink 0.9s step-end infinite' }} />}
              {role === 'user' && <span style={{ color: 'oklch(62% 0.04 270)' }}>”</span>}
            </div>
          ) : (
            <div style={{ fontSize: 13.5, color: 'oklch(60% 0.03 270)' }}>{sub[phase]}</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState('dark');
  const t = useMemo(() => tokens(theme === 'dark'), [theme]);
  const [mode, setMode] = useState('code');
  const [activeRepo, setActiveRepo] = useState('lingxi-next');
  const [activeSession, setActiveSession] = useState('lxn-1');
  const [panelOpen, setPanelOpen] = useState(true);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [flowOpen, setFlowOpen] = useState(false);
  const [model, setModel] = useState(MODELS[0]);
  const [extraMessages, setExtraMessages] = useState([]);
  const appendMessage = (msg) => setExtraMessages(m => [...m, msg]);

  const repo = PROJECTS.find(r => r.id === activeRepo) || PROJECTS[0];

  // Fit the fixed-size desktop canvas into any viewport
  const DW = 1440, DH = 900;
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => setScale(Math.min(window.innerWidth / DW, window.innerHeight / DH));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <Theme.Provider value={t}>
      <div style={{
        position: 'fixed', inset: 0, background: t.appBg,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden', transition: 'background 0.3s ease',
      }} data-screen-label="灵犀 Code Desktop">
       <div style={{ width: DW * scale, height: DH * scale, flexShrink: 0, position: 'relative' }}>
        <div style={{
          width: DW, height: DH, position: 'relative',
          transform: `scale(${scale})`, transformOrigin: 'top left',
          background: t.windowBg, overflow: 'hidden',
          display: 'flex', borderRadius: 12,
          boxShadow: t.windowShadow,
        }}>
          {/* Traffic lights */}
          <div style={{
            position: 'absolute', top: 14, left: 16, zIndex: 30,
            display: 'flex', gap: 8,
          }}>
            {['#ff5f57', '#febc2e', '#28c840'].map(c => (
              <div key={c} style={{ width: 12, height: 12, borderRadius: '50%', background: c, border: '0.5px solid rgba(0,0,0,0.1)' }} />
            ))}
          </div>

          <Sidebar
            mode={mode} setMode={setMode}
            activeRepo={activeRepo} setActiveRepo={setActiveRepo}
            activeSession={activeSession} setActiveSession={setActiveSession}
            openSettings={() => setSettingsOpen(true)}
            collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed}
          />

          {/* Main */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: t.windowBg }}>
            <TopBar repo={repo}
              onTogglePanel={() => setPanelOpen(!panelOpen)} panelOpen={panelOpen}
              theme={theme} setTheme={setTheme}
              sidebarCollapsed={sidebarCollapsed} />
            <Stage extraMessages={extraMessages} />
            <Composer repo={repo} model={model} setModel={setModel}
              panelOpen={panelOpen} setPanelOpen={setPanelOpen}
              appendMessage={appendMessage}
              openFlow={() => setFlowOpen(true)} />
          </div>

          {panelOpen && <RightPanel onClose={() => setPanelOpen(false)} />}

          <SettingsPage open={settingsOpen} onClose={() => setSettingsOpen(false)} theme={theme} setTheme={setTheme} />

          <FlowMode open={flowOpen} onClose={() => setFlowOpen(false)} />
        </div>
       </div>
      </div>
    </Theme.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
