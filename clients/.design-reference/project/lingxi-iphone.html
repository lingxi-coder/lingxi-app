  const t = useT();
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: '3px 9px', borderRadius: 6, fontSize: 11.5, fontWeight: 500,
      background: color ? `color-mix(in oklab, ${color} 16%, transparent)` : t.surface,

      border: `0.5px solid ${color ? `color-mix(in oklab, ${color} 30%, transparent)` : t.border}`,
      ...style,
    }}>{children}</span>
  );
};

// ─── DRAWER (left side) ──────────────────────────────────────
function Drawer({ open, onClose, activeWs, setActiveWs, activeSession, setActiveSession, openSettings }) {
  const t = useT();
  const ws = WORKSPACES.find(w => w.id === activeWs);
  const [section, setSection] = useState('chats');
  const [openProjects, setOpenProjects] = useState({ p1: true });
  const chats = CHATS.filter(s => s.wsId === activeWs);
  const groupedChats = chats.reduce((acc, s) => { (acc[s.group] = acc[s.group] || []).push(s); return acc; }, {});
  const projects = PROJECTS.filter(p => p.wsId === activeWs);
  const crons = CRONS.filter(c => c.wsId === activeWs);
  const counts = { chats: chats.length, projects: projects.length, crons: crons.length };

  if (!open) return null;

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 50, display: 'flex' }}>
      <div onClick={onClose} style={{
        position: 'absolute', inset: 0,
        background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(4px)',
        animation: 'fade-in 0.2s ease',
      }} />
      <div style={{
        width: 320, height: '100%', position: 'relative',
        background: t.sidebarBg, borderRight: `0.5px solid ${t.border}`,
        display: 'flex', flexDirection: 'column',
        animation: 'slide-right 0.25s cubic-bezier(0.32, 0.72, 0, 1)',
        boxShadow: '8px 0 30px rgba(0,0,0,0.3)',
      }}>
        {/* Status bar offset */}
        <div style={{ height: 54 }} />

        {/* Header */}
        <div style={{ padding: '8px 18px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: t.text, letterSpacing: -0.3 }}>灵犀</div>
          <div style={{ flex: 1 }} />
          <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: 10, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text3, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="x" size={20} stroke={1.8} />
          </button>
        </div>

        {/* Workspace pills */}
        <div style={{ padding: '0 18px 12px', display: 'flex', gap: 6, overflowX: 'auto' }}>
          {WORKSPACES.map(w => (

// ─── MESSAGE ─────────────────────────────────────────────────
function Message({ m }) {
  const t = useT();
  if (m.role === 'user') {
    return (
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 22, animation: 'fade-in 0.3s ease' }}>
        <div style={{ maxWidth: '85%', padding: '12px 16px', borderRadius: 18, borderTopRightRadius: 6, background: t.surface, border: `0.5px solid ${t.border}`, fontSize: 15.5, lineHeight: 1.5, color: t.text, whiteSpace: 'pre-wrap' }}>{m.text}</div>
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', gap: 11, marginBottom: 26, alignItems: 'flex-start', animation: 'fade-in 0.3s ease' }}>
      <div style={{ width: 30, height: 30, borderRadius: 9, flexShrink: 0, background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 4px 12px color-mix(in oklab, ${t.accent} 30%, transparent)` }}>
        <Icon name="sparkle" size={15} color="#fff" stroke={2} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        {m.tag && <div style={{ marginBottom: 8 }}><Pill color={t.accent}>{m.tag}</Pill></div>}
        <div style={{ fontSize: 15.5, lineHeight: 1.6, color: t.text, whiteSpace: 'pre-wrap' }} dangerouslySetInnerHTML={{ __html: m.text.replace(/\*\*(.+?)\*\*/g, `<strong style="font-weight:600;color:${t.text}">$1</strong>`) }} />
      </div>
    </div>
  );
}

// ─── COMPOSER ────────────────────────────────────────────────
function Composer({ onSend, model, setModel }) {
  const t = useT();
  const [text, setText] = useState('');
  const [modelOpen, setModelOpen] = useState(false);
  const send = () => { if (text.trim()) { onSend(text); setText(''); } };
  return (
    <div style={{ padding: '8px 14px 4px', position: 'relative', flexShrink: 0 }}>
      <div style={{
        background: t.composerBg, border: `0.5px solid ${t.borderStrong}`,
        borderRadius: 22, padding: '10px 12px 8px',
        boxShadow: '0 4px 16px rgba(0,0,0,0.06)',
      }}>
        <textarea value={text} onChange={e => setText(e.target.value)}
          placeholder="向灵犀提问…"
          rows={1}
          style={{
            width: '100%', border: 'none', outline: 'none', resize: 'none',
            background: 'transparent', color: t.text, fontSize: 15.5, lineHeight: 1.5,
            fontFamily: 'inherit', minHeight: 22, maxHeight: 100, padding: '2px 4px',
          }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, marginTop: 4, position: 'relative' }}>
          <button style={{ width: 34, height: 34, borderRadius: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text3, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="plus" size={18} stroke={1.8} />
          </button>
          <button onClick={() => setModelOpen(!modelOpen)} style={{
            display: 'flex', alignItems: 'center', gap: 5,
            padding: '5px 9px', borderRadius: 8,
            background: modelOpen ? t.surfaceHover : 'transparent',
            border: 'none', cursor: 'pointer', color: t.text2, fontSize: 12, fontFamily: 'inherit',
          }}>
            <span style={{ width: 6, height: 6, borderRadius: 99, background: model.color }} />
            <span style={{ fontWeight: 500 }}>{model.name.replace('Lingxi-', '')}</span>
            <Icon name="chevron" size={11} stroke={2} color={t.text4} />
          </button>
          {modelOpen && (
            <div style={{ position: 'absolute', bottom: '100%', left: 36, marginBottom: 6, zIndex: 50, background: t.surface, border: `0.5px solid ${t.borderStrong}`, borderRadius: 12, padding: 5, minWidth: 200, boxShadow: '0 16px 40px rgba(0,0,0,0.3)' }}>
              {MODELS.map(m => (
                <div key={m.id} onClick={() => { setModel(m); setModelOpen(false); }} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', background: m.id === model.id ? t.accentBg : 'transparent' }}>
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: m.color }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, color: t.text, fontWeight: 500 }}>{m.name}</div>
                    <div style={{ fontSize: 11, color: t.text3 }}>{m.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          <div style={{ flex: 1 }} />
          {!text.trim() ? (
            <button style={{ width: 34, height: 34, borderRadius: 10, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Icon name="mic" size={18} stroke={1.8} />
            </button>
          ) : (
            <button onClick={send} style={{
              width: 34, height: 34, borderRadius: 10, border: 'none', cursor: 'pointer',
              background: t.accent, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: `0 4px 12px color-mix(in oklab, ${t.accent} 40%, transparent)`,
            }}>
              <Icon name="arrowUp" size={16} color="#fff" />
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── CHAT VIEW ───────────────────────────────────────────────
function ChatView({ session, theme, setTheme, openDrawer }) {
  const t = useT();
  const [messages, setMessages] = useState(MESSAGES_DEFAULT);
  const [isNew, setIsNew] = useState(false);
  const [model, setModel] = useState(MODELS[0]);
  const [streaming, setStreaming] = useState(false);
  const scrollRef = useRef(null);

  // Switching sessions from the drawer restores that thread's content
  useEffect(() => { setIsNew(false); setStreaming(false); setMessages(MESSAGES_DEFAULT); }, [session.id]);

  // Tapping the top-right compose icon opens a fresh conversation
  const newChat = () => { setMessages([]); setStreaming(false); setIsNew(true); };

  const send = (txt) => {
    setIsNew(false);
    setMessages(ms => [...ms, { role: 'user', text: txt }]);
    setStreaming(true);
    setTimeout(() => {
      setMessages(ms => [...ms, { role: 'ai', tag: '思考了 8 秒', text: '已记入。继续追问。' }]);
      setStreaming(false);
    }, 1100);
  };

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, streaming]);

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: t.windowBg, position: 'relative', minHeight: 0 }}>
      <div style={{ position: 'absolute', inset: 0, background: t.ambient, pointerEvents: 'none' }} />

      {/* Top bar */}
      <div style={{ padding: '6px 12px 10px', display: 'flex', alignItems: 'center', gap: 4, position: 'relative', zIndex: 2 }}>
        <button onClick={openDrawer} style={{ width: 38, height: 38, borderRadius: 10, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name="menu" size={20} stroke={1.8} />
        </button>
        <div style={{ flex: 1, textAlign: 'center', overflow: 'hidden' }}>
          <div style={{ fontSize: 14.5, fontWeight: 600, color: t.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', padding: '0 8px' }}>{isNew ? '新对话' : session.title}</div>
        </div>
        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} style={{ width: 38, height: 38, borderRadius: 10, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={18} stroke={1.7} />
        </button>
        <button onClick={newChat} style={{ width: 38, height: 38, borderRadius: 10, background: 'transparent', border: 'none', cursor: 'pointer', color: t.accent, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name="edit" size={18} stroke={1.8} />
        </button>
      </div>

      <WorkflowBar />

      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', position: 'relative', zIndex: 2 }}>
        <div style={{ padding: '18px 16px 8px' }}>
          {isNew && messages.length === 0 && !streaming && (
            <div style={{ minHeight: 420, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '0 24px' }}>
              <div style={{ width: 52, height: 52, borderRadius: 15, background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 18 }}>
                <Icon name="sparkle" size={26} color="#fff" stroke={1.8} />
              </div>
              <div style={{ fontSize: 21, fontWeight: 600, color: t.text, marginBottom: 7 }}>开启新对话</div>
              <div style={{ fontSize: 14, color: t.text4, lineHeight: 1.5, maxWidth: 260 }}>随便说点什么，或按住屏幕进入语音心流模式。</div>
            </div>
          )}
          {messages.map((m, i) => <Message key={i} m={m} />)}
          {streaming && (
            <div style={{ display: 'flex', gap: 11, alignItems: 'center', marginBottom: 26 }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="sparkle" size={15} color="#fff" stroke={2} />
              </div>
              <div style={{ display: 'flex', gap: 4 }}>
                {[0, 1, 2].map(i => <span key={i} style={{ width: 5, height: 5, borderRadius: 99, background: t.accent, animation: `shimmer 1.2s infinite ${i * 0.15}s` }} />)}
              </div>
            </div>
          )}
        </div>
      </div>

      <Composer onSend={send} model={model} setModel={setModel} />
    </div>
  );
}

        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '8px 0 18px' }}>
          <div style={{ width: 64, height: 64, borderRadius: 16, background: `color-mix(in oklab, oklch(72% 0.16 195) 20%, ${t.surface})`, border: `0.5px solid color-mix(in oklab, oklch(72% 0.16 195) 35%, transparent)`, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 12 }}>
            <Icon name="skill" size={28} color="oklch(72% 0.16 195)" stroke={1.7} />
          </div>
          <div style={{ fontSize: 18, fontWeight: 700, color: t.text }}>{s.name}</div>
          <div style={{ fontSize: 12, color: t.text4, marginTop: 4 }}>{s.author} · v1.2.0</div>
        </div>
        <div style={{ padding: '14px 16px', background: t.surface, borderRadius: 12, border: `0.5px solid ${t.border}`, marginBottom: 14 }}>
          <div style={{ fontSize: 13, color: t.text2, lineHeight: 1.6 }}>{s.desc}</div>
        </div>
        <Section label="触发">
          {s.triggers.map((tr, i) => (
            <Row key={i} label={tr} chevron={false} isLast={i === s.triggers.length - 1}>
              <Icon name="check" size={15} color="oklch(70% 0.15 155)" stroke={2.4} />
            </Row>
          ))}
        </Section>
        <Section label="所需权限">
          <Row label="读取知识库" chevron={false} />
          <Row label="调用 LLM" chevron={false} />
          <Row label="访问 MCP · GitHub" chevron={false} isLast />
        </Section>
        <Section>
          <Row label="启用此 Skill" chevron={false}><Toggle on={s.enabled} onChange={(v) => update('enabled', v)} /></Row>
          <Row label="自动建议" sub="检测到匹配场景时主动提示" chevron={false}><Toggle on={true} onChange={() => {}} /></Row>
          <Row label="编辑提示词" onClick={() => {}} />
          <Row icon="x" label={s.builtin ? '此 Skill 由官方维护' : '删除此 Skill'} danger={!s.builtin} chevron={false} isLast />
        </Section>
      </>
    );
  };

  const renderMcpList = () => {
    const toggle = (id) => setMcpServers(arr => arr.map(s => s.id === id ? { ...s, enabled: !s.enabled } : s));
    const totalTools = mcpServers.filter(s => s.enabled && s.status === 'connected').reduce((a, b) => a + b.tools, 0);
    return (
      <>
        <div style={{ fontSize: 11.5, color: t.text3, lineHeight: 1.5, marginBottom: 14 }}>MCP (Model Context Protocol) 是连接外部工具的开放协议。已连接的服务器会向 AI 暴露工具调用能力。</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 18 }}>
          <div style={{ flex: 1, padding: '10px 12px', background: t.surface, border: `0.5px solid ${t.border}`, borderRadius: 10 }}>
            <div style={{ fontSize: 10.5, color: t.text4, letterSpacing: 0.5, textTransform: 'uppercase' }}>已连接</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: t.text, marginTop: 2 }}>{mcpServers.filter(s => s.status === 'connected').length}</div>
          </div>
          <div style={{ flex: 1, padding: '10px 12px', background: t.surface, border: `0.5px solid ${t.border}`, borderRadius: 10 }}>
            <div style={{ fontSize: 10.5, color: t.text4, letterSpacing: 0.5, textTransform: 'uppercase' }}>可用工具</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: t.text, marginTop: 2 }}>{totalTools}</div>
          </div>
        </div>
        <Section label={`服务器 · ${mcpServers.length}`}>
          {mcpServers.map((s, i) => {
            const sm = STATUS_META[s.status];
            return (
              <Row key={s.id}
                icon="plug" iconColor={s.status === 'connected' ? 'oklch(70% 0.18 165)' : s.status === 'error' ? 'oklch(65% 0.20 25)' : t.text4}
                label={s.name}
                sub={(<span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontFamily: 'ui-monospace, monospace' }}>
                  <span style={{ width: 6, height: 6, borderRadius: 99, background: sm.dot }} /> {sm.label} · {s.tools} 工具 · {s.transport}
                </span>)}
                chevron={false}
                isLast={i === mcpServers.length - 1}
                onClick={() => push({ id: 'mcp-edit', mcpId: s.id })}
              ><Toggle on={s.enabled} onChange={() => toggle(s.id)} /></Row>
            );
          })}
        </Section>
        <button style={{
          width: '100%', padding: '13px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
          borderRadius: 12, border: `1px dashed ${t.border}`, background: 'transparent',
          color: t.text2, fontSize: 13.5, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer',
        }}><Icon name="plus" size={15} stroke={2} /> 添加 MCP 服务器</button>
        <div style={{ fontSize: 11, color: t.text4, lineHeight: 1.6, padding: '14px 4px 0' }}>
          支持 stdio / SSE / Streamable HTTP 三种传输；OAuth、API Key、本地子进程多种鉴权。<br />
          浏览公开服务器目录：<span style={{ color: t.accent }}>mcp.directory</span>
        </div>
      </>
    );
  };

  const renderMcpEdit = (mcpId) => {
    const s = mcpServers.find(x => x.id === mcpId);
    if (!s) { pop(); return null; }
    const sm = STATUS_META[s.status];
    const update = (k, v) => setMcpServers(arr => arr.map(x => x.id === mcpId ? { ...x, [k]: v } : x));
    return (
      <>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', borderRadius: 10, background: `color-mix(in oklab, ${sm.dot} 8%, ${t.surface})`, border: `0.5px solid color-mix(in oklab, ${sm.dot} 24%, transparent)`, marginBottom: 18 }}>
          <div style={{ width: 8, height: 8, borderRadius: 99, background: sm.dot, boxShadow: `0 0 0 3px color-mix(in oklab, ${sm.dot} 22%, transparent)` }} />
          <div style={{ flex: 1, fontSize: 12.5, color: t.text2, fontWeight: 500 }}>{sm.label} · {s.tools} 工具可用</div>
          <button onClick={() => { update('status', 'testing'); setTimeout(() => update('status', 'connected'), 1100); }} style={{ padding: '6px 10px', borderRadius: 7, border: `0.5px solid ${t.border}`, background: t.windowBg, color: t.text2, fontSize: 12, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer' }}>重新连接</button>
        </div>
        <label style={{ display: 'block', fontSize: 12, color: t.text3, fontWeight: 500, marginBottom: 6 }}>显示名称</label>
        <input value={s.name} onChange={e => update('name', e.target.value)} style={{ ...inputBase, fontFamily: 'inherit', marginBottom: 14 }} />
        <label style={{ display: 'block', fontSize: 12, color: t.text3, fontWeight: 500, marginBottom: 6 }}>端点</label>
        <input value={s.url} onChange={e => update('url', e.target.value)} style={inputBase} />
        <div style={{ fontSize: 10.5, color: t.text4, marginTop: 4, marginBottom: 14 }}>支持 <span style={{ fontFamily: 'ui-monospace, monospace' }}>stdio://</span>、<span style={{ fontFamily: 'ui-monospace, monospace' }}>https://</span>、<span style={{ fontFamily: 'ui-monospace, monospace' }}>sse://</span></div>
        <Section label="传输与鉴权">
          <Row label="传输方式" value={s.transport} onClick={() => {}} />
          <Row label="鉴权" value={s.auth || '无'} onClick={() => {}} isLast />
        </Section>
        <Section label="工具权限" footer="灵犀只会调用你允许的工具。每次首次调用会请求确认。">
          {['list_files', 'read_file', 'write_file', 'create_issue', 'list_issues', 'comment'].slice(0, Math.min(6, s.tools)).map((tn, i, a) => (
            <Row key={tn} label={tn} sub={i % 2 === 0 ? '只读' : '可写'} chevron={false} isLast={i === a.length - 1}>
              <Toggle on={i < 4} onChange={() => {}} />
            </Row>
          ))}
        </Section>
        <Section>
          <Row label="启用服务器" chevron={false}><Toggle on={s.enabled} onChange={(v) => update('enabled', v)} /></Row>
          <Row label="自动启动" chevron={false} isLast><Toggle on={true} onChange={() => {}} /></Row>
        </Section>
        <button onClick={() => { setMcpServers(arr => arr.filter(x => x.id !== mcpId)); pop(); }} style={{
          marginTop: 8, width: '100%', padding: '12px',
          borderRadius: 11, border: `0.5px solid ${t.border}`, background: 'transparent',
          color: 'oklch(65% 0.20 25)', fontSize: 13.5, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer',
        }}>移除此服务器</button>
      </>
    );
  };

  const renderDream = () => {
    const acts = [
      { k: 'reorganize', label: '整理记忆',   sub: '合并相似 / 去重 / 归档过期' },
      { k: 'plan',       label: '草拟今日计划', sub: '基于昨日未完成 + 日历' },
      { k: 'recap',      label: '总结过去一周', sub: '每周日凌晨生成回顾报告' },
      { k: 'prefetch',   label: '预热常用上下文', sub: '预生成你最常问的回答' },
      { k: 'polish',     label: '润色草稿',     sub: '为待发邮件/文档生成 2 套候选' },
    ];
    return (
      <>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '12px 0 22px', position: 'relative' }}>
          <div style={{ position: 'relative', width: 76, height: 76, marginBottom: 14 }}>
            <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', background: `radial-gradient(circle at 30% 30%, oklch(70% 0.18 320), oklch(40% 0.18 268))`, animation: 'shimmer 3s ease-in-out infinite' }} />
            <div style={{ position: 'absolute', inset: 6, borderRadius: '50%', background: t.windowBg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Icon name="dream" size={32} color="oklch(70% 0.18 320)" stroke={1.6} />
            </div>
          </div>
          <div style={{ fontSize: 19, fontWeight: 700, color: t.text, letterSpacing: -0.3 }}>Dream 模式</div>
          <div style={{ fontSize: 12.5, color: t.text3, marginTop: 6, textAlign: 'center', padding: '0 16px', lineHeight: 1.6 }}>当设备闲置时，灵犀在后台运行<br />整理、规划、润色 — 醒来即可看到结果</div>
        </div>

        <Section>
          <Row label="开启 Dream 模式" sub={dreamConfig.lastRun} chevron={false} isLast>
            <Toggle on={dreamConfig.enabled} onChange={(v) => setDreamConfig(c => ({ ...c, enabled: v }))} />
          </Row>
        </Section>

        <Section label="时间窗">
          <RadioList value={dreamConfig.window} onChange={(v) => setDreamConfig(c => ({ ...c, window: v }))} options={[
            { value: 'night',  label: '夜间 (00:00–06:00)', sub: '默认，最不打扰' },
            { value: 'always', label: '随时',                sub: '只要设备闲置' },
            { value: 'custom', label: '自定义时段',          sub: '设置每日时间窗' },
          ]} />
        </Section>

        <Section label="运行条件" footer="确保不会影响日常使用：仅在充电 + Wi-Fi 时跑昂贵任务。">
          <Row label="仅在充电时" chevron={false}><Toggle on={dreamConfig.onCharging} onChange={(v) => setDreamConfig(c => ({ ...c, onCharging: v }))} /></Row>
          <Row label="仅在 Wi-Fi 时" chevron={false} isLast><Toggle on={dreamConfig.onWifi} onChange={(v) => setDreamConfig(c => ({ ...c, onWifi: v }))} /></Row>
        </Section>

        <Section label="允许的活动" footer="可叠加，越多越费电与算力。">
          {acts.map((a, i) => (
            <Row key={a.k} label={a.label} sub={a.sub} chevron={false} isLast={i === acts.length - 1}>
              <Toggle on={dreamConfig.activities[a.k]} onChange={(v) => setDreamConfig(c => ({ ...c, activities: { ...c.activities, [a.k]: v } }))} />
            </Row>
          ))}
        </Section>

        <Section label="算力预算" footer="高预算会优先调用更强模型（如 Claude Opus），并访问 MCP 工具。低预算只用本地 + 最便宜模型。">
          <RadioList value={dreamConfig.budget} onChange={(v) => setDreamConfig(c => ({ ...c, budget: v }))} options={[
            { value: 'low',    label: '低',   sub: '本地模型为主 · 几乎免费' },
            { value: 'medium', label: '中',   sub: '中等模型 · 默认' },
            { value: 'high',   label: '高',   sub: '推理模型 + 工具 · 最深入' },
          ]} />
        </Section>

        <Section label="昨夜 Dream 回顾">
          <Row label="03:24 - 03:41 · 整理记忆" sub="合并 12 条 → 7 条，归档 5 条过期" onClick={() => {}} />
          <Row label="03:41 - 04:02 · 草拟今日计划" sub="基于 8 个未完成事项 + 3 场会议" onClick={() => {}} />
          <Row label="04:02 - 04:08 · 润色邮件" sub="为 2 封草稿各生成 1 套候选" onClick={() => {}} isLast />
        </Section>
      </>
    );
  };

  // ─── Title for page ──
  const titleOf = (page) => {
    switch (page.id) {
      case 'main': return '设置';
      case 'account': return '账户';
      case 'llm-list': return 'LLM 提供商';
      case 'search-list': return '联网搜索';
      case 'fetch-list': return '网页抓取';
      case 'provider-list': return ({ llm: 'LLM 提供商', search: '联网搜索', fetch: '网页抓取' })[page.kind];
      case 'provider-picker': return '添加 ' + ({ llm: 'LLM', search: '搜索', fetch: '抓取' })[page.kind];
      case 'provider-edit': {
        const [arr] = findStore(page.kind);
        return arr.find(p => p.id === page.providerId)?.name || '编辑';
      }
      case 'voice': return '语音 TTS';
      case 'knowledge': return '知识库';
      case 'memory': return '记忆';
      case 'workflows': return '工作流';
      case 'appearance': return '外观';
      case 'language': return '语言';
      case 'notifications': return '通知';
      case 'input': return '键盘与输入';
      case 'privacy': return '数据与隐私';
      case 'skills': return 'Skills';
      case 'skill-detail': {
        return skills.find(s => s.id === page.skillId)?.name || 'Skill';
      }
      case 'mcp-list': return 'MCP 服务器';
      case 'mcp-edit': {
        return mcpServers.find(s => s.id === page.mcpId)?.name || 'MCP';
      }
      case 'dream': return 'Dream 模式';
      default: return '设置';
    }
  };

  // map list shortcuts
  const renderPage = (page) => {
    switch (page.id) {
      case 'main': return renderMain();
      case 'account': return renderAccount();
      case 'llm-list': return renderProviderList('llm');
      case 'search-list': return renderProviderList('search');
      case 'fetch-list': return renderProviderList('fetch');
      case 'provider-list': return renderProviderList(page.kind);
      case 'provider-picker': return renderProviderPicker(page.kind);
      case 'provider-edit': return renderProviderEdit(page.kind, page.providerId);
      case 'voice': return renderVoice();
      case 'knowledge': return renderKnowledge();
      case 'memory': return renderMemory();
      case 'workflows': return renderWorkflows();
      case 'appearance': return renderAppearance();
      case 'language': return renderLanguage();
      case 'notifications': return renderNotifications();
      case 'input': return renderInput();
      case 'privacy': return renderPrivacy();
      case 'skills': return renderSkills();
      case 'skill-detail': return renderSkillDetail(page.skillId);
      case 'mcp-list': return renderMcpList();
      case 'mcp-edit': return renderMcpEdit(page.mcpId);
      case 'dream': return renderDream();
      default: return null;
    }
  };

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 60, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.5)', backdropFilter: 'blur(6px)', animation: 'fade-in 0.2s ease' }} />
      <div style={{
        position: 'relative', background: t.windowBg, borderRadius: '20px 20px 0 0',
        height: '94%', display: 'flex', flexDirection: 'column',
        animation: 'slide-up 0.28s cubic-bezier(0.32, 0.72, 0, 1)',
        boxShadow: '0 -8px 30px rgba(0,0,0,0.35)',
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', padding: '8px 0 4px', flexShrink: 0 }}>
          <div style={{ width: 38, height: 4.5, borderRadius: 99, background: t.text4, opacity: 0.45 }} />
        </div>

        {/* Nav bar */}
        <div style={{ padding: '6px 8px 12px', display: 'flex', alignItems: 'center', gap: 4, borderBottom: `0.5px solid ${t.border}`, flexShrink: 0 }}>
          <button onClick={stack.length > 1 ? pop : onClose} style={{ height: 34, padding: '0 8px', borderRadius: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text2, display: 'flex', alignItems: 'center', gap: 2, fontFamily: 'inherit', fontSize: 14, flexShrink: 0, whiteSpace: 'nowrap', maxWidth: 110, overflow: 'hidden' }}>
            <span style={{ transform: 'rotate(180deg)', display: 'inline-flex', flexShrink: 0 }}><Icon name="chevronR" size={17} stroke={2.2} color={t.text2} /></span>
            <span style={{ fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{stack.length > 1 ? titleOf(stack[stack.length - 2]) : '关闭'}</span>
          </button>
          <div style={{ flex: 1, textAlign: 'center', fontSize: 16, fontWeight: 700, color: t.text, letterSpacing: -0.2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', padding: '0 8px' }}>{titleOf(top)}</div>
          {stack.length > 1
            ? <button onClick={() => { reset(); }} style={{ height: 34, padding: '0 12px', borderRadius: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: t.accent, fontFamily: 'inherit', fontSize: 14, fontWeight: 600 }}>完成</button>
            : <button onClick={onClose} style={{ height: 34, width: 34, borderRadius: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: t.text3, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="x" size={18} stroke={1.8} /></button>}
        </div>

        {/* Page content */}
        <div key={stack.length + '-' + top.id + '-' + (top.providerId || '')} style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 28px', animation: 'fade-in 0.18s ease' }}>
          {renderPage(top)}
        </div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState('dark');
  const t = useMemo(() => tokens(theme === 'dark'), [theme]);
  const [activeWs, setActiveWs] = useState('work');
  const [activeSession, setActiveSession] = useState('s1');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const session = ALL_SESSIONS.find(s => s.id === activeSession) || ALL_SESSIONS[0];

  // iPhone 15 Pro: 393 x 852
  const W = 393, H = 852;
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => {
      const sw = window.innerWidth - 60, sh = window.innerHeight - 60;
      setScale(Math.min(sw / W, sh / H, 1));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <Theme.Provider value={t}>
      <div style={{
        width: '100vw', height: '100vh',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        background: 'radial-gradient(ellipse 80% 60% at 50% 30%, oklch(18% 0.05 268), #0a0a0c 70%)',
      }} data-screen-label="灵犀 iPhone">
        {/* iPhone bezel */}
        <div style={{
          width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'center',
          background: '#1a1a1d', borderRadius: 54, padding: 9,
          boxShadow: '0 0 0 1.5px #2a2a2e, 0 50px 100px rgba(0,0,0,0.65)',
          position: 'relative',
        }}>
          <div style={{
            width: '100%', height: '100%',
            borderRadius: 46, overflow: 'hidden',
            background: t.windowBg,
            display: 'flex', flexDirection: 'column',
            position: 'relative',
          }}>
            <StatusBar dark={theme === 'dark'} />
            <ChatView session={session} theme={theme} setTheme={setTheme} openDrawer={() => setDrawerOpen(true)} />
            <HomeIndicator dark={theme === 'dark'} />
            <Drawer
              open={drawerOpen} onClose={() => setDrawerOpen(false)}
              activeWs={activeWs} setActiveWs={setActiveWs}
              activeSession={activeSession} setActiveSession={setActiveSession}
              openSettings={() => { setDrawerOpen(false); setSettingsOpen(true); }}
            />
            <SettingsSheet open={settingsOpen} onClose={() => setSettingsOpen(false)} theme={theme} setTheme={setTheme} />
          </div>
        </div>
      </div>
    </Theme.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
