[package]
name = "tool-ios-use"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11b: the `ios_use` tool — iOS on-device UI automation. Skeleton routes to
# the shared Arc<dyn ComputerControl> seam (an iOS XCUITest/accessibility
# backend, injected via UniFFI in P12). Linked only by engine-mobile on iOS.

[dependencies]
tool-api = { workspace = true }
platform-api = { workspace = true }
permission = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
