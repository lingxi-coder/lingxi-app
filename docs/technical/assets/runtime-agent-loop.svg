<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent execution / Agent 执行</title>
  <desc id="desc">Host admission prepares context and opens a model stream. Tool calls pass validation, hooks and permissions, then results return to the model loop. Completion, error and cancellation converge on durable settlement and host cleanup.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526b78"/></marker>
    <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#163642}.label{font-size:18px;font-weight:600}.sub{font-size:14px;fill:#526b78}.flow{fill:none;stroke:#526b78;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cadadd;stroke-width:1.5}</style>
  </defs>
  <rect width="960" height="520" rx="20" fill="#f3f7f7"/>
  <text x="40" y="42" class="label">One admitted turn · 一个已准入轮次</text>
  <rect x="40" y="82" width="210" height="90" rx="12" class="box"/>
  <text x="60" y="115" class="label">Host admission</text><text x="60" y="141" class="sub">宿主准入 · session + cancel</text>
  <rect x="310" y="82" width="250" height="90" rx="12" class="box"/>
  <text x="330" y="115" class="label">Context preparation</text><text x="330" y="141" class="sub">上下文 · history / skills / tools</text>
  <rect x="620" y="82" width="300" height="90" rx="12" class="box"/>
  <text x="640" y="115" class="label">Model stream · llm-client</text><text x="640" y="141" class="sub">模型流 · text / tool call / stop</text>
  <path d="M250 127H307" class="flow"/><path d="M560 127H617" class="flow"/>
  <rect x="620" y="242" width="300" height="96" rx="12" class="box"/>
  <text x="640" y="275" class="label">Tracked tool dispatch</text><text x="640" y="301" class="sub">校验 → hooks → 权限 → call</text>
  <text x="640" y="322" class="sub">validation → hooks → permission</text>
  <path d="M770 172V239" class="flow"/><text x="788" y="209" class="sub">tool_use_id</text>
  <path d="M920 290H940V70H770V79" class="flow"/><text x="723" y="58" class="sub">tool result · 工具结果</text>
  <rect x="40" y="242" width="250" height="96" rx="12" fill="#e7f1ed" stroke="#91b9a6" stroke-width="1.5"/>
  <text x="60" y="275" class="label">Durable settlement</text><text x="60" y="301" class="sub">结算 · transcript / usage / receipt</text>
  <text x="60" y="322" class="sub">EndTurn / MaxTurns / Cancelled</text>
  <path d="M670 172V206H165V239" class="flow"/><text x="332" y="198" class="sub">completion / error / cancel · 完成／失败／取消</text>
  <path d="M620 302H293" class="flow"/><text x="342" y="291" class="sub">failure / cancel · 失败／取消</text>
  <rect x="40" y="408" width="880" height="72" rx="12" class="box"/>
  <text x="60" y="437" class="label">Host cleanup · 宿主清理</text>
  <text x="60" y="462" class="sub">Stop admission → await active turns → shutdown barriers → inspect / retry report</text>
  <path d="M165 338V405" class="flow"/>
</svg>
