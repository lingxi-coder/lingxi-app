[package]
name = "agent"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unicode-normalization = "0.1"
protocol = { path = "../protocol" }
traits = { path = "../traits" }
engine = { path = "../engine" }
llm-client = { path = "../llm-client" }
tool-api = { path = "../tool-api" }
base64 = "0.22"
mcp = { path = "../mcp" }
memory = { path = "../memory" }
hooks = { path = "../hooks" }
permission = { path = "../permission" }
sidequery = { path = "../sidequery" }
# Agent-hooks ORIGIN TRUST (cc 2.1.218 `mvo`): reads the global config's
# `projects[<dir>].hasTrustDialogAccepted` before registering an agent
# definition's frontmatter hooks. Acyclic — `migrations` depends only on
# llm-client/telemetry/branding, none of which depend on `agent`.
migrations = { path = "../migrations" }
telemetry = { path = "../telemetry" }
branding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
boon = "0.6"
thiserror.workspace = true
async-trait.workspace = true
futures = { workspace = true }
tokio = { version = "1", features = ["sync", "fs"] }
tracing.workspace = true

[dev-dependencies]
test-harness = { path = "../test-harness" }
tempfile = "3"
platform-posix = { path = "../platforms/posix" }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros"] }

[lints]
workspace = true
