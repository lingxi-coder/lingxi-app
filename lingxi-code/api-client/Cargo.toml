[package]
name = "api-client"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Default-off feature flags mirroring claude-code `betas.ts` build features.
# When OFF (the external default) the corresponding `anthropic-beta` entry is
# never emitted by `assemble_beta_header`, keeping the header byte-identical to
# the external claude-code build. These add NO new crate to the dependency
# graph — they are pure `cfg!(feature = …)` compile-time toggles.
# - `connector_text`        ≙ TS `feature('CONNECTOR_TEXT')`        → SUMMARIZE_CONNECTOR_TEXT
# - `transcript_classifier` ≙ TS `feature('TRANSCRIPT_CLASSIFIER')` → AFK_MODE
[features]
default = []
connector_text = []
transcript_classifier = []

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
telemetry = { path = "../telemetry" }
cost = { path = "../cost" }
# Already compiled in the workspace (cost/tui/orchestrator depend on it; same
# locked chrono 0.4.x). Adds no new crate to the graph — used only to reproduce
# claude-code `formatResetTime` (en-US locale month/12-hour formatting).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already in the locked graph (transitive via chrono's `clock` feature on unix).
# Adds an EDGE, not a new package — reproduces claude-code `getTimeZone()`
# (Intl…timeZone, the IANA zone NAME) for the rate-limit reset-time suffix.
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures = { workspace = true }
futures-core.workspace = true
rand = "0.8"
regex = "1"
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints]
workspace = true
