# M8-P12: UniFFI bindgen config — consumed in M9 once the `uniffi` crate dep is
# added (omitted in M8 for the `--offline` build gate). M9 runs
# `uniffi-bindgen generate … --language kotlin` with this config.
[bindings.kotlin]
package_name = "com.lingxi.code.bindings"
generate_immutable_records = true
