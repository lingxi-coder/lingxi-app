[package]
name = "bridge-server"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# M8-P13: hello-world remote-engine entrypoint. Loads the bridge wire types to
# prove the wiring; the WebSocket server + JWT auth + engine-desktop wiring land
# in M9. bridge-server is the consumer tier that may later pull engine-desktop;
# the `bridge` crate itself stays an engine-tier subsystem.

[[bin]]
name = "bridge-server"
path = "src/main.rs"

[lib]
name = "bridge_server"
path = "src/lib.rs"

[dependencies]
# Namespace/branding literals (config-dir name, env var names) route through this
# crate so the Claude namespace lives in one place.
branding.workspace = true
bridge = { path = "../../bridge" }
client-protocol = { path = "../../client-protocol" }
client-adapter = { path = "../../client-adapter" }
permission = { path = "../../permission" }
# Global config (`~/.claude.json`) path resolver — user/global-scope MCP servers
# live inside it (top-level `mcpServers`), matching claude-code.
migrations = { path = "../../migrations" }
# F2-08: the full command-routing seam reaches the engine handles (in `traits`)
# and the slash-command dispatcher (`command-api`). engine-desktop wires the
# production runtime the router is built from (F2-05 binary path).
traits = { path = "../../traits" }
command-api = { path = "../../command-api" }
# S1: the production TurnDriver (`src/driver.rs`) drives a real
# ConversationOrchestrator's cancelable streaming entry, so `orchestrator` is now
# a LIBRARY dependency (it was dev-only when the only driver was the test one).
orchestrator = { path = "../../orchestrator" }
# Desktop Beta session lifecycle: enumerate/replay the same JSONL store used by
# the CLI/mobile hosts, then adopt the replayed protocol history in place.
session = { path = "../../session" }
protocol = { path = "../../protocol" }
secret = { path = "../../secret" }
platform-posix = { path = "../../platforms/posix" }
uuid = "1.10"
# `AudioResultDto` carries recorded/synthesized audio as base64 (the same
# convention as `ImageRefDto`); `audio_bridge` decodes it back to the `Vec<u8>`
# the `traits::{VoiceRecording, TtsAudio}` structs hold.
base64 = "0.22"
# Input message queue (spec §27). The connection's SendPrompt path enqueues a
# prompt that arrives while a turn is in flight and the spawned run loop drains
# it as a follow-up turn — the parity twin of print.ts run()'s `running` guard +
# do/while drainCommandQueue loop.
msgqueue = { path = "../../msgqueue" }
# Phase-2 /loop: the composition-root `WakeupScheduler` impl (one-shot delayed
# self-wakeup → enqueue) implements the `tool_cron::WakeupScheduler` seam.
tool-cron = { path = "../../tools/cron" }
# S2: the real binary resolves a DesktopConfig from env/argv and assembles the
# production runtime through the desktop composition root. app→app is permitted
# by the dependency gate (apps are leaves; the rule only forbids non-leaf→leaf).
engine-desktop = { path = "../engine-desktop" }
# `computer_access_bridge::ComputerAccessExchange` — the channel item type for
# `DesktopConfig::computer_access_tx`; boot.rs constructs the channel directly
# so it needs the type in scope (the same edge `tool-computer-use` and
# `client-adapter` already take on `tui-core`, for the identical reason).
tui-core = { path = "../../tui-core" }
telemetry = { path = "../../telemetry" }
# S2: `boot::load_settings_blocks` reads the layered settings `providers` /
# `routing` blocks (same loader the CLI uses) to fill the DesktopConfig.
engine = { path = "../../engine" }
# S2: resolve `~/.claude` (claude_home) + the global `.mcp.json` path, and the
# F2-04 `~/.claude/bridge/<port>.lock` discovery dir.
dirs = "5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
# `CancellationToken` (the per-turn cancel seam) is available in the default
# surface of tokio-util 0.7 — no extra feature needed.
tokio-util = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
# F2-06 e2e: drive a REAL streaming turn (mock streaming client + a real tool)
# through the connection-scoped AdapterPermissionGate + AdapterOutputStream, then
# exercise the permission round-trip over a live WebSocket. `orchestrator` itself
# is a normal dependency above (S1); the mocks it re-exports are available to
# tests through it without a separate dev-dep entry.
tool-api = { path = "../../tool-api" }
# F2-06-adjacent e2e: the computer-access broker test drives the REAL
# `tool_computer_use::TuiBridgeResolver` (generic despite the name) over a
# fixture tool, exercising the exact resolver the production `computer` tool
# uses — not a reinvented test double.
tool-computer-use = { path = "../../tools/computer-use" }
# F2-08 routing tests: the real builtin slash-command set the desktop
# composition root seeds, so `RunSlashCommand` routes through the production
# registry (not a test-only stub).
command-core = { path = "../../commands/core" }
# `test-util` (dev-only) gives the audio_bridge tests `#[tokio::test(start_paused
# = true)]`, so the "client never answers" deadline is exercised by advancing the
# runtime's clock rather than by sleeping for the real timeout.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.21"
futures-util.workspace = true
http = "1"
once_cell = "1"
# S2: deterministic sandbox dirs for the boot/assembly + end-to-end serve tests.
tempfile = "3"
# mcp_bridge tests confirm the REAL `mcp/src/json_config.rs` parser accepts
# what the writer produced, not just that this crate's own reader agrees with
# its own writer. Dev-only: production mcp_bridge.rs never calls into `mcp`.
mcp = { path = "../../mcp" }

[lints]
workspace = true
