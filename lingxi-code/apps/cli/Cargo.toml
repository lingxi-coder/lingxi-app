[package]
name = "cli"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lingxi-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Single source of truth for the product namespace (config dir/file names, env
# var names, memory filenames, plugin manifest dir). The CLI routes its runtime
# `.claude*` / `CLAUDE_CONFIG_DIR` literals through these constants.
branding.workspace = true
# M8-P6 / F2-01: the desktop composition root owns the orchestrator assembly.
# `engine_desktop::build(DesktopConfig)` now constructs the full runtime; this
# binary only resolves a `DesktopConfig` from `Argv`/env and delegates. The
# ~270-line wiring (and the dozen crates it pulled in — compaction, mcp, hooks,
# agent, cost, anthropic-oauth, secret, tool-api, permission, sandbox) moved
# with it and is no longer a direct CLI dependency.
engine-desktop = { path = "../engine-desktop" }
# (Plan 3c C1) The CLI `Runtime` re-projects `DesktopRuntime.credentials`
# (`Arc<secret::CredentialManager>`) and threads it into the TUI session so the
# `/connect` screen persists provider keys. Naming the leaf `secret` type re-adds
# it as a direct dep.
secret = { path = "../../secret" }
# (`/connect` Copilot device-flow) The CLI `Runtime` re-projects
# `DesktopRuntime.connect_copilot` (`Arc<dyn command_core::CopilotConnectDriver>`)
# and threads it into the TUI session so picking GitHub Copilot in `/connect`
# runs the real web sign-in. Naming the trait re-adds command-core as a direct dep.
command-core = { path = "../../commands/core" }
# F2-01: `engine_desktop::build` takes an `Arc<dyn client_adapter::PermissionRequestSink>`
# whose method carries a `client_protocol::permission::PermissionRequest`. The CLI
# defines a no-op sink (it opts into `NoOpPermissionGate`), so it names both
# engine-tier crates. Legal: the dep rule (§0.3) only forbids
# client-protocol/client-adapter → apps/*, not apps/* → client-protocol/client-adapter.
client-protocol = { path = "../../client-protocol" }
client-adapter = { path = "../../client-adapter" }
protocol = { path = "../../protocol" }
traits = { path = "../../traits" }
command-api = { path = "../../command-api" }
orchestrator = { path = "../../orchestrator" }
engine = { path = "../../engine" }
# Orphaned-permission recovery: the stdio control-plane forwards an
# `OrphanedPermission` command to the run loop, which re-runs the tool.
msgqueue = { path = "../../msgqueue" }
# stream-json P2b: contextWindow/maxOutputTokens per model from the llm-client catalog.
llm-client = { path = "../../llm-client" }
dirs = "5"
# `/web` async effect closure (`mode.rs::run_web_action`): persists the
# picker/config save via `tui::web::persist`'s `WebSearchConfig`, and runs the
# real test-search via `tool_web::web_search_client`. Naming the leaf crate
# here (rather than only reaching it transitively through `tui`) matches the
# `secret`/`command-core` precedent above.
tool-web = { path = "../../tools/web" }
tui = { path = "../../tui" }
tui-core = { path = "../../tui-core" }
session = { path = "../../session" }
# M9-05: desktop TaskRegistry type (the `Runtime` bundle re-surfaces the handle
# built by `engine_desktop::build` for the TUI poller).
tasks = { path = "../../tasks" }
telemetry = { path = "../../telemetry" }
# config migrations at startup (runMigrations port)
migrations = { path = "../../migrations" }
# Real posix primitives: `has_internet` HTTP probe (bypass_env.rs) + session-row
# FileSystem (run.rs) bind the live `PosixHttp` / `PosixFileSystem`.
platform-posix = { path = "../../platforms/posix" }
# CLI-resolved permission mode + bypass-safety guard substrate (cli_mode /
# bypass_guard). The real `BypassEnv` impl (`bypass_env.rs`) names this directly.
permission = { path = "../../permission" }
# CLI parity (2.1.191): the `mcp` and `plugin` subcommand families (`commands/`)
# drive the MCP config/registry and the plugin manager directly from the CLI
# (claude `claude mcp …` / `claude plugin …`). These libs moved into
# engine-desktop's wiring earlier; the management subcommands re-add them as
# direct CLI deps.
mcp = { path = "../../mcp" }
plugin = { path = "../../plugin" }
# Phase 8 (tui command registry): the `/skills` + `/memory` startup
# snapshots — the same on-disk walks the iocraft screens used, captured once
# into `tui_rata::session::SessionInfo` before the TUI loop starts.
skill-api = { path = "../../skill-api" }
memory = { path = "../../memory" }
# (M8 cc2.1.198) The standalone `agents` view fires the user's `Notification`
# hook (`agent_needs_input`/`agent_completed`) directly — the view runs
# WITHOUT an orchestrator, so it loads settings hooks and executes them via
# the hooks crate (the same standalone loader engine-desktop's composition
# root uses).
hooks = { path = "../../hooks" }
# (M8 cc2.1.198) Display-column clamp for the `Pon` job-label port
# (`agents_notify::job_label`); same pin as tui-core.
unicode-width = "=0.1.14"

# clap 4.6+ requires edition2024; pin to a release compatible with Rust 1.82.
clap = { version = "=4.5.20", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Pinned: assert_cmd 2.0.x is the last MSRV-1.82-compatible series.
# 2.2.0+ requires edition2024 (Rust 1.85+).
assert_cmd = "=2.0.16"
predicates = "3"
tempfile = "3"
# Deterministic mtime staggering for the resume-loader fixture test.
filetime = "0.2"

[target.'cfg(unix)'.dependencies]
# Real `BypassEnv::effective_uid` returns the REAL uid (parity with TS
# `process.getuid()`). `nix::unistd::getuid()` is a SAFE wrapper around
# `getuid(2)`, so `apps/cli` keeps its crate-level `#![forbid(unsafe_code)]`
# (a plain `libc::getuid()` would require an `unsafe` block, which `forbid`
# — unlike the workspace's `deny` — cannot be locally overridden). See
# `apps/cli/src/bypass_env.rs`. Pinned to the same 0.27 series `platforms/posix`
# already uses.
# `signal` adds the safe `kill(pid, 0)` wrapper for the agents live-session
# registry's liveness probe (`agents_registry::process_alive`, M7 cc2.1.198).
nix = { version = "0.27", default-features = false, features = ["user", "signal"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
