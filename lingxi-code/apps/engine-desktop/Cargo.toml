[package]
name = "engine-desktop"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P6: the desktop composition root. Names every desktop capability crate
# via a Cargo dependency edge — this is the single declarative place that
# decides what ships on desktop. `engine-mobile` (P11) will depend on a
# different subset. No `[lib]`/`[[bin]]` split: library-only.

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
command-api = { path = "../../command-api" }
command-core = { path = "../../commands/core" }
# Live cron scheduler (tick loop). `tool-cron` only persists descriptors; this
# crate runs them (see SKILLLIST.1-adjacent cron wiring in lib.rs `build`).
cron = { path = "../../cron" }

# F2-01: the `build_runtime` lift out of `apps/cli`. `build(DesktopConfig)`
# assembles the full orchestrator pipeline here so the bridge-server (which
# cannot depend on `apps/cli` — app→app is a leaf, scripts/check_deps.py:99) can
# construct an identical runtime. These are the engine-tier + platform crates
# the lifted wiring touches; all are non-leaf so the dep-rule gate stays green.
protocol = { path = "../../protocol" }
engine = { path = "../../engine" }
orchestrator = { path = "../../orchestrator" }
# `global_config::get_or_create_user_id` for the metadata.user_id device_id.
migrations = { path = "../../migrations" }
# Task 10: DefaultLlmClient construction + LlmTransportBridge.
llm-client = { path = "../../llm-client" }
# Phase 2a: assemble the multi-provider ClientConfig (anthropic + builtin
# catalog presets + settings `providers`) + routing chains + credential
# sources + pricing catalog, and surface per-profile availability. Engine-tier
# (non-leaf), so the dep-rule gate stays green.
provider-config = { path = "../../provider-config" }
platform-common = { path = "../../platforms/common" }
secret = { path = "../../secret" }
permission = { path = "../../permission", features = ["bash-ast"] }
sandbox = { path = "../../sandbox" }
# The LIVE `SandboxRunner` injected into the desktop tool context (Task 4):
# `SandboxRuntimeRunner` brings up the faithful sandbox-runtime proxy / bridge /
# MITM / seccomp stack. Desktop-only — `engine-mobile` deliberately does NOT
# depend on this crate (nor on `sandbox-runtime`); mobile keeps the legacy
# sync `default_sandbox_runner()`.
sandbox-runtime-runner = { path = "../../sandbox-runtime-runner" }
telemetry = { path = "../../telemetry" }
cost = { path = "../../cost" }
mcp = { path = "../../mcp" }
hooks = { path = "../../hooks" }
agent = { path = "../../agent" }
plugin = { path = "../../plugin" }
outputstyles = { path = "../../outputstyles" }
lsp = { path = "../../lsp" }
compaction = { path = "../../compaction" }
sidequery = { path = "../../sidequery" }
tasks = { path = "../../tasks" }
# M10: coordinator multi-agent subsystem (`TeamRegistry` + `CoordinatorMode` +
# `CoordinatorStatusSink`). `build()` constructs one per session and surfaces
# the registry + mode on `DesktopRuntime` so the status feed (and the PHASE-2
# command router) can read them. Engine-tier (non-leaf), so the dep-rule gate
# stays green; deliberately NOT added to `engine-mobile` (program non-goal —
# the InProcessTeammate dependency set is absent there).
coordinator = { path = "../../coordinator" }
# Real posix platform: `build()` wires `PosixFileSystem` / `PosixRuntime` /
# `PosixHttp` / `PosixClock` / secure storage, and the ConfigChange settings
# watcher drives the full `notify`-backed `FileSystem::watch` primitive
# (`watch_helper`) that lives here. The watcher reuse adds no NEW external dep —
# `notify` is already a workspace dependency via this crate. App→platform is
# allowed by the dep-graph gate.
platform-posix = { path = "../../platforms/posix" }

# F2-01: the engine→DTO adapter sinks (`AdapterOutputStream` /
# `AdapterPermissionGate`) `build()` binds when a transport (not the CLI) drives
# the runtime. Both are engine-tier (no `apps/*` edge — governing decision §0.3).
# (`client-protocol` is only needed by the F2-01 tests — see dev-dependencies.)
client-adapter = { path = "../../client-adapter" }

async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { workspace = true }
# Phase 3a: resolve `~`-prefixed permission patterns + the home root for
# file-path content matching (same `dirs` version as `orchestrator`).
dirs = "5"
# ConfigChange settings watcher: drive the `FileSystem::watch` event stream.
futures-core = { workspace = true }
tokio-stream = { workspace = true }

# F2-00: `DesktopConfig` carries the settings-declared `providers` block as
# raw JSON values so `build()` (F2-01) can feed them to `llm_client::ClientConfig`
# unchanged. `serde_json::Value` is allowed in this app-tier composition root
# (governing decision §0.4 only forbids it in `client-protocol`).
serde_json = { workspace = true }

# Skill composition (P8): the abstraction crate + the builtin skill set.
skill-api = { path = "../../skill-api" }

# The 14 desktop builtin tool crates (9 cross-platform + 5 desktop-only).
tool-file = { path = "../../tools/file", features = ["image-read", "pdf-read", "pdf-render"] }
tool-shell = { path = "../../tools/shell" }
tool-task = { path = "../../tools/task" }
tool-web = { path = "../../tools/web", features = ["web-markdown"] }
tool-plan = { path = "../../tools/plan" }
tool-meta = { path = "../../tools/meta" }
tool-cron = { path = "../../tools/cron" }
tool-ui = { path = "../../tools/ui" }
tool-skill = { path = "../../tools/skill" }
tool-agent = { path = "../../tools/agent" }
tool-workflow = { path = "../../tools/workflow" }
workflow = { path = "../../workflow" }
tool-mcp = { path = "../../tools/mcp" }
tool-lsp = { path = "../../tools/lsp" }
tool-team = { path = "../../tools/team" }
tool-worktree = { path = "../../tools/worktree" }

# `getClaudeTempDir` dir-name uses the REAL uid (1:1 TS `process.getuid?.()`).
# `nix::unistd::getuid()` is a SAFE wrapper around `getuid(2)`, so this crate
# needs no `unsafe` (a raw `libc::getuid()` would). Same pattern as `apps/cli`.
# (Also used by T16's task-output temp-dir name via the shared `current_uid()`.)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", default-features = false, features = ["user"] }

[dev-dependencies]
# Snapshot the assembled tool set (§14 criterion 8). `test-support` exposes the
# stub `BuiltinToolContext` builder so the registry can be assembled offline.
tool-api = { path = "../../tool-api", features = ["test-support"] }
insta = { version = "1.40", features = ["yaml"] }
# F2-01: sandboxed cwd/claude_home roots for the `build()` determinism tests.
# (`serde_json` is already a non-dev dependency, reused by the tests.)
tempfile = "3"
# F2-01: the DTO contract the `build_default_uses_adapter_gate` test drives the
# gate with (`PermissionResponseDto`). Only the tests touch it; lib code goes
# through `client-adapter`.
client-protocol = { path = "../../client-protocol" }
# M10 (T14): the `pool_starvation` regression drives the real
# `agent::StateMachinePool` / `agent::PoolSubagentSpawner` with the
# tokio-backed `MockRuntimeSpawner`. Dev-only — never reaches production builds.
test-harness = { path = "../../test-harness" }

[lints]
workspace = true
