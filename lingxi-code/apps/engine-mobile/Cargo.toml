[package]
name = "engine-mobile"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11: the mobile composition root. Names the mobile capability set via Cargo
# edges — the cross-platform tool subset (file/task/web/plan/meta/cron/ui/skill)
# + the mobile-exclusive tools (camera/voice/share), the mobile skill set, and
# the core+mobile command set. Deliberately omits the desktop-only tool crates
# (shell/agent/mcp/lsp/team/worktree) and the device-control tools.

[features]
default = []
# Direct-distribution Android Computer Use. Play JNI builds deliberately omit
# this edge, so the `android_use` implementation and registration code are not
# linked into the Play native library.
android-computer-use = ["dep:tool-android-use"]
# F3-02: lights up the mobile client surface — pulls the `uniffi`-typed
# `client-protocol` DTOs and the `client-adapter` `ClientEventListener` callback
# interface so the FFI packager crates (ios-framework / android-aar) can wrap
# them. Off by default so the existing host build / `cargo test` never pulls the
# FFI machinery; the full runtime/listener wiring lands in F3-03/F3-04.
uniffi = [
    "dep:uniffi",
    "dep:client-adapter",
    "dep:client-protocol",
    "client-adapter/uniffi",
    "client-protocol/uniffi",
    # F3-03: the shared `build_mobile` host module pulls the runtime-wiring
    # crates (the mobile sibling of `engine_desktop::build`). They are optional
    # so the default host build / `cargo test` stays lean; the `uniffi` feature
    # (the FFI surface) turns them on. All are engine-tier (no `apps/*` edge —
    # governing decision §0.3) so the dep-rule gate stays green.
    "dep:orchestrator",
    "dep:protocol",
    "dep:llm-client",
    "dep:platform-common",
    "dep:secret",
    "dep:permission",
    "dep:sandbox",
    "dep:telemetry",
    "dep:platform-posix-minimal",
    # v3 Phase 1 (workflow-on-mobile)
    "dep:agent",
    "dep:tasks",
    "dep:tool-workflow",
    "dep:workflow",
    # P0.2 (mobile hook lifecycle): the real `HookExecutorImpl` + `HookRegistry`
    # + settings hook loader the mobile composition root wires (replacing the
    # `noop_hook_executor()` stub) so the Command / Prompt hook arms run and the
    # session-start `SessionStart` / `InstructionsLoaded` lifecycle fires
    # dispatch against the loaded settings hooks. Engine-tier (no `apps/*` edge),
    # optional + uniffi-gated like its runtime-wiring siblings above.
    "dep:hooks",
    # SESSIONS/HISTORY: the on-disk JSONL session enumerator
    # (`session::jsonl::list_recent_sessions`) the `ListSessions` command routes
    # to. Engine-tier (no `apps/*` edge), optional + uniffi-gated like the other
    # runtime-wiring crates so the default host build stays lean.
    "dep:session",
    # SESSIONS/HISTORY (live ResumeSession): the `ResumeSession` arm parses the
    # command's `session_id` String into a `uuid::Uuid` to feed the orchestrator's
    # resume path (`orchestrator::replay_session_state`) + `SessionId::from_uuid`.
    # Optional + uniffi-gated like its siblings (no v4/serde features needed —
    # parse-only).
    "dep:uuid",
    "dep:tokio",
    # F3-05: the connection-scoped `CancellationToken` the async `submit` arms on
    # `SendPrompt` and fires on `Cancel` (the orchestrator's
    # `run_turn_streaming_with_cancel` takes it). Optional + uniffi-gated.
    "dep:tokio-util",
    # Device bridge (`local_apps_host_device`): media crosses the WebView
    # boundary as base64 inside the JSON envelope. Optional + uniffi-gated.
    "dep:base64",
    "dep:tracing",
    "dep:thiserror",
    "dep:serde_json",
    "dep:serde",
    "dep:url",
    "dep:async-trait",
    # 3c-T3: populate LlmResponse.cost from the builtin pricing catalog.
    "dep:cost",
    # Phase 2a-mobile: multi-provider assembly (catalog presets + settings
    # `providers`/`routing` → one ClientConfig + chains + credential sources +
    # pricing) shared with engine-desktop. Engine-tier (no `apps/*` edge),
    # optional + uniffi-gated like its runtime-wiring siblings above.
    "dep:provider-config",
    # Audit fix (autocompaction parity): the real `CompactionOrchestrator` +
    # its `ProviderSideQueryClient`/`ForkedAgentRunner`/`CacheSafeParamsSlot`
    # the mobile build wires via `.with_compaction(...)` so a long mobile
    # session autocompacts before context-window overflow (mirror of the
    # desktop root). Engine-tier (no `apps/*` edge), optional + uniffi-gated.
    "dep:compaction",
    "dep:sidequery",
    # LOCAL-APPS (phase 1): the shared core of the on-device "Apps" capability
    # (data model, designer-workflow state machine, atomic storage, resumable
    # continuations). The FFI host owns one `AppService` per engine handle and
    # routes the 15 `*App*` client commands to it, so the crate rides the same
    # uniffi gate as the client-protocol DTO surface it is lowered onto.
    "dep:local-apps",
    # Mobile MCP keeps the in-process Local Apps provider and reads standard
    # settings/project entries for truthful listing/configuration. External
    # stdio/remote entries remain disconnected until a platform transport is
    # injected; they are never reported as connected by the mobile engine.
    "dep:mcp",
    "dep:tool-mcp",
    "dep:futures-util",
    "dep:reqwest",
    "dep:sha2",
]

[dependencies]
# Single source of truth for the product namespace (config-dir / memory-file /
# config-dir env-var names). The host + test-support modules route their
# `.claude` / `CLAUDE.md` literals through these constants (still the Claude
# values — pure indirection, byte-identical behavior).
branding.workspace = true
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
skill-api = { path = "../../skill-api" }
command-api = { path = "../../command-api" }

# F3-02: the client-surface crates — optional, pulled ONLY under the `uniffi`
# feature. `client-adapter` carries the `ClientEventListener` callback interface
# the mobile transport feeds; `client-protocol` is its DTO vocabulary. Both are
# engine-tier (no `apps/*` edge), so this is a legal dependency. The full
# orchestrator/listener wiring (build_mobile / MobileEngineHandle) lands in
# F3-03/F3-04; F3-02 only needs the listener type reachable + the UniFFI
# scaffolding to compile under this feature.
client-adapter = { path = "../../client-adapter", optional = true }
client-protocol = { path = "../../client-protocol", optional = true }

# F3-04: the shared session host defines `MobileEngineHandle`
# (`#[derive(uniffi::Object)]`) + `MobileEngineError` (`#[derive(uniffi::Error)]`),
# so this crate carries its own `uniffi::setup_scaffolding!()` so those types'
# FFI metadata are registered. Optional + pulled ONLY under the `uniffi` feature.
# Pinned/vendored offline in F3-00 (workspace dep: 0.28.3 + the `tokio` feature
# for F3-07's foreign async executor).
uniffi = { workspace = true, optional = true }

# F3-03: the runtime-wiring crates the shared `build_mobile` host module needs
# (the mobile sibling of `engine_desktop::build`). All optional + pulled ONLY
# under the `uniffi` feature so the default host build stays lean. Every crate
# is engine-tier (non-leaf) so no `apps/*` dep-rule edge is introduced.
orchestrator = { path = "../../orchestrator", optional = true }
protocol = { path = "../../protocol", optional = true }
# Task 10: DefaultLlmClient construction + LlmTransportBridge.
llm-client = { path = "../../llm-client", optional = true }
platform-common = { path = "../../platforms/common", optional = true }
secret = { path = "../../secret", optional = true }
permission = { path = "../../permission", optional = true }
sandbox = { path = "../../sandbox", optional = true }
telemetry = { path = "../../telemetry", optional = true }
platform-posix-minimal = { path = "../../platforms/posix-minimal", optional = true }
# P0.2 (mobile hook lifecycle): the real `HookExecutorImpl` + `HookRegistry` +
# `parse_hooks_from_settings_json` loader the mobile composition root wires in
# place of `noop_hook_executor()`. Engine-tier (no `apps/*` edge), optional +
# uniffi-gated like its runtime-wiring siblings above.
hooks = { path = "../../hooks", optional = true }
# 3c-T3: builtin pricing catalog for LlmResponse.cost population. Optional +
# uniffi-gated (the cost estimator is constructed inside build_mobile_inner).
cost = { path = "../../cost", optional = true }
# v3 Phase 1 (workflow-on-mobile): the subagent pool + task registry + the
# Workflow tool itself. All engine-tier, optional + uniffi-gated like the
# runtime-wiring siblings above. `tasks` brings the `LocalWorkflowHandler`
# bridge (spawn requests, journal, progress spool); `agent` the
# `PoolSubagentSpawner`; `tool-workflow` the model-facing tool + launcher
# trait; `workflow` the QuickJS runtime (already in the closure via
# orchestrator — direct edge for `validate_meta`/`check_determinism`).
agent = { path = "../../agent", optional = true }
tasks = { path = "../../tasks", optional = true }
tool-workflow = { path = "../../tools/workflow", optional = true }
workflow = { path = "../../workflow", optional = true }
# Phase 2a-mobile: the shared multi-provider assembly (`assemble` +
# `MultiCredentialProvider`) the desktop build path already uses. Engine-tier
# (no `apps/*` edge), optional + uniffi-gated like its siblings above.
provider-config = { path = "../../provider-config", optional = true }
# Audit fix (autocompaction parity): `CompactionOrchestrator` + the side-query
# summarizer it forks. Engine-tier (no `apps/*` edge), optional + uniffi-gated
# like the other runtime-wiring crates — the compactor is built inside
# `build_mobile_inner` and attached via `.with_compaction(...)`.
compaction = { path = "../../compaction", optional = true }
sidequery = { path = "../../sidequery", optional = true }
# LOCAL-APPS (phase 1): `AppService` — the single source of truth for the
# on-device "Apps" capability the `submit` command path drives. Engine-tier
# (no `apps/*` edge), optional + uniffi-gated like its runtime-wiring siblings
# above.
local-apps = { path = "../../local-apps", optional = true }
mcp = { path = "../../mcp", optional = true }
tool-mcp = { path = "../../tools/mcp", optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
# SESSIONS/HISTORY: enumerates the on-disk `<claude_home>/projects/<cwd>/*.jsonl`
# session catalog for the `ListSessions` command. Engine-tier, optional +
# uniffi-gated like its siblings above.
session = { path = "../../session", optional = true }
# SESSIONS/HISTORY (live ResumeSession): parse the command's `session_id` String
# into a `uuid::Uuid`. Parse-only (no v4/serde) — optional + uniffi-gated.
uuid = { version = "1.10", optional = true }

tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
base64 = { version = "0.22", optional = true }
# F3-05: `CancellationToken` for the cancelable streaming turn the async `submit`
# spawns. Optional + pulled ONLY under the `uniffi` feature (engine-tier).
tokio-util = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
thiserror = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
url = { version = "2", optional = true }
async-trait = { workspace = true, optional = true }

# Cross-platform tool crates (shared with engine-desktop).
tool-file = { path = "../../tools/file" }
tool-task = { path = "../../tools/task" }
# Audit fix (WebFetch parity): enable `web-markdown` so mobile WebFetch converts
# HTML→markdown (htmd) instead of returning raw HTML to the model (raw HTML can
# blow the context window and diverges from desktop/claude-code output shape).
tool-web = { path = "../../tools/web", features = ["web-markdown"] }
tool-plan = { path = "../../tools/plan" }
tool-meta = { path = "../../tools/meta" }
tool-cron = { path = "../../tools/cron" }
# Cron firing core (`run_due_jobs` / `next_fire_epoch_ms`) the Android background
# scheduler drives over FFI. The desktop tick loop is unavailable on mobile, so
# the host evaluates the persisted tasks file single-shot through this crate.
cron = { path = "../../cron" }
tool-ui = { path = "../../tools/ui" }
tool-skill = { path = "../../tools/skill" }
# Mobile-exclusive tool crates.
tool-mobile = { path = "../../tools/mobile" }
tool-android-use = { path = "../../tools/android-use", optional = true }
# Android-only Shell tool (P3). Self-gates on ctx.android_shell; registering
# it here keeps it reachable while keeping iOS/desktop unaffected.
tool-shell-mobile = { path = "../../tools/shell-mobile" }
# Android-only Git tool (P4). Self-gates on ctx.android_git.enabled; registering
# it here keeps it reachable while keeping iOS/desktop unaffected.
tool-git-mobile = { path = "../../tools/git-mobile" }
# Command sets.
command-core = { path = "../../commands/core" }

# Platform impls are target-gated: only linked when building for the device.
[target.'cfg(target_os = "ios")'.dependencies]
platform-ios = { path = "../../platforms/ios" }

[target.'cfg(target_os = "android")'.dependencies]
platform-android = { path = "../../platforms/android" }

[dev-dependencies]
base64 = "0.22"
async-trait.workspace = true
tool-api = { path = "../../tool-api", features = ["test-support"] }
insta = { version = "1.40", features = ["yaml"] }
# F3-03: a sandboxed cwd/claude_home root for the `build_mobile` determinism
# tests (the host fake `Platform` is rooted at a temp dir).
tempfile = "3"
# F3-06: the `tests/skeleton_test.rs` integration test names these crates
# directly (the in-crate optional deps are not resolvable by name from an
# external test target). They build only when `--features uniffi` is active (the
# test file is `#![cfg(feature = "uniffi")]`), matching the verify gate; the
# scripted `MockStreamingApiClient` + `client_protocol` DTOs come from here.
orchestrator = { path = "../../orchestrator" }
client-protocol = { path = "../../client-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints]
workspace = true
