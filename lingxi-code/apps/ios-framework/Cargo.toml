[package]
name = "ios-framework"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P12: the iOS UniFFI packager crate. Wraps engine-mobile behind an opaque
# `MobileEngineHandle` and accepts foreign-supplied (Swift) callback objects
# (camera / voice / share) to construct an `IosPlatform`.
#
# UniFFI NOTE: the `uniffi` crate dependency + `#[uniffi::export]` annotations +
# `uniffi::setup_scaffolding!()` + Swift bindgen are deferred to M9 (they
# require network access to fetch `uniffi`, which would break the `--offline`
# build gate this milestone builds under). The Rust surface below is shaped
# *exactly* as UniFFI will export it — the M9 step is purely additive
# (annotate + add the dep + run `uniffi-bindgen generate`). See `uniffi.toml`
# and the Swift skeletons under `swift/`.

[lib]
crate-type = ["lib"]

[dependencies]
engine-mobile = { path = "../engine-mobile" }
skill-api = { path = "../../skill-api" }
traits = { path = "../../traits" }
protocol = { path = "../../protocol" }
thiserror.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
platform-ios = { path = "../../platforms/ios" }

[lints]
workspace = true
