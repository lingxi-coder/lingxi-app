[package]
name = "cli"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lingxi-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
api-client = { path = "../api-client" }
commands = { path = "../commands" }
orchestrator = { path = "../orchestrator" }
compaction = { path = "../compaction" }
mcp = { path = "../mcp" }
hooks = { path = "../hooks" }
agent = { path = "../agent" }
cost = { path = "../cost" }
dirs = "5"
tui = { path = "../tui" }
session = { path = "../session" }
anthropic-oauth = { path = "../anthropic-oauth" }
secret = { path = "../secret" }
tools = { path = "../tools" }
telemetry = { path = "../telemetry" }
platform-posix-minimal = { path = "../platforms/posix-minimal" }

# clap 4.6+ requires edition2024; pin to a release compatible with Rust 1.82.
clap = { version = "=4.5.20", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Pinned: assert_cmd 2.0.x is the last MSRV-1.82-compatible series.
# 2.2.0+ requires edition2024 (Rust 1.85+).
assert_cmd = "=2.0.16"
predicates = "3"
tempfile = "3"
# Deterministic mtime staggering for the resume-loader fixture test.
filetime = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
