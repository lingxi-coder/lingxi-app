[package]
name = "client-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
serde.workspace = true
thiserror.workspace = true
# `serde_json` is DELIBERATELY OMITTED — `serde_json::Value` must NOT enter the
# contract crate (governing decision §0.4: tool payloads are JSON Strings on the
# wire because `Value` is not UniFFI-representable).
#
# `uniffi` is declared as an optional dep so the SAME DTOs can compile plain
# (bridge-server) or as UniFFI types (mobile). The `uniffi` package itself is
# vendored/pinned in F3-00; until then the feature is declared but the optional
# dep line below stays commented out, so the default build needs no network and
# the `uniffi` feature is simply not buildable yet (per F1-00 plan note).
# uniffi = { version = "0.28", optional = true }

[dev-dependencies]
# `serde_json` is a DEV-ONLY dependency: the round-trip + (F1-08) snapshot tests
# need a JSON codec to assert wire shape, but `serde_json::Value` must never
# enter the contract itself (§0.4). Keeping it under `[dev-dependencies]` honors
# "no new prod dep — dev-only" (plan F1-08).
serde_json.workspace = true

[features]
default = []
# The `uniffi` feature gate is STUBBED (off by default) at F1-00 so the SAME
# DTOs compile plain (bridge-server) and, once lit up, as UniFFI types (mobile).
# It is declared now — and currently compiles to an empty feature — so the F1-00
# verify gate (`cargo build -p client-protocol --features uniffi`) is recognized
# and green without pulling `uniffi` (which is vendored/pinned offline in F3-00).
# F3-00 turns the `uniffi` optional dep on and rewrites this to
# `uniffi = ["dep:uniffi"]`; F3-01 adds the `#[cfg_attr(feature = "uniffi", …)]`
# derives. No `serde_json`/`Value` dependency is ever introduced (§0.4).
uniffi = []

[lints]
workspace = true
