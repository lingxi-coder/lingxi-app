[package]
name = "command-api"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P9: the slash-command runtime abstraction — registry, dispatcher, parser,
# argument substitution, data model, and the shared builtin scaffolding (99-name
# table + /help/list renderers + unimplemented stub). Mirrors tool-api /
# skill-api. Command *handlers* live in command-core / command-desktop /
# command-mobile.

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
