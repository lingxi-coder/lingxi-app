[package]
name = "lingxi-uniffi-bridge"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# UniFFI binding generation (Kotlin/Swift) is deferred to M2; until then the
# crate ships as a regular Rust library exposing the FFI-shaped façade types.
# See plan §Task 1 "Drop UniFFI for now".
[lib]
crate-type = ["lib"]
name = "lingxi_core"

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
