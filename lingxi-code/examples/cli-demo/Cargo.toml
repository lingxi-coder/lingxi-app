[package]
name = "cli-demo"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lingxi-demo"
path = "src/main.rs"

[dependencies]
protocol = { path = "../../protocol" }
engine = { path = "../../engine" }
traits = { path = "../../traits" }
api-client = { path = "../../api-client" }
platform-posix-minimal = { path = "../../platforms/posix-minimal" }
tokio = { workspace = true, features = ["full"] }
# clap 4.6+ requires edition2024; pin to a release compatible with Rust 1.82.
clap = { version = "=4.5.20", features = ["derive"] }
anyhow = "1"

[lints]
workspace = true
