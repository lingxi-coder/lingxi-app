# Not used yet: required by plan Tasks 6-10 (tracing in every migration).
tracing.workspace = true
# Not used yet: required by plan Tasks 6-10 (tokio fs in runner + changelog).
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# Capturing AnalyticsSink impl in test_support (emission-contract tests).
async-trait.workspace = true
# Not used yet: required by plan Tasks 6-10 (async #[tokio::test] for runner/changelog).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
