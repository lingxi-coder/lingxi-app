[package]
name = "orchestrator"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
engine = { path = "../engine" }
traits = { path = "../traits" }
api-client = { path = "../api-client" }
providers = { path = "../providers" }
tool-api = { path = "../tool-api" }
memory = { path = "../memory" }
permission = { path = "../permission" }
hooks = { path = "../hooks" }
mcp = { path = "../mcp" }
agent = { path = "../agent" }
cost = { path = "../cost" }
compaction = { path = "../compaction" }
session = { path = "../session" }
telemetry = { path = "../telemetry" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait.workspace = true
dirs = "5"
futures = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "process", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tempfile = "3"
once_cell = "1"
platform-posix = { path = "../platforms/posix" }
sidequery = { path = "../sidequery" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[features]
test-support = []

[lints]
workspace = true
