[package]
name = "orchestrator"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
engine = { path = "../engine" }
traits = { path = "../traits" }
llm-client = { path = "../llm-client" }
tool-api = { path = "../tool-api" }
memory = { path = "../memory" }
permission = { path = "../permission" }
hooks = { path = "../hooks" }
mcp = { path = "../mcp" }
agent = { path = "../agent" }
cost = { path = "../cost" }
compaction = { path = "../compaction" }
sidequery = { path = "../sidequery" }
session = { path = "../session" }
telemetry = { path = "../telemetry" }
outputstyles = { path = "../outputstyles" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
# §F conditional-rule glob matching: the Rust analogue of claude-code's `ignore`
# npm lib (gitignore-style globs). Same crate `permission`/`tools/file` use;
# already in Cargo.lock.
ignore = "0.4"
rand = "0.8"
regex = "1"
async-trait.workspace = true
dirs = "5"
futures = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "process", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tempfile = "3"
once_cell = "1"
platform-posix = { path = "../platforms/posix" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[features]
default = []
test-support = []
# Default-off feature flags mirroring claude-code `betas.ts` build features
# (ported from the former api-client/betas.rs). When OFF (the external default)
# the corresponding `anthropic-beta` entry is never emitted by
# `model::betas::assemble_beta_header`, keeping the header byte-identical to
# the external claude-code build.
# - `connector_text`        ≙ TS `feature('CONNECTOR_TEXT')`        → SUMMARIZE_CONNECTOR_TEXT
# - `transcript_classifier` ≙ TS `feature('TRANSCRIPT_CLASSIFIER')` → AFK_MODE
connector_text = []
transcript_classifier = []

[lints]
workspace = true
