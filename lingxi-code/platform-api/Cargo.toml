[package]
name = "platform-api"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The subagent output guard flags escalation attempts naming THIS build's
# settings paths, so it reads their canonical spellings from one place rather
# than repeating string literals that could drift from the rest of the tree.
branding.workspace = true
protocol = { path = "../protocol" }
uuid = { version = "1", features = ["v4"] }
# The LSP transport exposes its live `Arc<jsonrpc::Connection>` so the registry
# can bridge it into an `LspClient` (lsp `ensure_server_for_file`). jsonrpc is a
# leaf crate (no `platform-api` dep) → no cycle.
jsonrpc = { path = "../jsonrpc" }
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` supports progress/terminal channels; `time` carries the monotonic
# activation deadline; `rt` owns an activated PreparedFusionRun independently
# of a caller that drops its waiter.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
fs2 = "0.4"
tempfile = "3.13"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs", "net", "process"] }
# Apple LOCAL_PEERPID / getpeereid — rustix 0.38 has SO_PEERCRED on Linux only.
libc = "0.2"

[dev-dependencies]
# `#[tokio::test]` for the async default-impl test on `HttpTransport`.
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[lints]
workspace = true
