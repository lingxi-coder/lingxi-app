[package]
name = "platform-ios"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P10: the iOS platform skeleton. Portable Rust today — the filesystem /
# clock / process / sandbox / worktree / http handles are reused from
# platform-posix-minimal (std::fs / std::time / Unsupported stubs, all valid on
# iOS), and the iOS-specific capabilities (camera/voice/share) are injected as
# `Arc<dyn …>` trait objects implemented natively in Swift via UniFFI (P12).
# M9 swaps the reused handles for App-Sandbox-aware impls. Not cfg-gated: the
# skeleton is portable, so it compiles + is verified on the host build.

[dependencies]
traits = { path = "../../traits" }
platform-posix-minimal = { path = "../posix-minimal" }

[lints]
workspace = true
