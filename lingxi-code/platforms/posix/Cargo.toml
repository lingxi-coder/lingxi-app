[package]
name = "platform-posix"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../../protocol" }
traits = { path = "../../traits" }
jsonrpc = { path = "../../jsonrpc" }
lsp = { path = "../../lsp" }
platform-common = { path = "../common" }
sandbox = { path = "../../sandbox" }
api-client = { path = "../../api-client" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures = "0.3"
futures-core = { workspace = true }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
fs2 = "0.4"
notify = "8"
notify-debouncer-mini = "0.6"
tokio-stream = "0.1"
which = "6"
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.27", default-features = false, features = ["signal", "process"] }
libc = "0.2"
unicode-normalization = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3.13"
# Axum + tokio TcpListener for the MCP WebSocket roundtrip integration test
# (`tests/mcp_ws_test.rs`). `ws` enables the WebSocketUpgrade extractor.
axum = { version = "0.7", features = ["ws"] }
url = "2"
# Integration test (`tests/mcp_client_stdio_test.rs`) drives the real
# `lingxi_mcp::McpClient` over a stdio-spawned mock MCP server.
mcp = { path = "../../mcp" }
futures-util = "0.3"

[lints]
workspace = true
