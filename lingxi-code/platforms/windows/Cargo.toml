[package]
name = "lingxi-platform-windows"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lingxi-protocol = { path = "../../crates/protocol" }
lingxi-traits = { path = "../../crates/traits" }
lingxi-jsonrpc = { path = "../../crates/jsonrpc" }
lingxi-lsp = { path = "../../crates/lsp" }
lingxi-platform-common = { path = "../common" }
lingxi-api-client = { path = "../../crates/api-client" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures = "0.3"
futures-core = { workspace = true }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
fs2 = "0.4"
notify = "8"
notify-debouncer-mini = "0.6"
tokio-stream = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3.13"
axum = "0.7"

[lints]
workspace = true
