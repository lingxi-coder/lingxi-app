[package]
name = "providers"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
api-client = { path = "../api-client" }
cost = { path = "../cost" }
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures = { workspace = true }
gcp_auth = "0.12"
tokio = { workspace = true, features = ["sync", "time", "process"] }
aws-sigv4 = "1"
aws-credential-types = "1"
# NOTE: `aws-smithy-eventstream` is intentionally NOT used — it floors
# `aws-smithy-types` at ^1.3.4, whose only published match (1.3.6) requires
# rustc 1.88, breaking the pinned Rust 1.82 toolchain. Bedrock streaming uses
# the hand-rolled `eventstream` frame decoder in this crate instead.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
