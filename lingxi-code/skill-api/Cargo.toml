[package]
name = "skill-api"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P8: the skill abstraction crate — Skill data model, SkillRegistry (trigger
# discovery), markdown frontmatter loader, and MCP-derived skill builders.
# Extracted from the former monolithic `skills` crate; mirrors the `tool-api`
# pattern. The model-visible `Skill` *tool* lives in `tool-skill` (P7);
# compiled-in builtin skill templates live in `skill-builtin` (P8).

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
serde.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true

[lints]
workspace = true
