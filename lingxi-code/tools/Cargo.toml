[package]
name = "lingxi-tools"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-core = { path = "../core" }
lingxi-permission = { path = "../permission" }
lingxi-sandbox = { path = "../sandbox" }
lingxi-telemetry = { path = "../telemetry" }
lingxi-api-client = { path = "../api-client" }
# M4-07 — MCP + LSP tool wrappers.
lingxi-mcp = { path = "../mcp" }
lingxi-lsp = { path = "../lsp" }
lingxi-jsonrpc = { path = "../jsonrpc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures = "0.3"
once_cell = "1"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
url = "2"
# M4-01 — walker + globber + ripgrep bindings
walkdir = "2.5"
globset = "=0.4.15"
ignore = "=0.4.23"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
grep-matcher = "=0.1.7"
# M4-05 — task-id generation (no cyclic dep on lingxi-tasks; the
# byte-locked `[bartwmd][0-9a-z]{8}` format is mirrored here).
rand = "0.9"

[dev-dependencies]
tempfile = "3.13"
regex = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "sync", "time", "net"] }
filetime = "0.2"
axum = "0.7"
lingxi-test-harness = { path = "../test-harness" }

[target.'cfg(unix)'.dev-dependencies]
lingxi-platform-posix = { path = "../platforms/posix" }

[lints]
workspace = true
