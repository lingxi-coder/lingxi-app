[package]
name = "tool-agent"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
async-trait = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
once_cell = "1"
thiserror.workspace = true

[features]
# Exposes agent_test_support (M4-05 subagent/mailbox/task/budget mocks) for
# downstream crates' tests (e.g. the tools integration suite).
agent-test-support = ["dep:async-trait"]

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
engine = { path = "../../engine" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
