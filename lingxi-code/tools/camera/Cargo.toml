[package]
name = "tool-camera"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11: mobile-exclusive `camera` tool. Pure Rust — routes to the
# `Arc<dyn CameraControl>` carried in BuiltinToolContext (a Swift/Kotlin impl
# injected via UniFFI in P12). Linked only by the engine-mobile composition root.

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
permission = { path = "../../permission" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
