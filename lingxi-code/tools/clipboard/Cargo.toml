[package]
name = "tool-clipboard"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile-exclusive `clipboard` tool. Routes to the Arc<dyn Clipboard> in
# BuiltinToolContext (native Swift/Kotlin impl injected via UniFFI). Engine-
# driven: the model reads/writes the system clipboard — no user-facing UI affordance.

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
permission = { path = "../../permission" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
