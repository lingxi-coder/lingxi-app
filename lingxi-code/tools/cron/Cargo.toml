[package]
name = "tool-cron"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
once_cell = "1"
rand = "0.9"
thiserror.workspace = true
# Reuse the live scheduler's local-timezone source for the `next_fire_unix_secs`
# preview (keeps the preview consistent with where the `cron` scheduler actually
# fires). Only `cron::schedule::local_offset_seconds` is used — no `unsafe` here.
cron = { path = "../../cron" }

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
engine = { path = "../../engine" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
