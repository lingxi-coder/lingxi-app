[package]
name = "tool-file"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
once_cell = "1"
walkdir = "2.5"
globset = "=0.4.15"
ignore = "=0.4.23"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
grep-matcher = "=0.1.7"
thiserror.workspace = true
# Image decode/resize/re-encode for FileRead image reading (claude-code's image
# path). Optional + gated behind `image-read`; matches codex (no defaults, the
# four codecs only). base64 encodes the processed image for the Anthropic source.
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
base64 = { version = "=0.22.1", optional = true }
# PDF page-count parsing for FileRead PDF routing (claude-code getPDFPageCount).
# Pure-Rust PARSER (NOT a renderer — page-image extraction is P4b). Optional.
# default-features = false drops the nom parser (get_pages would fail to link),
# so defaults stay ON — the parser is exactly what we need. Pinned exact.
lopdf = { version = "=0.34.0", optional = true }

[features]
# FileRead image reading. OFF by default (engine-mobile/minimal stay lean and
# never compile the image codecs); engine-desktop enables it.
image-read = ["dep:image", "dep:base64"]
# FileRead PDF reading. OFF by default; routes PDFs to an inline document block
# (page-count gate via lopdf). engine-desktop enables it alongside image-read.
pdf-read = ["dep:lopdf", "dep:base64"]

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
tempfile = "3"
filetime = "0.2"

[lints]
workspace = true
