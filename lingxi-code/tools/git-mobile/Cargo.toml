[package]
name = "tool-git-mobile"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile-only (Android) structured `Git` tool. Backed by libgit2 (the `git2`
# crate) running IN-PROCESS — read + local-write git (no push), HTTPS-token
# auth supplied in-memory by the Kotlin host. Decoupled from minijail (libgit2
# is a library: no exec, no W^X, no sandbox). Registered ONLY when the device +
# config gate passes (computed in android-aar and threaded through MobileConfig
# -> BuiltinToolContext.android_git).

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
permission = { path = "../../permission" }
thiserror.workspace = true
# Vendored git2 (T1). The `https` feature is REQUIRED — it enables the OpenSSL
# TLS backend; without it clone/fetch fail. `ssh` enables the libssh2 SSH
# transport built over the same vendored OpenSSL crypto backend (G7a).
# `vendored-libgit2`+`vendored-openssl` build their bundled C under the NDK
# (and on the host, which keeps the local ops host-testable).
git2 = { path = "../../../third_party/git2-rs/git2", default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
    "https",
    "ssh",
] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
