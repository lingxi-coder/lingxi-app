[package]
name = "tool-speech"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile-exclusive `speech` tool. Routes to the Arc<dyn SpeechToText> /
# Arc<dyn TextToSpeech> in BuiltinToolContext (native Swift/Kotlin impl injected
# via UniFFI). Sibling of `tool-voice` (raw mic capture); this is ASR/TTS.

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
permission = { path = "../../permission" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
