[package]
name = "tool-voice"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11: mobile-exclusive `voice` tool. Routes to the Arc<dyn VoiceRecorder>
# in BuiltinToolContext (native Swift/Kotlin impl injected via UniFFI in P12).

[dependencies]
tool-api = { path = "../../tool-api" }
traits = { path = "../../traits" }
permission = { path = "../../permission" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
