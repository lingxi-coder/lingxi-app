[package]
name = "traits"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
# The LSP transport exposes its live `Arc<jsonrpc::Connection>` so the registry
# can bridge it into an `LspClient` (lsp `ensure_server_for_file`). jsonrpc is a
# leaf crate (no `traits` dep) → no cycle.
jsonrpc = { path = "../jsonrpc" }
async-trait.workspace = true
futures-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` only (mpsc channels) — the `SubagentSpawner::spawn_with_progress`
# nested-progress stream. No runtime pulled into this low-level crate.
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true

[dev-dependencies]
# `#[tokio::test]` for the async default-impl test on `HttpTransport`.
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[lints]
workspace = true
