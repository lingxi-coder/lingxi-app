[package]
name = "tui-rata"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The backend-neutral core extracted from `tui` during the iocraft → ratatui
# migration. `tui-rata` renders it with ratatui; it must never depend on iocraft.
tui-core = { path = "../tui-core" }
permission = { path = "../permission" }
# Ratatui 0.29 uses crossterm 0.28 — the SAME major the workspace pins — so only
# one crossterm version links (verified via `cargo tree -p tui-rata -i crossterm`).
# All three features are dependency-free cfg gates, also enabled by codex-rs/tui:
# `scrolling-regions` unlocks `Backend::scroll_region_up/down` (bottom-anchored
# custom terminal room-making); `unstable-widget-ref` unlocks `WidgetRef` and
# `unstable-rendered-line-info` unlocks `Paragraph::line_count`, both needed by
# the `renderable` height/render contract ported from codex.
ratatui = { version = "0.29", features = [
    "scrolling-regions",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
crossterm = { workspace = true }
# Inline-image widget (kitty/iTerm2/sixel). v5 targets ratatui 0.29. Its default
# `image-defaults` feature enables `image/default`, which pulls the AVIF codec
# chain (avif-serialize/moxcms) that needs edition2024 / rustc 1.85 (> workspace
# 1.82) — so default features are OFF and `image` is brought in directly with
# only png+jpeg (pinned to 0.25.5 in Cargo.lock, below the 0.25.6 moxcms bump).
ratatui-image = { version = "=5.0.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
# Display-column width for CJK/wide-char-aware cursor positioning in the composer.
unicode-width = "=0.1.14"

[dev-dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }

[lints]
workspace = true
