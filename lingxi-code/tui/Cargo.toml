[package]
name = "tui"
version = "0.8.0"   # bumped to 0.8.0 in M7-16
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
traits = { path = "../traits" }
orchestrator = { path = "../orchestrator" }
telemetry = { path = "../telemetry" }
engine = { path = "../engine" }
permission = { path = "../permission" }
commands = { path = "../commands" }
session = { path = "../session" }
# (M7-14) CLAUDE.md hierarchy walker + loader — the M3 store the Memory editor
# reads through and writes back to (§4 R7: no new persistence layer).
memory = { path = "../memory" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

iocraft = "=0.8.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
crossterm = { workspace = true, features = ["event-stream"] }
# Syntax highlighting — pure-Rust fancy-regex backend (NO onig C dep). MSRV 1.82
# verified in M7-02 Task 1 with the transitive pins below.
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
# Line- + word-level diff for StructuredDiff. Reuses the version already in
# the workspace lockfile (2.7.0); 3.x requires Rust 1.85 > our MSRV 1.82.
similar = "=2.7.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }
# (M7-03) Column-accurate wrap measurement for the line-based scroll model.
# Exact-pinned to the version already locked in the workspace (0.1.14).
unicode-width = "=0.1.14"
# (M7-06) Grapheme-correct cursor/column geometry for the multi-line editor.
# Exact-pinned to the version already resolved in the workspace lockfile.
unicode-segmentation = "=1.12.0"
# (M7-11) Config-home resolution for the Doctor screen (`~/.claude`). Already
# a direct dep of bridge/cli/orchestrator at the same major (5.0.1 in the
# workspace lockfile) — no new major introduced.
dirs = "5"

[dev-dependencies]
insta = { version = "1.40", features = ["yaml"] }
assert_cmd = "=2.0.16"
predicates = "3"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# (M7-13) Internal path-dep for `MockOrchestratorHandle` in the Settings
# read-real-values + edit-through-handle behavior tests. Not a new workspace
# dep; no cycle (orchestrator does not depend on tui).
orchestrator = { path = "../orchestrator" }

[lints]
workspace = true
