[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/traits",
    "crates/api-client",
    "crates/test-harness",
    "crates/secret",
    "crates/cost",
    "crates/permission",
    "crates/tools",
    "crates/hooks",
    "crates/memory",
    "crates/jsonrpc",
    "crates/mcp",
    "crates/compaction",
    "crates/agent",
    "crates/tasks",
    "crates/coordinator",
    "crates/sidequery",
    "crates/skills",
    "crates/commands",
    "crates/outputstyles",
    "crates/filestate",
    "crates/msgqueue",
    "crates/session",
    "crates/cron",
    "crates/sandbox",
    "crates/lsp",
    "crates/telemetry",
    "crates/anthropic-oauth",
    "crates/bridge",
    "crates/plugin",
    "crates/uniffi-bridge",
    "platforms/common",
    "platforms/posix-minimal",
    "platforms/posix",
    "platforms/windows",
    "examples/cli-demo",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["LingXi Core Contributors"]
repository = "https://github.com/lingxi/lingxi-core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps `serde_json::Map` keys in insertion order across
# Value round-trips. Required for claude-code wire-byte fidelity: outbound
# MCP/LSP requests serialize through the JSON-RPC router's
# `serde_json::to_value(params)` pass and the resulting bytes must keep
# the order claude-code emits (e.g. `capabilities` declared as
# `{"roots":{},"elicitation":{}}`, not the alphabetized
# `{"elicitation":{},"roots":{}}`).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures-core = "0.3"

# dev-only
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
dashmap = "6"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
