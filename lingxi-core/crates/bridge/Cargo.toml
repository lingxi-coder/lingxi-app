[package]
name = "lingxi-bridge"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-secret = { path = "../secret" }
lingxi-jsonrpc = { path = "../jsonrpc" }
lingxi-mcp = { path = "../mcp" }
lingxi-platform-common = { path = "../../platforms/common" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
tracing.workspace = true
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
dirs = "5"
tokio-tungstenite = "0.21"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http = "1"

[lints]
workspace = true
