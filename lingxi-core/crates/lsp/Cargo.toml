[package]
name = "lingxi-lsp"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-jsonrpc = { path = "../jsonrpc" }
lsp-types = "0.95"
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing.workspace = true
once_cell = "1"

[dev-dependencies]
tempfile = "3.13"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt-multi-thread", "process", "time", "test-util"] }
lingxi-test-harness = { path = "../test-harness" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
lingxi-platform-posix = { path = "../../platforms/posix" }

[lints]
workspace = true
