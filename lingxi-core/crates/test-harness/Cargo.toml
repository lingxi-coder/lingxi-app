[package]
name = "lingxi-test-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Bumps proptest case counts in property suites to 10K. Off by default so
# `cargo test --workspace` stays fast; CI flips this on for the nightly job.
# M1.23 ships the feature flag plumbing only — existing property tests do not
# yet read it; the migration lands alongside the M2 property suite expansion.
"10k-iterations" = []

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-core = { path = "../core" }
lingxi-api-client = { path = "../api-client" }
lingxi-cost = { path = "../cost" }
lingxi-hooks = { path = "../hooks" }
lingxi-mcp = { path = "../mcp" }
lingxi-compaction = { path = "../compaction" }
lingxi-coordinator = { path = "../coordinator" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures = "0.3"
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
# Hyper-based in-process echo server used by the `contracts::http` suite.
# The test-harness is dev-only (consumers depend on it via `dev-dependencies`)
# so this does not bleed into production builds.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"

[dev-dependencies]
proptest.workspace = true
lingxi-platform-posix-minimal = { path = "../../platforms/posix-minimal" }
# Used by the M2-07 Phase B parity drivers to exercise production
# `convert_settings_to_runtime_config` (sandbox config conversion fixture).
lingxi-sandbox = { path = "../sandbox" }
# Used by the M2-07 Phase B LSP parity driver to confirm `LspRegistry`
# `register_config` visibility stays `pub(crate)`.
lingxi-lsp = { path = "../lsp" }
# Used by the M2-07 contract drivers that need a real on-disk root
# (worktree, secure_storage). Dev-only — never reaches production builds.
tempfile = "3.13"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
lingxi-platform-posix = { path = "../../platforms/posix" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
lingxi-platform-windows = { path = "../../platforms/windows" }

[[bin]]
name = "mock_lsp_server"
path = "src/bin/mock_lsp_server.rs"

[lints]
workspace = true
