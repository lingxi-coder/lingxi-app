[package]
name = "lingxi-test-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Bumps proptest case counts in property suites to 10K. Off by default so
# `cargo test --workspace` stays fast; CI flips this on for the nightly job.
# M1.23 ships the feature flag plumbing only — existing property tests do not
# yet read it; the migration lands alongside the M2 property suite expansion.
"10k-iterations" = []

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-core = { path = "../core" }
lingxi-api-client = { path = "../api-client" }
lingxi-cost = { path = "../cost" }
lingxi-hooks = { path = "../hooks" }
lingxi-mcp = { path = "../mcp" }
lingxi-compaction = { path = "../compaction" }
lingxi-coordinator = { path = "../coordinator" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures = "0.3"
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
lingxi-platform-posix-minimal = { path = "../../platforms/posix-minimal" }

[[bin]]
name = "mock_lsp_server"
path = "src/bin/mock_lsp_server.rs"

[lints]
workspace = true
