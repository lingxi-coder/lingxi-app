[package]
name = "lingxi-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-core = { path = "../core" }
lingxi-permission = { path = "../permission" }
lingxi-sandbox = { path = "../sandbox" }
lingxi-telemetry = { path = "../telemetry" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures = "0.3"
once_cell = "1"
tokio = { workspace = true }
tracing.workspace = true
# M4-01 — walker + globber + ripgrep bindings
walkdir = "2.5"
globset = "=0.4.15"
ignore = "=0.4.23"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
grep-matcher = "=0.1.7"

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
filetime = "0.2"

[target.'cfg(unix)'.dev-dependencies]
lingxi-platform-posix = { path = "../../platforms/posix" }

[lints]
workspace = true
