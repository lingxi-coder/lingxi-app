[package]
name = "lingxi-tui"
version = "0.7.0"   # bumped to 0.7.0 in M6-09
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
lingxi-protocol = { path = "../protocol" }
lingxi-traits = { path = "../traits" }
lingxi-orchestrator = { path = "../orchestrator" }
lingxi-telemetry = { path = "../telemetry" }
lingxi-core = { path = "../core" }
lingxi-permission = { path = "../permission" }
lingxi-commands = { path = "../commands" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

iocraft = "=0.8.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
crossterm = { workspace = true, features = ["event-stream"] }
# Syntax highlighting — pure-Rust fancy-regex backend (NO onig C dep). MSRV 1.82
# verified in M7-02 Task 1 with the transitive pins below.
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
# Line- + word-level diff for StructuredDiff. Reuses the version already in
# the workspace lockfile (2.7.0); 3.x requires Rust 1.85 > our MSRV 1.82.
similar = "=2.7.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }
# (M7-03) Column-accurate wrap measurement for the line-based scroll model.
# Exact-pinned to the version already locked in the workspace (0.1.14).
unicode-width = "=0.1.14"
# (M7-06) Grapheme-correct cursor/column geometry for the multi-line editor.
# Exact-pinned to the version already resolved in the workspace lockfile.
unicode-segmentation = "=1.12.0"

[dev-dependencies]
insta = { version = "1.40", features = ["yaml"] }
assert_cmd = "=2.0.16"
predicates = "3"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
