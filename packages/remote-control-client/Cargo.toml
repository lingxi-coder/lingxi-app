[package]
name = "remote-control-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Viewer-side client of the LingXi Remote Control protocol (lingxi-rc/1)."

[features]
webrtc = ["dep:lingxi-webrtc-core", "dep:webrtc"]
native-media = ["webrtc", "dep:media-api", "dep:media-runtime", "dep:lingxi-webrtc-media", "dep:platform-windows", "dep:subtle", "lingxi-webrtc-media/gstreamer-media"]
static-media = ["native-media", "lingxi-webrtc-media/static-plugins"]

[dependencies]
# DTOs and `ClientEvent` come from the pinned runtime's client protocol; default
# features only (no adapter, no presentation, no UniFFI).
client = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
bytes.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "fs", "io-util", "io-std", "net", "process"] }
tokio-util.workspace = true
futures-util.workspace = true
ring = "0.17"
subtle = { version = "2.6.1", default-features = false, optional = true }
tempfile = "3"
base64 = "0.22"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
eventsource-stream = "0.2"
lingxi-webrtc-core = { workspace = true, optional = true }
media-api = { workspace = true, optional = true }
media-runtime = { workspace = true, optional = true }
lingxi-webrtc-media = { workspace = true, optional = true }
webrtc = { version = "=0.21.1", optional = true }

# Mobile applications link the explicit static SDK selected by their build
# toolchain. Host-side contract checks use the native GStreamer SDK instead.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
lingxi-webrtc-media = { workspace = true, optional = true, features = ["static-plugins"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util", "net", "io-util"] }

[lints]
workspace = true
