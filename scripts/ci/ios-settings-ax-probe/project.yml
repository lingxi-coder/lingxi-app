name: SettingsAXProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SettingsAXProbe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.settings-ax-probe
  SettingsAXProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SettingsAXProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.settings-ax-probe.uitests
        TEST_TARGET_NAME: SettingsAXProbe
schemes:
  SettingsAXProbe:
    build:
      targets:
        SettingsAXProbe: all
        SettingsAXProbeUITests: [test]
    test:
      targets: [SettingsAXProbeUITests]
